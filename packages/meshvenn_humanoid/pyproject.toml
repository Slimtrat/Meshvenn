[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meshvenn-humanoid"
version = "0.1.0"
description = "Engine-independent humanoid deformation quality and regeneration supervisor"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = []

[project.scripts]
meshvenn-humanoid = "meshvenn_humanoid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["meshvenn_humanoid*"]
