name: Engine library and agent plugin

on:
  pull_request:
    paths:
      - 'core/**'
      - 'lib/meshvenn_engine/**'
      - 'packages/meshvenn_agent/**'
      - 'pyproject.toml'
      - 'setup.py'
      - 'MANIFEST.in'
      - 'native/**'
      - 'tests/test_engine_library*'
      - 'scripts/smoke_engine_agent_install.py'
      - '.github/workflows/engine_agent_library.yml'
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'lib/meshvenn_engine/**'
      - 'packages/meshvenn_agent/**'
      - 'pyproject.toml'
      - 'setup.py'
      - 'MANIFEST.in'
      - 'native/**'
      - 'tests/test_engine_library*'
      - 'scripts/smoke_engine_agent_install.py'
      - '.github/workflows/engine_agent_library.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-agent-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Installed libraries (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    env:
      MESHVENN_TEST_ENGINE_PACKAGING: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install build tooling and optional MCP adapter dependencies
        run: python -m pip install 'build>=1.2,<2' 'setuptools>=77' wheel 'mcp>=2,<3'
      - name: Build native library on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native -B build/agent-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DBPT_BUILD_TESTS=OFF
          cmake --build build/agent-native --parallel
          echo "MESHVENN_TEST_NATIVE_LIBRARY=${GITHUB_WORKSPACE}/build/agent-native/libbpt_core.so" >> "$GITHUB_ENV"
          echo "MESHVENN_TEST_NATIVE_DLL=${GITHUB_WORKSPACE}/build/agent-native/libbpt_core.so" >> "$GITHUB_ENV"
      - name: Build native library on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S native -B build/agent-native -A x64 -DBPT_BUILD_TESTS=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/agent-native --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $agentLibrary = Join-Path $env:GITHUB_WORKSPACE 'build/agent-native/Release/bpt_core.dll'
          "MESHVENN_TEST_NATIVE_LIBRARY=$agentLibrary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MESHVENN_TEST_NATIVE_DLL=$agentLibrary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build both standalone distributions
        shell: bash
        run: |
          set -euo pipefail
          python -m build --no-isolation --sdist --wheel --outdir dist/engine .
          python -m build --no-isolation --sdist --wheel --outdir dist/agent packages/meshvenn_agent
          python -m pip install --no-deps --force-reinstall dist/engine/*.whl dist/agent/*.whl
      - name: Verify source distributions and isolated installed engine
        run: python -m unittest tests.test_engine_library tests.test_engine_library_packaging -v
      - name: Verify gateway and actual MCP protocol
        run: python -m unittest discover -s packages/meshvenn_agent/tests -p 'test_*.py' -v
      - name: Exercise installed agent through the native engine
        shell: bash
        run: |
          set -euo pipefail
          python -I scripts/smoke_engine_agent_install.py --native-library "$MESHVENN_TEST_NATIVE_LIBRARY" --output tmp/installed-agent-evidence
      - name: Preserve distributions and actual installed execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-agent-${{ matrix.os }}-python-${{ matrix.python }}
          path: |
            dist/engine
            dist/agent
            tmp/installed-agent-evidence
            build/agent-native/libbpt_core.so
            build/agent-native/Release/bpt_core.dll
          if-no-files-found: error
