name: Examples

on:
  pull_request:
    paths:
      - "core/**"
      - "scripts/**"
      - "example/**/sheets/**"
      - ".github/workflows/examples.yml"

  push:
    branches:
      - main
    paths:
      - "core/**"
      - "scripts/**"
      - "example/**/sheets/**"
      - ".github/workflows/examples.yml"

  workflow_dispatch:
    inputs:
      example:
        description: >
          Example à générer.
          "all" ou par exemple "mascotte/test1".
        required: true
        default: "all"
        type: string

      start_sheet:
        description: >
          Commencer à partir de cette planche.
          Vide = toutes.
          Exemple: sheet2.png
          ou mascotte/test1/sheets/sheet2.png
        required: false
        default: ""
        type: string

      profiles:
        description: >
          Profils séparés par espaces.
          Exemple: L2 L4 L8 L10
        required: true
        default: "L2 L4 L8 L10"
        type: string

      resolution:
        description: "Résolution voxel"
        required: true
        default: "64"
        type: choice
        options:
          - "32"
          - "48"
          - "64"
          - "96"
          - "128"

      commit_results:
        description: >
          Committer les GLB, manifests et découpes sur main.
        required: true
        default: true
        type: boolean


permissions:
  contents: write


concurrency:
  group: examples-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true


env:
  BLENDER_VERSION: "5.2.1"
  BLENDER_ROOT: "${{ github.workspace }}/.blender"
  BLENDER_ARCHIVE: "blender-5.2.1-linux-x64.tar.xz"
  BLENDER_BASE_URL: "https://download.blender.org/release/Blender5.2"


jobs:

  config:
    name: Configure
    runs-on: ubuntu-latest

    outputs:
      mode: ${{ steps.config.outputs.mode }}
      example: ${{ steps.config.outputs.example }}
      start_sheet: ${{ steps.config.outputs.start_sheet }}
      profiles: ${{ steps.config.outputs.profiles }}
      resolution: ${{ steps.config.outputs.resolution }}
      commit_results: ${{ steps.config.outputs.commit_results }}

    steps:
      - name: Configure run
        id: config
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "mode=smoke" >> "$GITHUB_OUTPUT"
            echo "example=mascotte/test1" >> "$GITHUB_OUTPUT"
            echo "start_sheet=sheet1.png" >> "$GITHUB_OUTPUT"
            echo "profiles=L2" >> "$GITHUB_OUTPUT"
            echo "resolution=32" >> "$GITHUB_OUTPUT"
            echo "commit_results=false" >> "$GITHUB_OUTPUT"

          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "mode=manual" >> "$GITHUB_OUTPUT"
            echo "example=${{ inputs.example }}" >> "$GITHUB_OUTPUT"
            echo "start_sheet=${{ inputs.start_sheet }}" >> "$GITHUB_OUTPUT"
            echo "profiles=${{ inputs.profiles }}" >> "$GITHUB_OUTPUT"
            echo "resolution=${{ inputs.resolution }}" >> "$GITHUB_OUTPUT"
            echo "commit_results=${{ inputs.commit_results }}" >> "$GITHUB_OUTPUT"

          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "example=all" >> "$GITHUB_OUTPUT"
            echo "start_sheet=" >> "$GITHUB_OUTPUT"
            echo "profiles=L2 L4 L8 L10" >> "$GITHUB_OUTPUT"
            echo "resolution=64" >> "$GITHUB_OUTPUT"
            echo "commit_results=true" >> "$GITHUB_OUTPUT"
          fi


  generate:
    name: Generate examples
    needs:
      - config

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------------------------------
      # Blender cache
      # -----------------------------------------------------

      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: .blender
          key: blender-linux-x64-${{ env.BLENDER_VERSION }}

      # -----------------------------------------------------
      # Robust Blender install
      # -----------------------------------------------------

      - name: Validate Blender download URL
        if: steps.blender-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          URL="${BLENDER_BASE_URL}/${BLENDER_ARCHIVE}"

          echo "Checking:"
          echo "${URL}"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --head \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 60 \
            "${URL}"

      - name: Download Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          URL="${BLENDER_BASE_URL}/${BLENDER_ARCHIVE}"
          ARCHIVE="/tmp/${BLENDER_ARCHIVE}"

          rm -rf "${BLENDER_ROOT}"
          mkdir -p "${BLENDER_ROOT}"

          echo "Downloading Blender ${BLENDER_VERSION}"
          echo "${URL}"

          curl \
            --fail \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 900 \
            --output "${ARCHIVE}" \
            "${URL}"

          if [[ ! -s "${ARCHIVE}" ]]; then
            echo "Downloaded archive is empty."
            exit 1
          fi

          echo "Archive size:"
          du -h "${ARCHIVE}"

      - name: Validate Blender archive
        if: steps.blender-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="/tmp/${BLENDER_ARCHIVE}"

          echo "Testing archive integrity..."

          xz \
            --test \
            "${ARCHIVE}"

          tar \
            -tJf "${ARCHIVE}" \
            > /dev/null

          echo "Archive is valid."

      - name: Extract Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="/tmp/${BLENDER_ARCHIVE}"

          tar \
            -xJf "${ARCHIVE}" \
            -C "${BLENDER_ROOT}" \
            --strip-components=1

          rm \
            "${ARCHIVE}"

      # -----------------------------------------------------
      # Verify cache or installation
      # -----------------------------------------------------

      - name: Verify Blender executable
        shell: bash
        run: |
          set -euo pipefail

          BLENDER_BIN="${BLENDER_ROOT}/blender"

          if [[ ! -f "${BLENDER_BIN}" ]]; then
            echo "Blender executable not found:"
            echo "${BLENDER_BIN}"

            echo "Blender directory:"
            find "${BLENDER_ROOT}" \
              -maxdepth 2 \
              -type f \
              | head -n 50

            exit 1
          fi

          chmod +x \
            "${BLENDER_BIN}"

          "${BLENDER_BIN}" \
            --version

          VERSION="$(
            "${BLENDER_BIN}" \
              --version \
              | head -n 1
          )"

          if [[ "${VERSION}" != *"Blender ${BLENDER_VERSION}"* ]]; then
            echo "Wrong Blender version."
            echo "Expected: ${BLENDER_VERSION}"
            echo "Actual: ${VERSION}"
            exit 1
          fi

      # -----------------------------------------------------
      # Configuration
      # -----------------------------------------------------

      - name: Generation configuration
        shell: bash
        run: |
          echo "Mode: ${{ needs.config.outputs.mode }}"
          echo "Example: ${{ needs.config.outputs.example }}"
          echo "Start sheet: ${{ needs.config.outputs.start_sheet }}"
          echo "Profiles: ${{ needs.config.outputs.profiles }}"
          echo "Resolution: ${{ needs.config.outputs.resolution }}"
          echo "Commit: ${{ needs.config.outputs.commit_results }}"

      # -----------------------------------------------------
      # Generation
      # -----------------------------------------------------

      - name: Generate
        shell: bash
        run: |
          set -euo pipefail

          BLENDER_BIN="${BLENDER_ROOT}/blender"

          COMMAND=(
            "${BLENDER_BIN}"
            "--background"
            "--factory-startup"
            "--python"
            "scripts/generate_all_in_blender.py"
            "--"
            "--examples"
            "example"
            "--example"
            "${{ needs.config.outputs.example }}"
            "--resolution"
            "${{ needs.config.outputs.resolution }}"
            "--continue-on-error"
          )

          START_SHEET="${{ needs.config.outputs.start_sheet }}"

          if [[ -n "${START_SHEET}" ]]; then
            COMMAND+=(
              "--start-sheet"
              "${START_SHEET}"
            )
          fi

          read -r -a PROFILES <<< \
            "${{ needs.config.outputs.profiles }}"

          if [[ "${#PROFILES[@]}" -gt 0 ]]; then
            COMMAND+=(
              "--profiles"
            )

            for PROFILE in "${PROFILES[@]}"; do
              COMMAND+=(
                "${PROFILE}"
              )
            done
          fi

          printf '[projection-tool] command:'
          printf ' %q' "${COMMAND[@]}"
          echo

          "${COMMAND[@]}"

      # -----------------------------------------------------
      # Diagnostics
      # -----------------------------------------------------

      - name: Show generated files
        if: always()
        shell: bash
        run: |
          find example \
            -type f \
            -path "*/generated/*" \
            -print \
            | sort \
            || true

      - name: Validate manifests
        shell: python
        run: |
          import json
          from pathlib import Path

          manifests = list(
              Path("example").rglob(
                  "generated/*/manifest.json"
              )
          )

          if not manifests:
              raise SystemExit(
                  "No manifest generated."
              )

          successful_profiles = 0

          for path in manifests:
              data = json.loads(
                  path.read_text(
                      encoding="utf-8"
                  )
              )

              generated = [
                  name
                  for name, profile
                  in data.get(
                      "profiles",
                      {}
                  ).items()
                  if profile.get(
                      "generated"
                  )
              ]

              print(
                  f"{path}: "
                  f"{generated}"
              )

              successful_profiles += len(
                  generated
              )

          if successful_profiles == 0:
              raise SystemExit(
                  "No successful scan profile."
              )

      # -----------------------------------------------------
      # Artifact
      # -----------------------------------------------------

      - name: Upload generated examples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projection-examples-${{ github.run_number }}

          path: |
            example/**/generated/**

          if-no-files-found: warn
          retention-days: 14

      # -----------------------------------------------------
      # Git tracking
      # -----------------------------------------------------

      - name: Prepare generated files for Git
        if: >
          needs.config.outputs.commit_results == 'true'
          && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          find example \
            -type f \
            -path "*/generated/*" \
            -name "*.blend" \
            -delete

          git status \
            --short

      - name: Commit generated examples
        if: >
          needs.config.outputs.commit_results == 'true'
          && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "projection-tool-bot"

          git config \
            user.email \
            "projection-tool-bot@users.noreply.github.com"

          git add \
            'example/**/generated/**'

          if git diff \
            --cached \
            --quiet
          then
            echo "Generated examples already up-to-date."
            exit 0
          fi

          git commit \
            -m \
            "chore: regenerate examples [generated examples]"

          git push \
            origin \
            HEAD:main