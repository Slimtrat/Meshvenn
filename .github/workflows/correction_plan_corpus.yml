name: Correction plan corpus

on:
  pull_request:
    paths:
      - 'core/correction_plans/**'
      - 'core/diagnostic_contracts/**'
      - 'core/diagnostics_preflight/**'
      - 'core/appearance_diagnostics/**'
      - 'core/geometry_diagnostics/**'
      - 'core/material_visibility/**'
      - 'core/projection_math/**'
      - 'core/projection_alignment.py'
      - 'core/projection_frame.py'
      - 'core/image_mask.py'
      - 'core/native_bridge/**'
      - 'core/native_loader.py'
      - 'native/**'
      - 'scripts/correction_plan_corpus/**'
      - 'scripts/qualify_correction_plans.py'
      - 'scripts/appearance_diagnostic_corpus/**'
      - 'scripts/geometry_diagnostic_corpus/**'
      - 'tests/fixtures/diagnostics/correction-plan-v1/**'
      - 'tests/fixtures/diagnostics/appearance-v1/**'
      - 'tests/fixtures/diagnostics/geometry-v1/**'
      - 'tests/test_correction_plan*.py'
      - '.github/workflows/correction_plan_corpus.yml'
  push:
    branches: [main]
    paths:
      - 'core/correction_plans/**'
      - 'core/diagnostic_contracts/**'
      - 'core/diagnostics_preflight/**'
      - 'core/appearance_diagnostics/**'
      - 'core/geometry_diagnostics/**'
      - 'core/material_visibility/**'
      - 'core/projection_math/**'
      - 'core/projection_alignment.py'
      - 'core/projection_frame.py'
      - 'core/image_mask.py'
      - 'core/native_bridge/**'
      - 'core/native_loader.py'
      - 'native/**'
      - 'scripts/correction_plan_corpus/**'
      - 'scripts/qualify_correction_plans.py'
      - 'scripts/appearance_diagnostic_corpus/**'
      - 'scripts/geometry_diagnostic_corpus/**'
      - 'tests/fixtures/diagnostics/correction-plan-v1/**'
      - 'tests/fixtures/diagnostics/appearance-v1/**'
      - 'tests/fixtures/diagnostics/geometry-v1/**'
      - 'tests/test_correction_plan*.py'
      - '.github/workflows/correction_plan_corpus.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: correction-plan-corpus-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Real D2-D4 to D5 (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build unchanged native engine on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native -B build/correction-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DBPT_BUILD_TESTS=OFF
          cmake --build build/correction-native --parallel
          echo "MESHVENN_TEST_NATIVE_LIBRARY=${GITHUB_WORKSPACE}/build/correction-native/libbpt_core.so" >> "$GITHUB_ENV"
      - name: Build unchanged native engine on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S native -B build/correction-native -A x64 -DBPT_BUILD_TESTS=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/correction-native --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $correctionLibrary = Join-Path $env:GITHUB_WORKSPACE 'build/correction-native/Release/bpt_core.dll'
          "MESHVENN_TEST_NATIVE_LIBRARY=$correctionLibrary" >> $env:GITHUB_ENV
      - name: Verify immutable sources and planner contracts
        run: python -m unittest discover -s tests -p 'test_correction_plan*.py' -v
      - name: Verify frozen author expectations
        run: python scripts/qualify_correction_plans.py --verify-only
      - name: Evaluate actual upstream diagnostics and checked D5 packages
        shell: bash
        run: |
          set -euo pipefail
          python scripts/qualify_correction_plans.py --native-library "$MESHVENN_TEST_NATIVE_LIBRARY" --output tmp/correction-plan-qualification
      - name: Retain actual diagnostics, failed plans and prepared packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: correction-plans-${{ matrix.os }}-python-${{ matrix.python }}
          path: tmp/correction-plan-qualification
          retention-days: 14
          if-no-files-found: error
