name: GLB V2 Benchmark

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      asset:
        description: Static GLB to reconstruct from rendered views
        type: choice
        default: avocado
        options:
          - avocado
          - barramundi_fish
          - boom_box
          - toy_car

permissions:
  contents: read

concurrency:
  group: glb-v2-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BLENDER_VERSION: "5.2.1"
  BLENDER_ARCHIVE: "blender-5.2.1-linux-x64.tar.xz"
  BLENDER_BASE_URL: "https://download.blender.org/release/Blender5.2"
  BLENDER_ROOT: "${{ github.workspace }}/.blender"

jobs:
  benchmark:
    name: GLB import and 2D to 3D score
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify pinned V2 assets and metric semantics
        run: python -m unittest tests.test_v2_assets tests.test_glb_v2_metrics tests.test_glb_v2_rig_metrics tests.test_glb_v2_pose_metrics tests.test_glb_v2_combined_metrics tests.test_glb_v2_motion_metrics tests.test_glb_v2_contact_metrics tests.test_glb_v2_ik_metrics tests.test_two_bone_ik tests.test_glb_v2_character_support tests.test_canonical_rig_v2 tests.test_rig_lower_body tests.test_rig_skinning tests.test_motion_contracts tests.test_canonical_motion_mapping tests.test_rig_compatibility tests.test_export_contracts tests.test_export_paths tests.test_glb_export_manifest tests.test_glb_input_contracts tests.test_glb_pipeline_score tests.test_glb_auto_route_decision -v

      - name: Build native reconstruction engine
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native -B build/native -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBPT_BUILD_TESTS=OFF
          cmake --build build/native --parallel
          mkdir -p native/bin
          cp build/native/libbpt_core.so native/bin/libbpt_core.so

      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: .blender
          key: blender-linux-x64-${{ env.BLENDER_VERSION }}

      - name: Download Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${BLENDER_ROOT}"
          archive="${RUNNER_TEMP}/${BLENDER_ARCHIVE}"
          curl --fail --show-error --location --retry 5 --retry-all-errors \
            --connect-timeout 20 --max-time 900 \
            --output "${archive}" "${BLENDER_BASE_URL}/${BLENDER_ARCHIVE}"
          xz --test "${archive}"
          tar -xJf "${archive}" -C "${BLENDER_ROOT}" --strip-components=1
          rm "${archive}"

      - name: Verify 3D surface metric
        shell: bash
        run: |
          set -euo pipefail
          "${BLENDER_ROOT}/blender" --background --factory-startup \
            --python-exit-code 1 --python tests/blender_glb_v2_surface_smoke.py

      - name: Verify organic geometry and calibrated projection frames
        shell: bash
        run: |
          set -euo pipefail
          "${BLENDER_ROOT}/blender" --background --factory-startup \
            --python-exit-code 1 --python tests/blender_native_refinement_smoke.py

      - name: Run GLB V2 reconstruction benchmarks
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            assets=("${{ inputs.asset }}")
          else
            assets=(avocado barramundi_fish boom_box toy_car)
          fi
          for asset in "${assets[@]}"; do
            "${BLENDER_ROOT}/blender" --background --factory-startup \
              --python-exit-code 1 --python scripts/benchmark_glb_v2.py -- \
              --asset "${asset}" --resolution 48 --min-iou 0.65 \
              --min-surface-fscore 0.60 --max-extent-error 0.25 \
              --output "${RUNNER_TEMP}/v2-benchmark/${asset}"
          done

      - name: Retarget, export and roundtrip real RiggedFigure motion
        shell: bash
        run: |
          set -euo pipefail
          "${BLENDER_ROOT}/blender" --background --factory-startup \
            --python-exit-code 1 --python tests/blender_motion_smoke.py -- \
            --package-root "${GITHUB_WORKSPACE}" \
            --output "${RUNNER_TEMP}/v2-benchmark/motion"

      - name: Gate 51 clips, dense sole fidelity and opt-in pelvis height
        shell: bash
        run: |
          set -euo pipefail
          "${BLENDER_ROOT}/blender" --background --factory-startup \
            --python-exit-code 1 --python tests/blender_motion_probe_smoke.py
          for asset in rigged_figure quaternius_human quaternius_ual1; do
            for mode in rotation_only pelvis_height; do
              options=()
              if [[ "${mode}" == pelvis_height ]]; then
                options+=(--preserve-pelvis-height)
              fi
              "${BLENDER_ROOT}/blender" --background --factory-startup \
                --python-exit-code 1 --python scripts/benchmark_motion_v2.py -- \
                --asset "${asset}" --fps 60 "${options[@]}" \
                --output "${RUNNER_TEMP}/v2-benchmark/motion_${asset}_${mode}"
            done
          done

      - name: Gate opt-in surface-feedback contact IK separately from FK fidelity
        shell: bash
        run: |
          set -euo pipefail
          "${BLENDER_ROOT}/blender" --background --factory-startup \
            --python-exit-code 1 --python tests/blender_contact_ik_smoke.py
          for asset in rigged_figure quaternius_human quaternius_ual1; do
            "${BLENDER_ROOT}/blender" --background --factory-startup \
              --python-exit-code 1 --python scripts/benchmark_contact_ik_v2.py -- \
              --asset "${asset}" \
              --output "${RUNNER_TEMP}/v2-benchmark/contact_ik_${asset}"
          done

      - name: Run GLB-first pipelines across certified rig profiles
        shell: bash
        run: |
          set -euo pipefail
          "${BLENDER_ROOT}/blender" --background --factory-startup \
            --python-exit-code 1 \
            --python tests/blender_glb_first_pipeline_smoke.py -- \
            --package-root "${GITHUB_WORKSPACE}" \
            --input example/v2/assets/RiggedFigure.glb \
            --static-input example/v2/assets/ToyCar.glb \
            --unsupported-input example/v2/assets/RiggedSimple.glb \
            --output "${RUNNER_TEMP}/v2-benchmark/glb_first"

          "${BLENDER_ROOT}/blender" --background --factory-startup \
            --python-exit-code 1 \
            --python tests/blender_glb_first_pipeline_smoke.py -- \
            --package-root "${GITHUB_WORKSPACE}" \
            --input example/v2/assets/RobotExpressive.glb \
            --expected-profile threejs-robot-expressive-v1 \
            --expected-animations 14 \
            --output "${RUNNER_TEMP}/v2-benchmark/glb_first_robot"

          "${BLENDER_ROOT}/blender" --background --factory-startup \
            --python-exit-code 1 \
            --python tests/blender_glb_first_pipeline_smoke.py -- \
            --package-root "${GITHUB_WORKSPACE}" \
            --input example/v2/assets/Fox.glb \
            --expected-profile khronos-fox-v1 \
            --expected-archetype quadruped \
            --expect-incompatible \
            --output "${RUNNER_TEMP}/v2-benchmark/glb_first_fox"

      - name: Preserve source GLB rigs, skins and Motion
        shell: bash
        run: |
          set -euo pipefail
          "${BLENDER_ROOT}/blender" --background --factory-startup \
            --python-exit-code 1 --python tests/blender_glb_preservation_smoke.py -- \
            --package-root "${GITHUB_WORKSPACE}" \
            --input example/v2/assets/RiggedFigure.glb \
            --expected-profile rigged-figure-v1 \
            --expected-archetype humanoid --expected-animations 1 \
            --unsupported-input example/v2/assets/RiggedSimple.glb \
            --output "${RUNNER_TEMP}/v2-benchmark/preserved_rigged_figure"

          "${BLENDER_ROOT}/blender" --background --factory-startup \
            --python-exit-code 1 --python tests/blender_glb_preservation_smoke.py -- \
            --package-root "${GITHUB_WORKSPACE}" \
            --input example/v2/assets/RobotExpressive.glb \
            --expected-profile threejs-robot-expressive-v1 \
            --expected-archetype humanoid --expected-animations 14 \
            --output "${RUNNER_TEMP}/v2-benchmark/preserved_robot"

          "${BLENDER_ROOT}/blender" --background --factory-startup \
            --python-exit-code 1 --python tests/blender_glb_preservation_smoke.py -- \
            --package-root "${GITHUB_WORKSPACE}" \
            --input example/v2/assets/Fox.glb \
            --expected-profile khronos-fox-v1 \
            --expected-archetype quadruped --expected-animations 3 \
            --output "${RUNNER_TEMP}/v2-benchmark/preserved_fox"

      - name: Route GLB characters automatically
        shell: bash
        run: |
          set -euo pipefail
          "${BLENDER_ROOT}/blender" --background --factory-startup \
            --python-exit-code 1 --python tests/blender_glb_auto_route_smoke.py -- \
            --package-root "${GITHUB_WORKSPACE}" \
            --input example/v2/assets/RiggedFigure.glb \
            --expected-route preserve-source --expected-profile rigged-figure-v1 \
            --expected-animations 1 \
            --output "${RUNNER_TEMP}/v2-benchmark/auto_rigged_figure"

          "${BLENDER_ROOT}/blender" --background --factory-startup \
            --python-exit-code 1 --python tests/blender_glb_auto_route_smoke.py -- \
            --package-root "${GITHUB_WORKSPACE}" \
            --input example/v2/assets/RobotExpressive.glb \
            --expected-route preserve-source \
            --expected-profile threejs-robot-expressive-v1 \
            --expected-animations 14 \
            --output "${RUNNER_TEMP}/v2-benchmark/auto_robot"

          "${BLENDER_ROOT}/blender" --background --factory-startup \
            --python-exit-code 1 --python tests/blender_glb_auto_route_smoke.py -- \
            --package-root "${GITHUB_WORKSPACE}" \
            --input example/v2/assets/Fox.glb \
            --expected-route preserve-source --expected-profile khronos-fox-v1 \
            --expected-animations 3 \
            --output "${RUNNER_TEMP}/v2-benchmark/auto_fox"

          "${BLENDER_ROOT}/blender" --background --factory-startup \
            --python-exit-code 1 --python tests/blender_glb_auto_route_smoke.py -- \
            --package-root "${GITHUB_WORKSPACE}" \
            --input example/v2/assets/RiggedSimple.glb \
            --expected-route geometry-only --expected-animations 0 \
            --output "${RUNNER_TEMP}/v2-benchmark/auto_rigged_simple"

          "${BLENDER_ROOT}/blender" --background --factory-startup \
            --python-exit-code 1 --python tests/blender_glb_auto_route_smoke.py -- \
            --package-root "${GITHUB_WORKSPACE}" \
            --input example/v2/assets/ToyCar.glb \
            --expected-route geometry-only --expected-animations 0 \
            --output "${RUNNER_TEMP}/v2-benchmark/auto_toy_car"

      - name: Preserve and automatically route real Mixamo and Unreal compatible fixtures
        shell: bash
        run: |
          set -euo pipefail
          "${BLENDER_ROOT}/blender" --background --factory-startup \
            --python-exit-code 1 --python tests/blender_glb_preservation_smoke.py -- \
            --package-root "${GITHUB_WORKSPACE}" \
            --input example/v2/assets/QuaterniusHuman.glb \
            --expected-profile mixamo-humanoid-v1 \
            --expected-archetype humanoid --expected-animations 7 \
            --output "${RUNNER_TEMP}/v2-benchmark/preserved_mixamo"
          "${BLENDER_ROOT}/blender" --background --factory-startup \
            --python-exit-code 1 --python tests/blender_glb_preservation_smoke.py -- \
            --package-root "${GITHUB_WORKSPACE}" \
            --input example/v2/assets/UAL1_Standard.glb \
            --expected-profile unreal-mannequin-v1 \
            --expected-archetype humanoid --expected-animations 43 \
            --static-clip A_TPose --static-clip Pistol_Aim_Down \
            --static-clip Pistol_Aim_Neutral --static-clip Pistol_Aim_Up \
            --output "${RUNNER_TEMP}/v2-benchmark/preserved_unreal"
          "${BLENDER_ROOT}/blender" --background --factory-startup \
            --python-exit-code 1 --python tests/blender_glb_auto_route_smoke.py -- \
            --package-root "${GITHUB_WORKSPACE}" \
            --input example/v2/assets/QuaterniusHuman.glb \
            --expected-route preserve-source --expected-profile mixamo-humanoid-v1 \
            --expected-animations 7 \
            --output "${RUNNER_TEMP}/v2-benchmark/auto_mixamo"
          "${BLENDER_ROOT}/blender" --background --factory-startup \
            --python-exit-code 1 --python tests/blender_glb_auto_route_smoke.py -- \
            --package-root "${GITHUB_WORKSPACE}" \
            --input example/v2/assets/UAL1_Standard.glb \
            --expected-route preserve-source --expected-profile unreal-mannequin-v1 \
            --expected-animations 43 \
            --static-clip A_TPose --static-clip Pistol_Aim_Down \
            --static-clip Pistol_Aim_Neutral --static-clip Pistol_Aim_Up \
            --output "${RUNNER_TEMP}/v2-benchmark/auto_unreal"

      - name: Benchmark Canonical Rig V1 against RiggedFigure
        shell: bash
        run: |
          set -euo pipefail
          "${BLENDER_ROOT}/blender" --background --factory-startup \
            --python-exit-code 1 --python tests/blender_pose_probe_smoke.py
          "${BLENDER_ROOT}/blender" --background --factory-startup \
            --python-exit-code 1 --python scripts/benchmark_rig_v2.py -- \
            --output "${RUNNER_TEMP}/v2-benchmark/rigged_figure"

      - name: Benchmark Canonical Rig V2 from three unrigged humanoid GLBs
        shell: bash
        run: |
          set -euo pipefail
          "${BLENDER_ROOT}/blender" --background --factory-startup \
            --python-exit-code 1 --python scripts/benchmark_rig_v2.py -- \
            --implementation canonical-biped-v2 \
            --check-pose-quality --check-hinge-quality --check-combined-quality \
            --max-mean-joint-error 0.02 --max-joint-error 0.04 \
            --max-arm-unrelated-weight 0.08 \
            --require-observed-leg-cues --check-leg-deformation \
            --max-mean-leg-joint-error 0.005 --max-leg-joint-error 0.01 \
            --max-leg-unrelated-weight 0.02 \
            --output "${RUNNER_TEMP}/v2-benchmark/rigged_figure_v2"

          "${BLENDER_ROOT}/blender" --background --factory-startup \
            --python-exit-code 1 --python scripts/benchmark_rig_v2.py -- \
            --implementation canonical-biped-v2 --asset quaternius_human \
            --check-pose-quality --check-hinge-quality --check-combined-quality \
            --max-mean-joint-error 0.035 --max-joint-error 0.07 \
            --max-arm-unrelated-weight 0.015 \
            --require-observed-leg-cues --check-leg-deformation \
            --max-mean-leg-joint-error 0.018 --max-leg-joint-error 0.03 \
            --max-leg-unrelated-weight 0.025 \
            --output "${RUNNER_TEMP}/v2-benchmark/quaternius_human_rig_v2"

          "${BLENDER_ROOT}/blender" --background --factory-startup \
            --python-exit-code 1 --python scripts/benchmark_rig_v2.py -- \
            --implementation canonical-biped-v2 --asset quaternius_ual1 \
            --check-pose-quality --check-hinge-quality --check-combined-quality \
            --max-mean-joint-error 0.04 --max-joint-error 0.09 \
            --max-arm-unrelated-weight 0.02 \
            --require-observed-leg-cues --check-leg-deformation \
            --max-mean-leg-joint-error 0.025 --max-leg-joint-error 0.04 \
            --max-leg-unrelated-weight 0.10 \
            --output "${RUNNER_TEMP}/v2-benchmark/quaternius_ual1_rig_v2"

      - name: Run complete character reconstruction and animated GLB roundtrip
        shell: bash
        run: |
          set -euo pipefail
          "${BLENDER_ROOT}/blender" --background --factory-startup \
            --python-exit-code 1 --python scripts/benchmark_character_v2.py -- \
            --asset rigged_figure --rig-implementation canonical-biped-v1 --surface-refinement none \
            --resolution 48 --min-iou 0.65 --min-surface-fscore 0.85 \
            --max-extent-error 0.25 --max-mean-joint-error 0.10 \
            --max-joint-error 0.16 \
            --output "${RUNNER_TEMP}/v2-benchmark/character_e2e"

      - name: Run complete character pipeline with Canonical Rig V2
        shell: bash
        run: |
          set -euo pipefail
          "${BLENDER_ROOT}/blender" --background --factory-startup \
            --python-exit-code 1 --python scripts/benchmark_character_v2.py -- \
            --asset rigged_figure --surface-refinement none \
            --rig-implementation canonical-biped-v2 --resolution 48 \
            --min-iou 0.65 --min-surface-fscore 0.85 \
            --max-extent-error 0.25 --max-mean-joint-error 0.08 \
            --max-joint-error 0.14 \
            --output "${RUNNER_TEMP}/v2-benchmark/character_e2e_v2"

      - name: Reconstruct coherent organic humanoids and roundtrip all clips
        shell: bash
        run: |
          set -euo pipefail
          for asset in quaternius_human quaternius_ual1; do
            "${BLENDER_ROOT}/blender" --background --factory-startup \
              --python-exit-code 1 --python scripts/benchmark_character_v2.py -- \
              --asset "${asset}" --resolution 128 --surface-refinement organic \
              --rig-implementation canonical-biped-v2 --require-connected --preview \
              --min-iou 0.88 --min-view-iou 0.80 --min-surface-fscore 0.97 \
              --max-extent-error 0.08 --max-mean-joint-error 0.04 --max-joint-error 0.09 \
              --output "${RUNNER_TEMP}/v2-benchmark/${asset}_character_organic"
          done

      - name: Upload V2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glb-v2-benchmark
          path: ${{ runner.temp }}/v2-benchmark
          if-no-files-found: warn
          retention-days: 14
