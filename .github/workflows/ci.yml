name: CI

on:
  push:
    branches:
      - main
      - develop
      - dev

  pull_request:

  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ---------------------------------------------------------
  # Validate repository
  # ---------------------------------------------------------

  validate:
    name: Validate extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "blender_manifest.toml"
            "__init__.py"
            "version.py"
            "translations.py"
            "properties.py"
            "operators.py"
            "ui.py"

            "core/__init__.py"
            "core/image_mask.py"
            "core/native_loader.py"
            "core/native_bridge.py"
            "core/native_scan.py"
            "core/native_mesh_builder.py"

            "native/CMakeLists.txt"
            "native/include/bpt_core.h"
            "native/src/api.cpp"
            "native/src/visual_hull.cpp"
            "native/src/mesh.cpp"
            "native/tests/test_visual_hull.cpp"

            "README.md"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "${file}" ]]; then
              echo "Missing required file: ${file}"
              exit 1
            fi
          done

          echo "Repository structure valid."


  # ---------------------------------------------------------
  # Build native binaries
  # ---------------------------------------------------------

  native:
    name: Native ${{ matrix.platform }}
    needs:
      - validate

    strategy:
      fail-fast: false

      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            library_name: libbpt_core.so

          - platform: windows
            os: windows-latest
            library_name: bpt_core.dll

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------
      # Linux
      # -----------------------------------------------------

      - name: Install Linux build tools
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++

      - name: Configure native core - Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            -S native \
            -B build/native \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBPT_BUILD_TESTS=ON

      - name: Build native core - Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build build/native \
            --parallel

      - name: Test native core - Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          ctest \
            --test-dir build/native \
            --output-on-failure

      - name: Stage Linux library
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p native/bin

          LIB_PATH="$(
            find build/native \
              -type f \
              -name "libbpt_core.so" \
              | head -n 1
          )"

          if [[ -z "${LIB_PATH}" ]]; then
            echo "libbpt_core.so not found"
            exit 1
          fi

          cp \
            "${LIB_PATH}" \
            native/bin/libbpt_core.so

          ls -lh native/bin


      # -----------------------------------------------------
      # Windows
      # -----------------------------------------------------

      - name: Configure native core - Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cmake `
            -S native `
            -B build/native `
            -A x64 `
            -DBPT_BUILD_TESTS=ON

          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Build native core - Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cmake `
            --build build/native `
            --config Release `
            --parallel

          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Test native core - Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          ctest `
            --test-dir build/native `
            -C Release `
            --output-on-failure

          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Stage Windows library
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path native/bin `
            | Out-Null

          $dll = Get-ChildItem `
            -Path build/native `
            -Filter bpt_core.dll `
            -Recurse `
            | Select-Object -First 1

          if (-not $dll) {
              Write-Error "bpt_core.dll not found"
              exit 1
          }

          Copy-Item `
            $dll.FullName `
            native/bin/bpt_core.dll

          Get-ChildItem native/bin


      # -----------------------------------------------------
      # Upload platform artifact
      # -----------------------------------------------------

      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: native/bin/${{ matrix.library_name }}
          if-no-files-found: error
          retention-days: 1


  # ---------------------------------------------------------
  # Package Blender extension
  # ---------------------------------------------------------

  package:
    name: Build Blender Extension
    runs-on: ubuntu-latest

    needs:
      - validate
      - native

    outputs:
      version: ${{ steps.version.outputs.version }}
      zip_name: ${{ steps.package_info.outputs.zip_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # -----------------------------------------------------
      # Download native binaries
      # -----------------------------------------------------

      - name: Download Linux native binary
        uses: actions/download-artifact@v4
        with:
          name: native-linux
          path: native/bin

      - name: Download Windows native binary
        uses: actions/download-artifact@v4
        with:
          name: native-windows
          path: native/bin

      - name: Verify native binaries
        shell: bash
        run: |
          set -euo pipefail

          test -f native/bin/libbpt_core.so
          test -f native/bin/bpt_core.dll

          echo "Native binaries:"
          ls -lh native/bin


      # -----------------------------------------------------
      # Calculate version
      # -----------------------------------------------------

      - name: Calculate build version
        id: version
        shell: python
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          import os
          import tomllib

          with open(
              "blender_manifest.toml",
              "rb",
          ) as file:
              manifest = tomllib.load(file)

          base_version = manifest["version"]

          parts = base_version.split(".")

          if len(parts) != 3:
              raise RuntimeError(
                  f"Invalid semantic version: {base_version}"
              )

          major = int(parts[0])
          minor = int(parts[1])

          build = int(
              os.environ["BUILD_NUMBER"]
          )

          version = (
              f"{major}.{minor}.{build}"
          )

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as output:
              output.write(
                  f"version={version}\n"
              )

          print(
              f"Build version: {version}"
          )


      - name: Define package name
        id: package_info
        shell: bash
        run: |
          set -euo pipefail

          ZIP_NAME="blender_projection_tool-${{ steps.version.outputs.version }}.zip"

          echo \
            "zip_name=${ZIP_NAME}" \
            >> "$GITHUB_OUTPUT"


      # -----------------------------------------------------
      # Build package tree
      # -----------------------------------------------------

      - name: Build package directory
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_ROOT="dist/blender_projection_tool"

          mkdir -p \
            "${PACKAGE_ROOT}/core" \
            "${PACKAGE_ROOT}/native/bin"

          cp blender_manifest.toml \
            "${PACKAGE_ROOT}/"

          cp __init__.py \
            "${PACKAGE_ROOT}/"

          cp version.py \
            "${PACKAGE_ROOT}/"

          cp translations.py \
            "${PACKAGE_ROOT}/"

          cp properties.py \
            "${PACKAGE_ROOT}/"

          cp operators.py \
            "${PACKAGE_ROOT}/"

          cp ui.py \
            "${PACKAGE_ROOT}/"

          cp README.md \
            "${PACKAGE_ROOT}/"

          cp core/__init__.py \
            "${PACKAGE_ROOT}/core/"

          cp core/image_mask.py \
            "${PACKAGE_ROOT}/core/"

          cp core/native_loader.py \
            "${PACKAGE_ROOT}/core/"

          cp core/native_bridge.py \
            "${PACKAGE_ROOT}/core/"

          cp core/native_scan.py \
            "${PACKAGE_ROOT}/core/"

          cp core/native_mesh_builder.py \
            "${PACKAGE_ROOT}/core/"

          cp native/bin/libbpt_core.so \
            "${PACKAGE_ROOT}/native/bin/"

          cp native/bin/bpt_core.dll \
            "${PACKAGE_ROOT}/native/bin/"

          if [[ -f LICENSE ]]; then
            cp LICENSE \
              "${PACKAGE_ROOT}/"
          fi


      # -----------------------------------------------------
      # Patch manifest version
      # -----------------------------------------------------

      - name: Patch packaged manifest version
        shell: python
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          import os
          import pathlib
          import re

          manifest_path = pathlib.Path(
              "dist/blender_projection_tool/blender_manifest.toml"
          )

          content = manifest_path.read_text(
              encoding="utf-8"
          )

          version = os.environ[
              "BUILD_VERSION"
          ]

          content, count = re.subn(
              r'^version\s*=\s*"[^"]+"',
              f'version = "{version}"',
              content,
              count=1,
              flags=re.MULTILINE,
          )

          if count != 1:
              raise RuntimeError(
                  "Could not patch manifest version."
              )

          manifest_path.write_text(
              content,
              encoding="utf-8",
          )


      # -----------------------------------------------------
      # Validate package
      # -----------------------------------------------------

      - name: Validate packaged files
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_ROOT="dist/blender_projection_tool"

          required_files=(
            "blender_manifest.toml"
            "__init__.py"
            "version.py"
            "translations.py"
            "properties.py"
            "operators.py"
            "ui.py"

            "core/__init__.py"
            "core/image_mask.py"
            "core/native_loader.py"
            "core/native_bridge.py"
            "core/native_scan.py"
            "core/native_mesh_builder.py"

            "native/bin/libbpt_core.so"
            "native/bin/bpt_core.dll"

            "README.md"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "${PACKAGE_ROOT}/${file}" ]]; then
              echo "Missing packaged file: ${file}"
              exit 1
            fi
          done

          echo "Package validated."


      # -----------------------------------------------------
      # Create ZIP
      # -----------------------------------------------------

      - name: Create ZIP
        shell: bash
        run: |
          set -euo pipefail

          cd dist

          zip \
            -r \
            "${{ steps.package_info.outputs.zip_name }}" \
            blender_projection_tool


      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: blender-projection-tool-${{ steps.version.outputs.version }}
          path: dist/${{ steps.package_info.outputs.zip_name }}
          if-no-files-found: error
          retention-days: 30


      - name: Store release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: dist/${{ steps.package_info.outputs.zip_name }}
          if-no-files-found: error
          retention-days: 1


  # ---------------------------------------------------------
  # Release
  # ---------------------------------------------------------

  release:
    name: GitHub Release

    runs-on: ubuntu-latest

    needs:
      - package

    if: >
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'

    steps:
      - name: Download release ZIP
        uses: actions/download-artifact@v4
        with:
          name: release-zip
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.package.outputs.version }}

          name: Projection Tool v${{ needs.package.outputs.version }}

          generate_release_notes: true

          files: |
            dist/${{ needs.package.outputs.zip_name }}

          body: |
            ## Blender Projection Tool

            Native C++ Blender extension build
            **v${{ needs.package.outputs.version }}**.

            ### Native platforms

            - Windows x64
            - Linux x64

            ### Engine

            - native C++ visual hull
            - multithreaded reconstruction
            - arbitrary azimuth / elevation
            - native mesh generation
            - ctypes bridge
            - Blender direct mesh injection

            ### Installation

            Blender 5.2.1:

            `Edit → Preferences → Extensions → Install from Disk`

            Select:

            `${{ needs.package.outputs.zip_name }}`