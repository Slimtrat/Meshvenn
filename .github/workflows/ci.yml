# .github/workflows/ci.yml

name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:

  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_*.py" \
            -v

  validate:
    name: Validate extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          set -e

          required_files=(
            "blender_manifest.toml"
            "__init__.py"
            "version.py"
            "translations.py"
            "properties.py"
            "operators.py"
            "ui.py"
            "core/__init__.py"
            "core/masks.py"
            "core/visual_hull.py"
            "core/mesh_builder.py"
            "core/cleanup.py"
            "tests/test_visual_hull.py"
            "README.md"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Missing required file: $file"
              exit 1
            fi
          done

          echo "Extension structure is valid."

  package:
    name: Build Blender Extension
    runs-on: ubuntu-latest

    needs:
      - test
      - validate

    outputs:
      version: ${{ steps.version.outputs.version }}
      zip_name: ${{ steps.package_info.outputs.zip_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Calculate build version
        id: version
        shell: python
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          import os
          import tomllib

          with open("blender_manifest.toml", "rb") as file:
              manifest = tomllib.load(file)

          base_version = manifest["version"]

          parts = base_version.split(".")

          if len(parts) != 3:
              raise RuntimeError(
                  f"Invalid semantic version: {base_version}"
              )

          major = int(parts[0])
          minor = int(parts[1])
          build = int(os.environ["BUILD_NUMBER"])

          version = f"{major}.{minor}.{build}"

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as output:
              output.write(f"version={version}\n")

          print(f"Build version: {version}")

      - name: Define package name
        id: package_info
        shell: bash
        run: |
          ZIP_NAME="blender_projection_tool-${{ steps.version.outputs.version }}.zip"

          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Build package directory
        shell: bash
        run: |
          set -e

          PACKAGE_ROOT="dist/blender_projection_tool"

          mkdir -p "$PACKAGE_ROOT/core"

          cp blender_manifest.toml "$PACKAGE_ROOT/"
          cp __init__.py "$PACKAGE_ROOT/"
          cp version.py "$PACKAGE_ROOT/"
          cp translations.py "$PACKAGE_ROOT/"
          cp properties.py "$PACKAGE_ROOT/"
          cp operators.py "$PACKAGE_ROOT/"
          cp ui.py "$PACKAGE_ROOT/"

          cp core/__init__.py "$PACKAGE_ROOT/core/"
          cp core/masks.py "$PACKAGE_ROOT/core/"
          cp core/visual_hull.py "$PACKAGE_ROOT/core/"
          cp core/mesh_builder.py "$PACKAGE_ROOT/core/"
          cp core/cleanup.py "$PACKAGE_ROOT/core/"

          cp README.md "$PACKAGE_ROOT/"

          if [[ -f LICENSE ]]; then
            cp LICENSE "$PACKAGE_ROOT/"
          fi

      - name: Patch packaged manifest version
        shell: python
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          import os
          import pathlib
          import re

          manifest_path = pathlib.Path(
              "dist/blender_projection_tool/blender_manifest.toml"
          )

          content = manifest_path.read_text(
              encoding="utf-8"
          )

          version = os.environ["BUILD_VERSION"]

          content, count = re.subn(
              r'^version\s*=\s*"[^"]+"',
              f'version = "{version}"',
              content,
              count=1,
              flags=re.MULTILINE,
          )

          if count != 1:
              raise RuntimeError(
                  "Could not patch blender_manifest.toml version."
              )

          manifest_path.write_text(
              content,
              encoding="utf-8",
          )

      - name: Validate packaged manifest
        shell: python
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          import os
          import pathlib
          import tomllib

          manifest_path = pathlib.Path(
              "dist/blender_projection_tool/blender_manifest.toml"
          )

          with manifest_path.open("rb") as file:
              manifest = tomllib.load(file)

          expected = os.environ["BUILD_VERSION"]
          actual = manifest["version"]

          if actual != expected:
              raise RuntimeError(
                  f"Expected packaged version {expected}, "
                  f"found {actual}."
              )

          print(f"Validated packaged extension v{actual}")

      - name: Validate packaged files
        shell: bash
        run: |
          set -e

          PACKAGE_ROOT="dist/blender_projection_tool"

          required_files=(
            "blender_manifest.toml"
            "__init__.py"
            "version.py"
            "translations.py"
            "properties.py"
            "operators.py"
            "ui.py"
            "core/__init__.py"
            "core/masks.py"
            "core/visual_hull.py"
            "core/mesh_builder.py"
            "core/cleanup.py"
            "README.md"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$PACKAGE_ROOT/$file" ]]; then
              echo "Missing packaged file: $file"
              exit 1
            fi
          done

          echo "Package contents validated."

      - name: Create ZIP
        shell: bash
        run: |
          set -e

          cd dist

          zip -r \
            "${{ steps.package_info.outputs.zip_name }}" \
            blender_projection_tool

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: blender-projection-tool-${{ steps.version.outputs.version }}
          path: dist/${{ steps.package_info.outputs.zip_name }}
          if-no-files-found: error
          retention-days: 30

      - name: Store release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: dist/${{ steps.package_info.outputs.zip_name }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: GitHub Release
    runs-on: ubuntu-latest

    needs:
      - package

    if: >
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'

    steps:
      - name: Download release ZIP
        uses: actions/download-artifact@v4
        with:
          name: release-zip
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.package.outputs.version }}
          name: Projection Tool v${{ needs.package.outputs.version }}

          generate_release_notes: true

          files: |
            dist/${{ needs.package.outputs.zip_name }}

          body: |
            ## Blender Projection Tool

            Blender extension build **v${{ needs.package.outputs.version }}**.

            ### Included in this build

            - arbitrary projection views
            - 3/4 and turntable reconstruction
            - fixed Blender radians/degrees handling
            - English / French interface
            - Front + Side quick preset
            - 4 / 8 / 16 turntable presets
            - projection diagnostics
            - automatic voxel remesh and smoothing

            ### Installation

            Download:

            `${{ needs.package.outputs.zip_name }}`

            In Blender 5.2.1:

            `Edit → Preferences → Extensions → Install from Disk`

            Select the ZIP directly.