name: CI


on:
  push:
    branches:
      - main
      - develop
      - dev

  pull_request:

  workflow_dispatch:


permissions:
  contents: write


env:
  BLENDER_VERSION: "5.2.1"
  BLENDER_ARCHIVE: "blender-5.2.1-linux-x64.tar.xz"
  BLENDER_BASE_URL: "https://download.blender.org/release/Blender5.2"
  BLENDER_ROOT: "${{ github.workspace }}/.blender"


jobs:

  # =========================================================
  # Repository validation + pure Python tests
  # =========================================================

  validate:
    name: Validate extension

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # -----------------------------------------------------
      # Repository structure
      # -----------------------------------------------------

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(

            # -----------------------------------------------
            # Blender extension
            # -----------------------------------------------

            "blender_manifest.toml"

            "__init__.py"

            "version.py"
            "translations.py"
            "properties.py"
            "operators.py"
            "ui.py"

            # -----------------------------------------------
            # Runtime core
            # -----------------------------------------------

            "core/__init__.py"

            "core/image_mask.py"

            "core/native_loader.py"
            "core/native_bridge.py"
            "core/native_scan.py"
            "core/native_mesh_builder.py"

            "core/projection_math.py"

            "core/projected_material.py"
            "core/material_visibility.py"
            "core/material_blend.py"

            # -----------------------------------------------
            # Generic pipeline
            # -----------------------------------------------

            "core/pipeline_contracts.py"
            "core/pipeline_registry.py"
            "core/pipeline_runner.py"

            # -----------------------------------------------
            # Built-in implementations
            # -----------------------------------------------

            "implementations/__init__.py"

            "implementations/projection_images.py"
            "implementations/native_visual_hull.py"
            "implementations/projected_color.py"

            # -----------------------------------------------
            # Native engine
            # -----------------------------------------------

            "native/CMakeLists.txt"

            "native/include/bpt_core.h"

            "native/src/api.cpp"
            "native/src/visual_hull.cpp"
            "native/src/mesh.cpp"

            "native/tests/test_visual_hull.cpp"

            # -----------------------------------------------
            # Tests
            # -----------------------------------------------

            "tests/test_preview_baseline.py"

            "tests/test_material_visibility.py"
            "tests/test_material_blend.py"

            "tests/test_pipeline_registry.py"
            "tests/test_pipeline_runner.py"

            "tests/blender_smoke_test.py"

            # -----------------------------------------------
            # Documentation
            # -----------------------------------------------

            "README.md"
          )

          for file in "${required_files[@]}"; do

            if [[ ! -f "${file}" ]]; then

              echo "Missing required file: ${file}"

              exit 1

            fi

          done

          echo
          echo "Repository structure valid."


      # -----------------------------------------------------
      # Pure Python tests
      #
      # blender_smoke_test.py is deliberately excluded by
      # the test_*.py pattern because it requires Blender.
      # -----------------------------------------------------

      - name: Run Python tests
        shell: bash
        run: |
          set -euo pipefail

          python -m unittest \
            discover \
            -s tests \
            -p "test_*.py" \
            -v


  # =========================================================
  # Native binaries
  # =========================================================

  native:
    name: Native ${{ matrix.platform }}

    needs:
      - validate

    strategy:
      fail-fast: false

      matrix:
        include:

          - platform: linux
            os: ubuntu-latest
            library_name: libbpt_core.so

          - platform: windows
            os: windows-latest
            library_name: bpt_core.dll

    runs-on: ${{ matrix.os }}

    timeout-minutes: 20

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      # -----------------------------------------------------
      # Linux
      # -----------------------------------------------------

      - name: Install Linux build tools
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++


      - name: Configure native core - Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            -S native \
            -B build/native \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBPT_BUILD_TESTS=ON


      - name: Build native core - Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build build/native \
            --parallel


      - name: Test native core - Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          ctest \
            --test-dir build/native \
            --output-on-failure


      - name: Stage Linux library
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            native/bin

          LIB_PATH="$(
            find build/native \
              -type f \
              -name "libbpt_core.so" \
              | head -n 1
          )"

          if [[ -z "${LIB_PATH}" ]]; then

            echo "libbpt_core.so not found"

            exit 1

          fi

          cp \
            "${LIB_PATH}" \
            native/bin/libbpt_core.so

          ls -lh \
            native/bin


      # -----------------------------------------------------
      # Windows
      # -----------------------------------------------------

      - name: Configure native core - Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cmake `
            -S native `
            -B build/native `
            -A x64 `
            -DBPT_BUILD_TESTS=ON

          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }


      - name: Build native core - Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cmake `
            --build build/native `
            --config Release `
            --parallel

          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }


      - name: Test native core - Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          ctest `
            --test-dir build/native `
            -C Release `
            --output-on-failure

          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }


      - name: Stage Windows library
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path native/bin `
            | Out-Null

          $dll = Get-ChildItem `
            -Path build/native `
            -Filter bpt_core.dll `
            -Recurse `
            | Select-Object -First 1

          if (-not $dll) {

              Write-Error "bpt_core.dll not found"

              exit 1

          }

          Copy-Item `
            $dll.FullName `
            native/bin/bpt_core.dll

          Get-ChildItem native/bin


      # -----------------------------------------------------
      # Native build artifact
      # -----------------------------------------------------

      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}

          path: native/bin/${{ matrix.library_name }}

          if-no-files-found: error

          retention-days: 1


  # =========================================================
  # Blender extension package
  # =========================================================

  package:
    name: Build Blender Extension

    runs-on: ubuntu-latest

    timeout-minutes: 30

    needs:
      - validate
      - native

    outputs:
      version: ${{ steps.version.outputs.version }}
      zip_name: ${{ steps.package_info.outputs.zip_name }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # -----------------------------------------------------
      # Native binaries
      # -----------------------------------------------------

      - name: Download Linux native binary
        uses: actions/download-artifact@v4
        with:
          name: native-linux
          path: native/bin


      - name: Download Windows native binary
        uses: actions/download-artifact@v4
        with:
          name: native-windows
          path: native/bin


      - name: Verify native binaries
        shell: bash
        run: |
          set -euo pipefail

          test -f \
            native/bin/libbpt_core.so

          test -f \
            native/bin/bpt_core.dll

          echo
          echo "Native binaries:"

          ls -lh \
            native/bin


      # -----------------------------------------------------
      # Build version
      # -----------------------------------------------------

      - name: Calculate build version
        id: version
        shell: python
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          import os
          import tomllib

          with open(
              "blender_manifest.toml",
              "rb",
          ) as file:
              manifest = tomllib.load(file)

          base_version = manifest[
              "version"
          ]

          parts = base_version.split(
              "."
          )

          if len(parts) != 3:
              raise RuntimeError(
                  f"Invalid semantic version: {base_version}"
              )

          major = int(
              parts[0]
          )

          minor = int(
              parts[1]
          )

          build = int(
              os.environ[
                  "BUILD_NUMBER"
              ]
          )

          version = (
              f"{major}.{minor}.{build}"
          )

          with open(
              os.environ[
                  "GITHUB_OUTPUT"
              ],
              "a",
              encoding="utf-8",
          ) as output:
              output.write(
                  f"version={version}\n"
              )

          print(
              f"Build version: {version}"
          )


      - name: Define package name
        id: package_info
        shell: bash
        run: |
          set -euo pipefail

          ZIP_NAME="blender_projection_tool-${{ steps.version.outputs.version }}.zip"

          echo \
            "zip_name=${ZIP_NAME}" \
            >> "${GITHUB_OUTPUT}"

          echo \
            "ZIP: ${ZIP_NAME}"


      # -----------------------------------------------------
      # Build package tree
      #
      # Runtime code belongs to:
      #
      #   root Python modules
      #   core/
      #   implementations/
      #
      # Tests/scripts/examples must not be shipped.
      # -----------------------------------------------------

      - name: Build package directory
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_ROOT="dist/blender_projection_tool"

          rm -rf \
            "${PACKAGE_ROOT}"

          mkdir -p \
            "${PACKAGE_ROOT}/core" \
            "${PACKAGE_ROOT}/implementations" \
            "${PACKAGE_ROOT}/native/bin"


          # -------------------------------------------------
          # Root extension files
          # -------------------------------------------------

          cp \
            blender_manifest.toml \
            "${PACKAGE_ROOT}/"

          cp \
            __init__.py \
            "${PACKAGE_ROOT}/"

          cp \
            version.py \
            "${PACKAGE_ROOT}/"

          cp \
            translations.py \
            "${PACKAGE_ROOT}/"

          cp \
            properties.py \
            "${PACKAGE_ROOT}/"

          cp \
            operators.py \
            "${PACKAGE_ROOT}/"

          cp \
            ui.py \
            "${PACKAGE_ROOT}/"

          cp \
            README.md \
            "${PACKAGE_ROOT}/"


          # -------------------------------------------------
          # Runtime core
          # -------------------------------------------------

          cp \
            core/*.py \
            "${PACKAGE_ROOT}/core/"


          # -------------------------------------------------
          # Pipeline implementations
          #
          # REQUIRED:
          #
          # root __init__.py imports this package.
          # -------------------------------------------------

          cp \
            implementations/*.py \
            "${PACKAGE_ROOT}/implementations/"


          # -------------------------------------------------
          # Native libraries
          # -------------------------------------------------

          cp \
            native/bin/libbpt_core.so \
            "${PACKAGE_ROOT}/native/bin/"

          cp \
            native/bin/bpt_core.dll \
            "${PACKAGE_ROOT}/native/bin/"


          # -------------------------------------------------
          # License
          # -------------------------------------------------

          if [[ -f LICENSE ]]; then

            cp \
              LICENSE \
              "${PACKAGE_ROOT}/"

          fi


          echo
          echo "Package tree:"

          find \
            "${PACKAGE_ROOT}" \
            -type f \
            -print \
            | sort


      # -----------------------------------------------------
      # Patch manifest version
      # -----------------------------------------------------

      - name: Patch packaged manifest version
        shell: python
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          import os
          import pathlib
          import re

          manifest_path = pathlib.Path(
              "dist/blender_projection_tool/blender_manifest.toml"
          )

          content = manifest_path.read_text(
              encoding="utf-8"
          )

          version = os.environ[
              "BUILD_VERSION"
          ]

          content, count = re.subn(
              r'^version\s*=\s*"[^"]+"',
              f'version = "{version}"',
              content,
              count=1,
              flags=re.MULTILINE,
          )

          if count != 1:
              raise RuntimeError(
                  "Could not patch manifest version."
              )

          manifest_path.write_text(
              content,
              encoding="utf-8",
          )

          print(
              f"Packaged version: {version}"
          )


      # -----------------------------------------------------
      # Explicit package validation
      # -----------------------------------------------------

      - name: Validate packaged files
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_ROOT="dist/blender_projection_tool"

          required_files=(

            "blender_manifest.toml"

            "__init__.py"

            "version.py"
            "translations.py"
            "properties.py"
            "operators.py"
            "ui.py"

            # -----------------------------------------------
            # Core
            # -----------------------------------------------

            "core/__init__.py"

            "core/image_mask.py"

            "core/native_loader.py"
            "core/native_bridge.py"
            "core/native_scan.py"
            "core/native_mesh_builder.py"

            "core/projection_math.py"

            "core/projected_material.py"
            "core/material_visibility.py"
            "core/material_blend.py"

            "core/pipeline_contracts.py"
            "core/pipeline_registry.py"
            "core/pipeline_runner.py"

            # -----------------------------------------------
            # Implementations
            # -----------------------------------------------

            "implementations/__init__.py"

            "implementations/projection_images.py"
            "implementations/native_visual_hull.py"
            "implementations/projected_color.py"

            # -----------------------------------------------
            # Native
            # -----------------------------------------------

            "native/bin/libbpt_core.so"
            "native/bin/bpt_core.dll"

            "README.md"
          )

          for file in "${required_files[@]}"; do

            if [[ ! -f "${PACKAGE_ROOT}/${file}" ]]; then

              echo "Missing packaged file: ${file}"

              exit 1

            fi

          done

          echo
          echo "Package required-file validation: OK"


      # -----------------------------------------------------
      # Source/package core parity
      # -----------------------------------------------------

      - name: Verify packaged core parity
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_ROOT="dist/blender_projection_tool"

          mapfile -t SOURCE_CORE < <(
            find core \
              -maxdepth 1 \
              -type f \
              -name "*.py" \
              -printf '%f\n' \
              | sort
          )

          mapfile -t PACKAGE_CORE < <(
            find "${PACKAGE_ROOT}/core" \
              -maxdepth 1 \
              -type f \
              -name "*.py" \
              -printf '%f\n' \
              | sort
          )

          echo
          echo "Source core modules:"

          printf \
            '  - %s\n' \
            "${SOURCE_CORE[@]}"

          echo
          echo "Packaged core modules:"

          printf \
            '  - %s\n' \
            "${PACKAGE_CORE[@]}"

          if ! diff \
            <(
              printf \
                '%s\n' \
                "${SOURCE_CORE[@]}"
            ) \
            <(
              printf \
                '%s\n' \
                "${PACKAGE_CORE[@]}"
            )
          then

            echo
            echo "Packaged core differs from source core."

            exit 1

          fi

          echo
          echo "Packaged core matches source core."


      # -----------------------------------------------------
      # Source/package implementation parity
      # -----------------------------------------------------

      - name: Verify packaged implementation parity
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_ROOT="dist/blender_projection_tool"

          mapfile -t SOURCE_IMPLEMENTATIONS < <(
            find implementations \
              -maxdepth 1 \
              -type f \
              -name "*.py" \
              -printf '%f\n' \
              | sort
          )

          mapfile -t PACKAGE_IMPLEMENTATIONS < <(
            find "${PACKAGE_ROOT}/implementations" \
              -maxdepth 1 \
              -type f \
              -name "*.py" \
              -printf '%f\n' \
              | sort
          )

          echo
          echo "Source implementations:"

          printf \
            '  - %s\n' \
            "${SOURCE_IMPLEMENTATIONS[@]}"

          echo
          echo "Packaged implementations:"

          printf \
            '  - %s\n' \
            "${PACKAGE_IMPLEMENTATIONS[@]}"

          if ! diff \
            <(
              printf \
                '%s\n' \
                "${SOURCE_IMPLEMENTATIONS[@]}"
            ) \
            <(
              printf \
                '%s\n' \
                "${PACKAGE_IMPLEMENTATIONS[@]}"
            )
          then

            echo
            echo \
              "Packaged implementations differ from source."

            exit 1

          fi

          echo
          echo \
            "Packaged implementations match source."


      # -----------------------------------------------------
      # Make sure no development Python files leak into the
      # runtime package.
      # -----------------------------------------------------

      - name: Verify package boundaries
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_ROOT="dist/blender_projection_tool"

          forbidden_paths=(

            "${PACKAGE_ROOT}/tests"

            "${PACKAGE_ROOT}/scripts"

            "${PACKAGE_ROOT}/example"

            "${PACKAGE_ROOT}/.github"

            "${PACKAGE_ROOT}/native/src"

            "${PACKAGE_ROOT}/native/include"

            "${PACKAGE_ROOT}/native/tests"
          )

          for path in "${forbidden_paths[@]}"; do

            if [[ -e "${path}" ]]; then

              echo \
                "Forbidden development path packaged: ${path}"

              exit 1

            fi

          done

          if find \
            "${PACKAGE_ROOT}" \
            -type f \
            \( \
              -name "*.pyc" \
              -o \
              -name "*.pyo" \
            \) \
            | grep -q .
          then

            echo "Compiled Python cache found in package."

            exit 1

          fi

          echo
          echo "Package boundaries: OK"


      # -----------------------------------------------------
      # Create distribution ZIP
      # -----------------------------------------------------

      - name: Create ZIP
        shell: bash
        run: |
          set -euo pipefail

          cd dist

          zip \
            -r \
            "${{ steps.package_info.outputs.zip_name }}" \
            blender_projection_tool

          echo
          echo "Archive contents:"

          unzip \
            -l \
            "${{ steps.package_info.outputs.zip_name }}"


      # -----------------------------------------------------
      # Verify the archive itself.
      #
      # Do not trust only the staging directory.
      # -----------------------------------------------------

      - name: Verify ZIP contents
        shell: bash
        run: |
          set -euo pipefail

          ZIP_PATH="dist/${{ steps.package_info.outputs.zip_name }}"

          unzip \
            -t \
            "${ZIP_PATH}"

          required_archive_files=(

            "blender_projection_tool/blender_manifest.toml"

            "blender_projection_tool/__init__.py"

            "blender_projection_tool/core/pipeline_contracts.py"
            "blender_projection_tool/core/pipeline_registry.py"
            "blender_projection_tool/core/pipeline_runner.py"

            "blender_projection_tool/implementations/__init__.py"
            "blender_projection_tool/implementations/projection_images.py"
            "blender_projection_tool/implementations/native_visual_hull.py"
            "blender_projection_tool/implementations/projected_color.py"

            "blender_projection_tool/native/bin/libbpt_core.so"
            "blender_projection_tool/native/bin/bpt_core.dll"
          )

          mapfile -t ARCHIVE_FILES < <(
            unzip \
              -Z1 \
              "${ZIP_PATH}"
          )

          for required in "${required_archive_files[@]}"; do

            if ! printf \
              '%s\n' \
              "${ARCHIVE_FILES[@]}" \
              | grep \
                -Fxq \
                "${required}"
            then

              echo \
                "Missing archive file: ${required}"

              exit 1

            fi

          done

          echo
          echo "ZIP validation: OK"


      # =====================================================
      # Blender smoke test
      #
      # Test the ZIP that will actually be distributed.
      # =====================================================

      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: .blender

          key: blender-linux-x64-${{ env.BLENDER_VERSION }}


      - name: Download Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            "${BLENDER_ROOT}"

          URL="${BLENDER_BASE_URL}/${BLENDER_ARCHIVE}"

          ARCHIVE="/tmp/${BLENDER_ARCHIVE}"

          echo \
            "Downloading ${URL}"

          curl \
            --fail \
            --show-error \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 900 \
            --output "${ARCHIVE}" \
            "${URL}"

          xz \
            --test \
            "${ARCHIVE}"

          tar \
            -xJf "${ARCHIVE}" \
            -C "${BLENDER_ROOT}" \
            --strip-components=1

          rm \
            "${ARCHIVE}"


      - name: Verify Blender
        shell: bash
        run: |
          set -euo pipefail

          "${BLENDER_ROOT}/blender" \
            --version


      # -----------------------------------------------------
      # Extract a fresh copy.
      #
      # The smoke test MUST NOT import from
      # dist/blender_projection_tool directly.
      #
      # Otherwise a ZIP packaging omission could be masked by
      # files still existing in the staging directory.
      # -----------------------------------------------------

      - name: Extract packaged extension for smoke test
        shell: bash
        run: |
          set -euo pipefail

          ZIP_PATH="dist/${{ steps.package_info.outputs.zip_name }}"

          SMOKE_ROOT="${RUNNER_TEMP}/meshvenn-smoke"

          rm -rf \
            "${SMOKE_ROOT}"

          mkdir -p \
            "${SMOKE_ROOT}"

          unzip \
            -q \
            "${ZIP_PATH}" \
            -d "${SMOKE_ROOT}"

          PACKAGE_ROOT="${SMOKE_ROOT}/blender_projection_tool"

          test -f \
            "${PACKAGE_ROOT}/blender_manifest.toml"

          test -f \
            "${PACKAGE_ROOT}/__init__.py"

          test -f \
            "${PACKAGE_ROOT}/implementations/__init__.py"

          echo
          echo "Smoke package:"

          find \
            "${PACKAGE_ROOT}" \
            -type f \
            -print \
            | sort


      - name: Blender packaged extension smoke test
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_ROOT="${RUNNER_TEMP}/meshvenn-smoke/blender_projection_tool"

          "${BLENDER_ROOT}/blender" \
            --background \
            --factory-startup \
            --python \
              tests/blender_smoke_test.py \
            -- \
            --package-root \
              "${PACKAGE_ROOT}"


      # -----------------------------------------------------
      # Publish package artifacts only after the real Blender
      # smoke test succeeds.
      # -----------------------------------------------------

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: blender-projection-tool-${{ steps.version.outputs.version }}

          path: dist/${{ steps.package_info.outputs.zip_name }}

          if-no-files-found: error

          retention-days: 30


      - name: Store release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: release-zip

          path: dist/${{ steps.package_info.outputs.zip_name }}

          if-no-files-found: error

          retention-days: 1


  # =========================================================
  # GitHub Release
  # =========================================================

  release:
    name: GitHub Release

    runs-on: ubuntu-latest

    needs:
      - package

    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'

    steps:

      - name: Download release ZIP
        uses: actions/download-artifact@v4
        with:
          name: release-zip

          path: dist


      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.package.outputs.version }}

          name: Meshvenn v${{ needs.package.outputs.version }}

          generate_release_notes: true

          files: |
            dist/${{ needs.package.outputs.zip_name }}

          body: |
            ## Meshvenn

            Blender extension build
            **v${{ needs.package.outputs.version }}**.

            ### Native platforms

            - Windows x64
            - Linux x64

            ### Pipeline

            Input
            → Geometry
            → Material
            → Rig
            → Export

