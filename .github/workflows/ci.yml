  # =========================================================
  # Native binaries
  # =========================================================

  native:
    name: Native ${{ matrix.platform }}

    needs:
      - validate

    strategy:
      fail-fast: false

      matrix:
        include:

          - platform: linux
            os: ubuntu-latest
            library_name: libbpt_core.so

          - platform: windows
            os: windows-latest
            library_name: bpt_core.dll

    runs-on: ${{ matrix.os }}

    timeout-minutes: 20

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      # -----------------------------------------------------
      # Linux
      # -----------------------------------------------------

      - name: Install Linux build tools
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++


      - name: Configure native core - Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            -S native \
            -B build/native \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBPT_BUILD_TESTS=ON


      - name: Build native core - Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build build/native \
            --parallel


      - name: Test native core - Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          ctest \
            --test-dir build/native \
            --output-on-failure


      - name: Stage Linux library
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            native/bin

          LIB_PATH="$(
            find build/native \
              -type f \
              -name "libbpt_core.so" \
              | head -n 1
          )"

          if [[ -z "${LIB_PATH}" ]]; then

            echo "libbpt_core.so not found"

            exit 1

          fi

          cp \
            "${LIB_PATH}" \
            native/bin/libbpt_core.so

          ls -lh \
            native/bin


      # -----------------------------------------------------
      # Windows
      # -----------------------------------------------------

      - name: Configure native core - Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cmake `
            -S native `
            -B build/native `
            -A x64 `
            -DBPT_BUILD_TESTS=ON

          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }


      - name: Build native core - Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cmake `
            --build build/native `
            --config Release `
            --parallel

          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }


      - name: Test native core - Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          ctest `
            --test-dir build/native `
            -C Release `
            --output-on-failure

          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }


      - name: Stage Windows library
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path native/bin `
            | Out-Null

          $dll = Get-ChildItem `
            -Path build/native `
            -Filter bpt_core.dll `
            -Recurse `
            | Select-Object -First 1

          if (-not $dll) {

              Write-Error "bpt_core.dll not found"

              exit 1
          }

          Copy-Item `
            $dll.FullName `
            native/bin/bpt_core.dll

          Get-ChildItem native/bin


      # -----------------------------------------------------
      # Native artifact
      # -----------------------------------------------------

      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}

          path: native/bin/${{ matrix.library_name }}

          if-no-files-found: error

          retention-days: 1


  # =========================================================
  # Blender extension package
  # =========================================================

  package:
    name: Build Blender Extension

    runs-on: ubuntu-latest

    timeout-minutes: 30

    needs:
      - validate
      - native

    outputs:
      version: ${{ steps.version.outputs.version }}
      zip_name: ${{ steps.package_info.outputs.zip_name }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # -----------------------------------------------------
      # Native binaries
      # -----------------------------------------------------

      - name: Download Linux native binary
        uses: actions/download-artifact@v4
        with:
          name: native-linux
          path: native/bin


      - name: Download Windows native binary
        uses: actions/download-artifact@v4
        with:
          name: native-windows
          path: native/bin


      - name: Verify native binaries
        shell: bash
        run: |
          set -euo pipefail

          test -f \
            native/bin/libbpt_core.so

          test -f \
            native/bin/bpt_core.dll

          echo
          echo "Native binaries:"

          ls -lh \
            native/bin


      # -----------------------------------------------------
      # Build version
      # -----------------------------------------------------

      - name: Calculate build version
        id: version
        shell: python
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          import os
          import tomllib

          with open(
              "blender_manifest.toml",
              "rb",
          ) as file:
              manifest = tomllib.load(file)

          base_version = manifest[
              "version"
          ]

          parts = base_version.split(
              "."
          )

          if len(parts) != 3:
              raise RuntimeError(
                  f"Invalid semantic version: {base_version}"
              )

          major = int(
              parts[0]
          )

          minor = int(
              parts[1]
          )

          build = int(
              os.environ[
                  "BUILD_NUMBER"
              ]
          )

          version = (
              f"{major}.{minor}.{build}"
          )

          with open(
              os.environ[
                  "GITHUB_OUTPUT"
              ],
              "a",
              encoding="utf-8",
          ) as output:
              output.write(
                  f"version={version}\n"
              )

          print(
              f"Build version: {version}"
          )


      - name: Define package name
        id: package_info
        shell: bash
        run: |
          set -euo pipefail

          ZIP_NAME="blender_projection_tool-${{ steps.version.outputs.version }}.zip"

          echo \
            "zip_name=${ZIP_NAME}" \
            >> "${GITHUB_OUTPUT}"

          echo \
            "ZIP: ${ZIP_NAME}"


      # -----------------------------------------------------
      # Build package tree
      # -----------------------------------------------------

      - name: Build package directory
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_ROOT="dist/blender_projection_tool"

          rm -rf \
            "${PACKAGE_ROOT}"

          mkdir -p \
            "${PACKAGE_ROOT}/core" \
            "${PACKAGE_ROOT}/implementations" \
            "${PACKAGE_ROOT}/native/bin"


          # -------------------------------------------------
          # Root extension files
          # -------------------------------------------------

          cp \
            blender_manifest.toml \
            "${PACKAGE_ROOT}/"

          cp \
            __init__.py \
            "${PACKAGE_ROOT}/"

          cp \
            version.py \
            "${PACKAGE_ROOT}/"

          cp \
            translations.py \
            "${PACKAGE_ROOT}/"

          cp -R \
            properties \
            operators \
            ui \
            "${PACKAGE_ROOT}/"

          cp \
            README.md \
            "${PACKAGE_ROOT}/"


          # -------------------------------------------------
          # Runtime Python core
          #
          # Automatically includes:
          #
          #   geometry_contracts/ (recursive package)
          #   native_bridge/ (recursive package)
          #   pipeline_contracts/ (recursive package)
          #   pipeline_registry/ (recursive package)
          #   pipeline_runner/ (recursive package)
          #   sdf/ (recursive package)
          #   sdf_surface/ (recursive package)
          #   uv_bake/ (recursive package)
          # -------------------------------------------------

          cp \
            core/*.py \
            "${PACKAGE_ROOT}/core/"

          cp -R \
            core/geometry_contracts \
            core/native_bridge \
            core/sdf \
            core/sdf_surface \
            core/projection_math \
            core/material_blend \
            core/material_visibility \
            core/projected_material \
            core/pipeline_contracts \
            core/pipeline_registry \
            core/pipeline_runner \
            core/uv_bake \
            "${PACKAGE_ROOT}/core/"


          # -------------------------------------------------
          # Pipeline implementations
          #
          # Automatically includes:
          #
          #   native_visual_hull/ (recursive package)
          #   sdf_reconstruction/ (recursive package)
          #   projected_color/ (recursive package)
          #   uv_bake/ (recursive package)
          # -------------------------------------------------

          cp \
            implementations/*.py \
            "${PACKAGE_ROOT}/implementations/"

          cp -R \
            implementations/native_visual_hull \
            implementations/sdf_reconstruction \
            implementations/projected_color \
            implementations/uv_bake \
            implementations/canonical_rig \
            implementations/projection_images \
            "${PACKAGE_ROOT}/implementations/"


          # -------------------------------------------------
          # Native libraries
          # -------------------------------------------------

          cp \
            native/bin/libbpt_core.so \
            "${PACKAGE_ROOT}/native/bin/"

          cp \
            native/bin/bpt_core.dll \
            "${PACKAGE_ROOT}/native/bin/"


          # -------------------------------------------------
          # License
          # -------------------------------------------------

          if [[ -f LICENSE ]]; then

            cp \
              LICENSE \
              "${PACKAGE_ROOT}/"

          fi


          echo
          echo "Package tree:"

          find \
            "${PACKAGE_ROOT}" \
            -type f \
            -print \
            | sort


      # -----------------------------------------------------
      # Patch packaged manifest version
      # -----------------------------------------------------

      - name: Patch packaged manifest version
        shell: python
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          import os
          import pathlib
          import re

          manifest_path = pathlib.Path(
              "dist/blender_projection_tool/blender_manifest.toml"
          )

          content = manifest_path.read_text(
              encoding="utf-8"
          )

          version = os.environ[
              "BUILD_VERSION"
          ]

          content, count = re.subn(
              r'^version\s*=\s*"[^"]+"',
              f'version = "{version}"',
              content,
              count=1,
              flags=re.MULTILINE,
          )

          if count != 1:
              raise RuntimeError(
                  "Could not patch manifest version."
              )

          manifest_path.write_text(
              content,
              encoding="utf-8",
          )

          print(
              f"Packaged version: {version}"
          )


