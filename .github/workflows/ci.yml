            "blender_projection_tool/implementations/uv_bake/metadata.py"
            "blender_projection_tool/implementations/uv_bake/sampler.py"
            "blender_projection_tool/implementations/uv_bake/settings.py"
            "blender_projection_tool/implementations/uv_bake/triangles.py"
            "blender_projection_tool/implementations/uv_bake/ui.py"
            "blender_projection_tool/implementations/canonical_rig/__init__.py"
            "blender_projection_tool/implementations/canonical_rig/binding.py"
            "blender_projection_tool/implementations/canonical_rig/implementation.py"


            # -----------------------------------------------
            # Implementations
            # -----------------------------------------------

            "blender_projection_tool/implementations/__init__.py"
            "blender_projection_tool/implementations/catalog.py"
            "blender_projection_tool/implementations/registration.py"
            "blender_projection_tool/implementations/projection_images/__init__.py"
            "blender_projection_tool/implementations/projection_images/context.py"
            "blender_projection_tool/implementations/projection_images/implementation.py"
            "blender_projection_tool/implementations/projection_images/models.py"
            "blender_projection_tool/implementations/projection_images/preparation.py"
            "blender_projection_tool/implementations/native_visual_hull/__init__.py"
            "blender_projection_tool/implementations/native_visual_hull/availability.py"
            "blender_projection_tool/implementations/native_visual_hull/blender_output.py"
            "blender_projection_tool/implementations/native_visual_hull/config.py"
            "blender_projection_tool/implementations/native_visual_hull/constants.py"
            "blender_projection_tool/implementations/native_visual_hull/execution.py"
            "blender_projection_tool/implementations/native_visual_hull/implementation.py"
            "blender_projection_tool/implementations/native_visual_hull/output.py"
            "blender_projection_tool/implementations/projected_color/__init__.py"
            "blender_projection_tool/implementations/projected_color/configuration.py"
            "blender_projection_tool/implementations/projected_color/geometry.py"
            "blender_projection_tool/implementations/projected_color/metadata.py"
            "blender_projection_tool/implementations/projected_color/implementation.py"


            # -----------------------------------------------
            # Native
            # -----------------------------------------------

            "blender_projection_tool/native/bin/libbpt_core.so"
            "blender_projection_tool/native/bin/bpt_core.dll"
          )

          mapfile -t ARCHIVE_FILES < <(
            unzip \
              -Z1 \
              "${ZIP_PATH}"
          )

          for required in "${required_archive_files[@]}"; do

            if ! printf \
              '%s\n' \
              "${ARCHIVE_FILES[@]}" \
              | grep \
                -Fxq \
                "${required}"
            then

              echo \
                "Missing archive file: ${required}"

              exit 1

            fi

          done

          echo
          echo "ZIP validation: OK"


      # =====================================================
      # Blender
      # =====================================================

      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: .blender

          key: blender-linux-x64-${{ env.BLENDER_VERSION }}


      - name: Download Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            "${BLENDER_ROOT}"

          URL="${BLENDER_BASE_URL}/${BLENDER_ARCHIVE}"

          ARCHIVE="/tmp/${BLENDER_ARCHIVE}"

          echo \
            "Downloading ${URL}"

          curl \
            --fail \
            --show-error \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 900 \
            --output "${ARCHIVE}" \
            "${URL}"

          xz \
            --test \
            "${ARCHIVE}"

          tar \
            -xJf "${ARCHIVE}" \
            -C "${BLENDER_ROOT}" \
            --strip-components=1

          rm \
            "${ARCHIVE}"


      - name: Verify Blender
        shell: bash
        run: |
          set -euo pipefail

          "${BLENDER_ROOT}/blender" \
            --version


      # -----------------------------------------------------
      # Extract exactly the ZIP we intend to distribute.
      # -----------------------------------------------------

      - name: Extract packaged extension for smoke tests
        shell: bash
        run: |
          set -euo pipefail

          ZIP_PATH="dist/${{ steps.package_info.outputs.zip_name }}"

          SMOKE_ROOT="${RUNNER_TEMP}/meshvenn-smoke"

          rm -rf \
            "${SMOKE_ROOT}"

          mkdir -p \
            "${SMOKE_ROOT}"

          unzip \
            -q \
            "${ZIP_PATH}" \
            -d "${SMOKE_ROOT}"

          PACKAGE_ROOT="${SMOKE_ROOT}/blender_projection_tool"

          test -f \
            "${PACKAGE_ROOT}/blender_manifest.toml"

          test -f \
            "${PACKAGE_ROOT}/__init__.py"


          # Blender registration packages

          test -f \
            "${PACKAGE_ROOT}/properties/__init__.py"

          test -f \
            "${PACKAGE_ROOT}/operators/__init__.py"

          test -f \
            "${PACKAGE_ROOT}/ui/__init__.py"

          # INPUT / projection

          test -f \
            "${PACKAGE_ROOT}/core/projection_math/__init__.py"

          test -f \
            "${PACKAGE_ROOT}/implementations/projection_images/__init__.py"

          # Pipeline / generic GEOMETRY

          test -f \
            "${PACKAGE_ROOT}/core/pipeline_contracts/__init__.py"

          test -f \
            "${PACKAGE_ROOT}/core/pipeline_registry/__init__.py"

          test -f \
            "${PACKAGE_ROOT}/core/pipeline_runner/__init__.py"

          test -f \
            "${PACKAGE_ROOT}/core/geometry_contracts/__init__.py"

          test -f \
            "${PACKAGE_ROOT}/core/geometry_contracts/projection.py"

          test -f \
            "${PACKAGE_ROOT}/core/geometry_contracts/surface.py"

          test -f \
            "${PACKAGE_ROOT}/core/geometry_contracts/validation.py"

          test -f \
            "${PACKAGE_ROOT}/core/native_bridge/__init__.py"

          test -f \
            "${PACKAGE_ROOT}/core/native_bridge/abi.py"

          test -f \
            "${PACKAGE_ROOT}/core/native_bridge/conversion.py"

          test -f \
            "${PACKAGE_ROOT}/core/native_bridge/errors.py"

          test -f \
            "${PACKAGE_ROOT}/core/native_bridge/models.py"

          test -f \
            "${PACKAGE_ROOT}/core/native_bridge/runtime.py"


          # SDF GEOMETRY

          test -f \
            "${PACKAGE_ROOT}/core/sdf/__init__.py"

          test -f \
            "${PACKAGE_ROOT}/core/sdf/build.py"

          test -f \
            "${PACKAGE_ROOT}/core/sdf_surface/__init__.py"

          test -f \
            "${PACKAGE_ROOT}/core/sdf_surface/surface_nets.py"

          test -f \
            "${PACKAGE_ROOT}/implementations/sdf_reconstruction/__init__.py"

          test -f \
            "${PACKAGE_ROOT}/implementations/sdf_reconstruction/execution.py"


          # MATERIAL

          test -f \
            "${PACKAGE_ROOT}/core/material_blend/__init__.py"

          test -f \
            "${PACKAGE_ROOT}/core/material_blend/domain.py"

          test -f \
            "${PACKAGE_ROOT}/core/material_blend/blending.py"

          test -f \
            "${PACKAGE_ROOT}/core/material_visibility/__init__.py"

          test -f \
            "${PACKAGE_ROOT}/core/material_visibility/domain.py"

          test -f \
            "${PACKAGE_ROOT}/core/material_visibility/blender_backend.py"

          test -f \
            "${PACKAGE_ROOT}/core/material_visibility/tester.py"

          test -f \
            "${PACKAGE_ROOT}/core/projected_material/__init__.py"

          test -f \
            "${PACKAGE_ROOT}/core/projected_material/constants.py"

          test -f \
            "${PACKAGE_ROOT}/core/projected_material/image_buffer.py"

          test -f \
            "${PACKAGE_ROOT}/core/projected_material/models.py"

          test -f \
            "${PACKAGE_ROOT}/core/projected_material/sampling.py"

          test -f \
            "${PACKAGE_ROOT}/core/projected_material/blending.py"

          test -f \
            "${PACKAGE_ROOT}/core/projected_material/blender_material.py"

          test -f \
            "${PACKAGE_ROOT}/core/projected_material/application.py"

          test -f \
            "${PACKAGE_ROOT}/implementations/projected_color/__init__.py"

          test -f \
            "${PACKAGE_ROOT}/implementations/projected_color/configuration.py"

          test -f \
            "${PACKAGE_ROOT}/implementations/projected_color/geometry.py"

          test -f \
            "${PACKAGE_ROOT}/implementations/projected_color/metadata.py"

          test -f \
            "${PACKAGE_ROOT}/implementations/projected_color/implementation.py"

          test -f \
            "${PACKAGE_ROOT}/core/uv_bake/__init__.py"

          test -f \
            "${PACKAGE_ROOT}/core/uv_bake/api.py"


          # Implementation catalog

          test -f \
            "${PACKAGE_ROOT}/implementations/__init__.py"

          test -f \
            "${PACKAGE_ROOT}/implementations/catalog.py"

          test -f \
            "${PACKAGE_ROOT}/implementations/registration.py"

          test -f \
            "${PACKAGE_ROOT}/implementations/native_visual_hull/__init__.py"

          test -f \
            "${PACKAGE_ROOT}/implementations/native_visual_hull/availability.py"

          test -f \
            "${PACKAGE_ROOT}/implementations/native_visual_hull/blender_output.py"

          test -f \
            "${PACKAGE_ROOT}/implementations/native_visual_hull/config.py"

          test -f \
            "${PACKAGE_ROOT}/implementations/native_visual_hull/constants.py"

          test -f \
            "${PACKAGE_ROOT}/implementations/native_visual_hull/execution.py"

          test -f \
            "${PACKAGE_ROOT}/implementations/native_visual_hull/implementation.py"

          test -f \
            "${PACKAGE_ROOT}/implementations/native_visual_hull/output.py"


          test -f \
            "${PACKAGE_ROOT}/implementations/uv_bake/__init__.py"

          test -f \
            "${PACKAGE_ROOT}/implementations/uv_bake/execution.py"

          echo
          echo "Smoke package:"

          find \
            "${PACKAGE_ROOT}" \
            -type f \
            -print \
            | sort


      # -----------------------------------------------------
      # General extension lifecycle smoke
      #
      # import
      #
      # generic geometry contract
      #
      # SDF core import
      # SDF Surface Nets import
      #
      # register
      #
      # 5 implementation registry
      #
      # SDF properties
      # SDF pipeline selection
      #
      # generic GEOMETRY -> MATERIAL compatibility
      #
      # operators
      # UI
      # unregister
      # -----------------------------------------------------

      - name: Blender packaged extension smoke test
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_ROOT="${RUNNER_TEMP}/meshvenn-smoke/blender_projection_tool"

          "${BLENDER_ROOT}/blender" \
            --background \
            --factory-startup \
            --python \
              tests/blender_smoke_test.py \
            -- \
            --package-root \
              "${PACKAGE_ROOT}"


      # -----------------------------------------------------
      # UV Bake V2 functional smoke
      #
      # Blender mesh
      #   ↓
      # UV adapter
      #   ↓
      # core rasterizer
      #   ↓
      # TextureBuffer
      #   ↓
      # bpy.data.images
      #   ↓
      # Principled material
      # -----------------------------------------------------

      - name: Blender UV Bake V2 functional smoke test
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_ROOT="${RUNNER_TEMP}/meshvenn-smoke/blender_projection_tool"

          "${BLENDER_ROOT}/blender" \
            --background \
            --factory-startup \
            --python \
              tests/blender_uv_bake_smoke.py \
            -- \
            --package-root \
              "${PACKAGE_ROOT}"


      # -----------------------------------------------------
      # Canonical Rig V1: fit, bind, deform and GLB roundtrip
      - name: Blender Canonical Rig V1 functional smoke test
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_ROOT="${RUNNER_TEMP}/meshvenn-smoke/blender_projection_tool"

          "${BLENDER_ROOT}/blender" \
            --background \
            --factory-startup \
            --python tests/blender_rig_smoke.py \
            -- \
            --package-root "${PACKAGE_ROOT}"

      # Artifacts are published only after Blender package
      # validation succeeds.
      # -----------------------------------------------------

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: blender-projection-tool-${{ steps.version.outputs.version }}

          path: dist/${{ steps.package_info.outputs.zip_name }}

          if-no-files-found: error

          retention-days: 30


      - name: Store release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: release-zip

          path: dist/${{ steps.package_info.outputs.zip_name }}

          if-no-files-found: error

          retention-days: 1


  # =========================================================
  # GitHub Release
  # =========================================================

  release:
    name: GitHub Release

    runs-on: ubuntu-latest

    needs:
      - package

    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'

    steps:

      - name: Download release ZIP
        uses: actions/download-artifact@v4
        with:
          name: release-zip

          path: dist


      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.package.outputs.version }}

          name: Meshvenn v${{ needs.package.outputs.version }}

          generate_release_notes: true

          files: |
            dist/${{ needs.package.outputs.zip_name }}

          body: |
            ## Meshvenn

            Blender extension build
            **v${{ needs.package.outputs.version }}**.

            ### Native platforms

            - Windows x64
            - Linux x64

            ### Pipeline

            Input
            → Geometry
            → Material
            → Rig
            → Export

            ### Current implementations

            **Input**

            - Projection Images

            **Geometry**

            - Native C++ Visual Hull
              - production default
              - multithreaded occupancy reconstruction
              - Surface Nets

            - SDF Reconstruction V1
              - experimental
              - pure-Python reference backend
              - exact 2D Euclidean distance fields
              - continuous multi-view SDF intersection
              - optional smooth intersection
              - surface offset / iso-level control
              - sub-voxel Surface Nets extraction
              - SDF gradient normals
              - generic GeometrySurfaceOutput
              - generic projection-space compatibility

            **Material**

            - Projected Color V1.2
              - visibility-aware projection
              - adaptive multi-view blending
              - generic geometry compatible

            - UV Bake V2
              - Blender Smart UV unwrap
              - projected-color surface sampling
              - visibility-aware texture bake
              - UV island padding
              - portable image texture material
              - generic geometry compatible

            **Rig**

            - Canonical Biped V1 (experimental)
            - A-pose 18-bone hierarchy, semantic names
            - automatic skinning with deterministic fallback
            - GLB skin/armature roundtrip validated

            **Export**

            - pipeline stage ready
            - implementation pending

            ### Validation

            The release package has passed:

            - pure Python tests

            - generic GEOMETRY contract tests

            - SDF signed-distance field tests
              - Euclidean distance transform
              - silhouette sign
              - projection constraints
              - multi-view intersection
              - conservative symmetry
              - dense 3D field

            - continuous SDF Surface Nets tests
              - analytic planes
              - sub-voxel interpolation
              - analytic spheres
              - outward normals
              - quad winding
              - topology
              - continuous iso-level movement

            - non-Visual-Hull GEOMETRY compatibility tests

            - UV Bake V2 rasterization tests

            - Linux native tests
            - Windows native tests

            - package completeness validation
            - source/package parity validation
            - ZIP integrity validation

            - Blender 5.2.1 extension lifecycle smoke test
            - Blender 5.2.1 SDF registry/property smoke test
            - Blender 5.2.1 generic GEOMETRY → MATERIAL smoke test
            - Blender 5.2.1 UV Bake V2 functional smoke test

            ### SDF V1 status

            SDF Reconstruction V1 currently uses the
            correctness-oriented Python reference backend.

            Native Visual Hull remains the default GEOMETRY
            implementation.

            SDF is selectable as an experimental GEOMETRY
            implementation.

            Native acceleration will be introduced after
            visual comparison against the reference backend.

            ### Installation

            Blender 5.2.1:

            `Edit → Preferences → Extensions → Install from Disk`

            Select:

            `${{ needs.package.outputs.zip_name }}`
