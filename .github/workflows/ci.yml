# .github/workflows/ci.yml

name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_*.py" \
            -v

  validate:
    name: Validate extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          set -e

          required_files=(
            "blender_manifest.toml"
            "__init__.py"
            "version.py"
            "properties.py"
            "operators.py"
            "ui.py"
            "core/__init__.py"
            "core/masks.py"
            "core/visual_hull.py"
            "core/mesh_builder.py"
            "core/cleanup.py"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Missing required file: $file"
              exit 1
            fi
          done

  package:
    name: Build Blender ZIP
    runs-on: ubuntu-latest

    needs:
      - test
      - validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Calculate build version
        id: version
        shell: python
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          import os
          import tomllib

          with open("blender_manifest.toml", "rb") as file:
              manifest = tomllib.load(file)

          base_version = manifest["version"]
          major, minor, _patch = base_version.split(".")

          build_number = int(os.environ["BUILD_NUMBER"])

          version = f"{major}.{minor}.{build_number}"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as file:
              file.write(f"version={version}\n")

          print(f"Build version: {version}")

      - name: Build package directory
        shell: bash
        run: |
          set -e

          PACKAGE_ROOT="dist/blender_projection_tool"

          mkdir -p "$PACKAGE_ROOT/core"

          cp blender_manifest.toml "$PACKAGE_ROOT/"
          cp __init__.py "$PACKAGE_ROOT/"
          cp version.py "$PACKAGE_ROOT/"
          cp properties.py "$PACKAGE_ROOT/"
          cp operators.py "$PACKAGE_ROOT/"
          cp ui.py "$PACKAGE_ROOT/"

          cp core/__init__.py "$PACKAGE_ROOT/core/"
          cp core/masks.py "$PACKAGE_ROOT/core/"
          cp core/visual_hull.py "$PACKAGE_ROOT/core/"
          cp core/mesh_builder.py "$PACKAGE_ROOT/core/"
          cp core/cleanup.py "$PACKAGE_ROOT/core/"

          if [[ -f README.md ]]; then
            cp README.md "$PACKAGE_ROOT/"
          fi

          if [[ -f LICENSE ]]; then
            cp LICENSE "$PACKAGE_ROOT/"
          fi

      - name: Patch packaged manifest version
        shell: python
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          import os
          import pathlib
          import re

          manifest_path = pathlib.Path(
              "dist/blender_projection_tool/blender_manifest.toml"
          )

          content = manifest_path.read_text(
              encoding="utf-8"
          )

          build_version = os.environ["BUILD_VERSION"]

          content, count = re.subn(
              r'^version\s*=\s*"[^"]+"',
              f'version = "{build_version}"',
              content,
              count=1,
              flags=re.MULTILINE,
          )

          if count != 1:
              raise RuntimeError(
                  "Could not patch manifest version."
              )

          manifest_path.write_text(
              content,
              encoding="utf-8",
          )

      - name: Validate packaged version
        shell: python
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          import os
          import tomllib

          with open(
              "dist/blender_projection_tool/blender_manifest.toml",
              "rb",
          ) as file:
              manifest = tomllib.load(file)

          expected = os.environ["BUILD_VERSION"]
          actual = manifest["version"]

          if actual != expected:
              raise RuntimeError(
                  f"Expected version {expected}, found {actual}"
              )

          print(f"Packaged version: {actual}")

      - name: Create ZIP
        shell: bash
        run: |
          set -e

          cd dist

          zip -r \
            "blender_projection_tool-${{ steps.version.outputs.version }}.zip" \
            blender_projection_tool

      - name: Upload Blender extension
        uses: actions/upload-artifact@v4
        with:
          name: blender-projection-tool-${{ steps.version.outputs.version }}
          path: dist/blender_projection_tool-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 30