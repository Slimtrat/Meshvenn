name: E2E Examples

on:
  push:
    branches:
      - main
      - develop
      - dev
    paths:
      - "core/**"
      - "scripts/**"
      - "example/**"
      - ".github/workflows/e2e_examples.yml"

  pull_request:
    paths:
      - "core/**"
      - "scripts/**"
      - "example/**"
      - ".github/workflows/e2e_examples.yml"

  workflow_dispatch:

permissions:
  contents: read

env:
  BLENDER_VERSION: "5.2.1"
  BLENDER_ARCHIVE: "blender-5.2.1-linux-x64.tar.xz"
  BLENDER_ROOT: "${{ github.workspace }}/.blender"

jobs:
  e2e-examples:
    name: Blender 5.2.1 E2E Scan
    runs-on: ubuntu-latest

    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: .blender
          key: blender-${{ runner.os }}-${{ env.BLENDER_VERSION }}

      - name: Download Blender 5.2.1
        if: steps.blender-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${BLENDER_ROOT}"

          curl \
            --fail \
            --location \
            --retry 3 \
            --output "/tmp/${BLENDER_ARCHIVE}" \
            "https://download.blender.org/release/Blender5.2/${BLENDER_ARCHIVE}"

          tar \
            -xJf "/tmp/${BLENDER_ARCHIVE}" \
            -C "${BLENDER_ROOT}" \
            --strip-components=1

          rm "/tmp/${BLENDER_ARCHIVE}"

      - name: Expose Blender executable
        shell: bash
        run: |
          set -euo pipefail

          echo "${BLENDER_ROOT}" >> "$GITHUB_PATH"

      - name: Verify Blender version
        shell: bash
        run: |
          set -euo pipefail

          blender --version

          VERSION_OUTPUT="$(blender --version | head -n 1)"

          echo "Detected: ${VERSION_OUTPUT}"

          if [[ "${VERSION_OUTPUT}" != *"Blender ${BLENDER_VERSION}"* ]]; then
            echo "Expected Blender ${BLENDER_VERSION}."
            exit 1
          fi

      - name: Verify required project files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "scripts/generate_example.py"
            "scripts/generate_all_examples.py"
            "scripts/scan_profiles.py"
            "core/__init__.py"
            "core/masks.py"
            "core/visual_hull.py"
            "core/mesh_builder.py"
            "core/cleanup.py"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Missing file: $file"
              exit 1
            fi
          done

      - name: List source sheets
        shell: bash
        run: |
          set -euo pipefail

          find example \
            -type f \
            -path "*/sheets/sheet*.png" \
            -print

          SHEET_COUNT="$(
            find example \
              -type f \
              -path "*/sheets/sheet*.png" \
              | wc -l
          )"

          echo "Detected sheets: ${SHEET_COUNT}"

          if [[ "${SHEET_COUNT}" -lt 1 ]]; then
            echo "No sheet*.png examples found."
            exit 1
          fi

      - name: Generate all scan profiles
        shell: bash
        run: |
          set -euo pipefail

          python scripts/generate_all_examples.py \
            --blender blender \
            --examples example \
            --output output/examples \
            --resolution 64 \
            --threshold 0.1 \
            --target-height 2.0 \
            --voxel-size 0.05 \
            --smooth 3 \
            --sheet-white-threshold 0.94 \
            --continue-on-error

      - name: Show generated tree
        if: always()
        shell: bash
        run: |
          if [[ -d output ]]; then
            find output -maxdepth 10 -type f -print | sort
          else
            echo "No output directory."
          fi

      - name: Verify manifests
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST_COUNT="$(
            find output/examples \
              -type f \
              -name "manifest.json" \
              | wc -l
          )"

          echo "Generated manifests: ${MANIFEST_COUNT}"

          if [[ "${MANIFEST_COUNT}" -lt 1 ]]; then
            echo "No manifest.json generated."
            exit 1
          fi

      - name: Verify extracted views
        shell: bash
        run: |
          set -euo pipefail

          EXTRACTED_COUNT="$(
            find output/examples \
              -type f \
              -path "*/extracted/*.png" \
              | wc -l
          )"

          echo "Extracted views: ${EXTRACTED_COUNT}"

          if [[ "${EXTRACTED_COUNT}" -lt 2 ]]; then
            echo "Not enough extracted views."
            exit 1
          fi

      - name: Verify GLB outputs
        shell: bash
        run: |
          set -euo pipefail

          GLB_COUNT="$(
            find output/examples \
              -type f \
              -name "*.glb" \
              | wc -l
          )"

          echo "Generated GLB files: ${GLB_COUNT}"

          if [[ "${GLB_COUNT}" -lt 1 ]]; then
            echo "No GLB generated."
            exit 1
          fi

      - name: Verify Blend outputs
        shell: bash
        run: |
          set -euo pipefail

          BLEND_COUNT="$(
            find output/examples \
              -type f \
              -name "*.blend" \
              | wc -l
          )"

          echo "Generated Blend files: ${BLEND_COUNT}"

          if [[ "${BLEND_COUNT}" -lt 1 ]]; then
            echo "No Blend file generated."
            exit 1
          fi

      - name: Validate manifest JSON
        shell: python
        run: |
          import json
          from pathlib import Path

          manifests = list(
              Path("output/examples").rglob("manifest.json")
          )

          if not manifests:
              raise SystemExit("No manifests found.")

          total_generated_profiles = 0

          for manifest_path in manifests:
              data = json.loads(
                  manifest_path.read_text(
                      encoding="utf-8"
                  )
              )

              assert "source" in data
              assert "source_sha256" in data
              assert "cuts" in data
              assert "available_views" in data
              assert "profiles" in data

              generated = [
                  profile_name
                  for profile_name, profile in data["profiles"].items()
                  if profile.get("generated") is True
              ]

              total_generated_profiles += len(generated)

              print(
                  manifest_path,
                  "views=",
                  data["available_views"],
                  "generated=",
                  generated,
              )

          if total_generated_profiles < 1:
              raise SystemExit(
                  "No scan profile was successfully generated."
              )

      - name: Upload E2E outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-projection-tool-e2e-${{ github.run_number }}
          path: output/examples
          if-no-files-found: warn
          retention-days: 14