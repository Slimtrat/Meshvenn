name: Native Examples

on:
  push:
    branches:
      - main
    paths:
      - "native/**"
      - "core/native_*.py"
      - "scripts/generate_*native.py"
      - "example/**/sheets/**"
      - ".github/workflows/native_examples.yml"

  workflow_dispatch:
    inputs:
      example:
        description: >
          Example à générer.
          "all" ou par exemple "mascotte/test1".
        required: true
        default: "all"
        type: string

      start_sheet:
        description: >
          Commencer à partir de cette planche.
          Vide = toutes.
          Exemple: sheet2.png
          ou mascotte/test1/sheets/sheet2.png
        required: false
        default: ""
        type: string

      profiles:
        description: >
          Profils séparés par espaces.
          Exemple: L2 L4 L8 L10
        required: true
        default: "L2 L4 L8 L10"
        type: string

      resolution:
        description: "Résolution voxel"
        required: true
        default: "64"
        type: choice
        options:
          - "32"
          - "48"
          - "64"
          - "96"
          - "128"

      thread_count:
        description: >
          Threads natifs.
          0 = auto.
        required: true
        default: "0"
        type: string

      commit_results:
        description: >
          Committer GLB, manifests et découpes générées sur main.
        required: true
        default: true
        type: boolean


permissions:
  contents: write


concurrency:
  group: native-examples-${{ github.ref }}
  cancel-in-progress: true


env:
  BLENDER_VERSION: "5.2.1"
  BLENDER_ARCHIVE: "blender-5.2.1-linux-x64.tar.xz"
  BLENDER_BASE_URL: "https://download.blender.org/release/Blender5.2"
  BLENDER_ROOT: "${{ github.workspace }}/.blender"


jobs:

  # ---------------------------------------------------------
  # Resolve generation parameters
  # ---------------------------------------------------------

  config:
    name: Configure
    runs-on: ubuntu-latest

    outputs:
      example: ${{ steps.config.outputs.example }}
      start_sheet: ${{ steps.config.outputs.start_sheet }}
      profiles: ${{ steps.config.outputs.profiles }}
      resolution: ${{ steps.config.outputs.resolution }}
      thread_count: ${{ steps.config.outputs.thread_count }}
      commit_results: ${{ steps.config.outputs.commit_results }}

    steps:
      - name: Resolve configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then

            echo "example=${{ inputs.example }}" >> "$GITHUB_OUTPUT"

            echo \
              "start_sheet=${{ inputs.start_sheet }}" \
              >> "$GITHUB_OUTPUT"

            echo \
              "profiles=${{ inputs.profiles }}" \
              >> "$GITHUB_OUTPUT"

            echo \
              "resolution=${{ inputs.resolution }}" \
              >> "$GITHUB_OUTPUT"

            echo \
              "thread_count=${{ inputs.thread_count }}" \
              >> "$GITHUB_OUTPUT"

            echo \
              "commit_results=${{ inputs.commit_results }}" \
              >> "$GITHUB_OUTPUT"

          else

            echo "example=all" >> "$GITHUB_OUTPUT"
            echo "start_sheet=" >> "$GITHUB_OUTPUT"
            echo "profiles=L2 L4 L8 L10" >> "$GITHUB_OUTPUT"
            echo "resolution=64" >> "$GITHUB_OUTPUT"
            echo "thread_count=0" >> "$GITHUB_OUTPUT"
            echo "commit_results=true" >> "$GITHUB_OUTPUT"

          fi


  # ---------------------------------------------------------
  # Native build
  # ---------------------------------------------------------

  native:
    name: Build native core
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++

      - name: Configure native core
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            -S native \
            -B build/native \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBPT_BUILD_TESTS=ON

      - name: Build native core
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build build/native \
            --config Release \
            --parallel

      - name: Run native tests
        shell: bash
        run: |
          set -euo pipefail

          ctest \
            --test-dir build/native \
            --output-on-failure

      - name: Stage native library
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p native/bin

          LIB_PATH="$(
            find build/native \
              -type f \
              -name "libbpt_core.so" \
              | head -n 1
          )"

          if [[ -z "${LIB_PATH}" ]]; then
            echo "libbpt_core.so not found"
            exit 1
          fi

          cp \
            "${LIB_PATH}" \
            native/bin/libbpt_core.so

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: native-core-linux-main
          path: native/bin/libbpt_core.so
          if-no-files-found: error
          retention-days: 3


  # ---------------------------------------------------------
  # Generate examples
  # ---------------------------------------------------------

  generate:
    name: Generate native examples
    needs:
      - config
      - native

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download native library
        uses: actions/download-artifact@v4
        with:
          name: native-core-linux-main
          path: native/bin

      - name: Verify native library
        shell: bash
        run: |
          set -euo pipefail

          test \
            -f native/bin/libbpt_core.so

          ls -lh \
            native/bin/libbpt_core.so

      # -----------------------------------------------------
      # Blender
      # -----------------------------------------------------

      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: .blender
          key: blender-linux-x64-${{ env.BLENDER_VERSION }}

      - name: Download Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            "${BLENDER_ROOT}"

          URL="${BLENDER_BASE_URL}/${BLENDER_ARCHIVE}"
          ARCHIVE="/tmp/${BLENDER_ARCHIVE}"

          curl \
            --fail \
            --show-error \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 900 \
            --output "${ARCHIVE}" \
            "${URL}"

          xz \
            --test \
            "${ARCHIVE}"

          tar \
            -xJf "${ARCHIVE}" \
            -C "${BLENDER_ROOT}" \
            --strip-components=1

          rm \
            "${ARCHIVE}"

      - name: Verify Blender
        shell: bash
        run: |
          set -euo pipefail

          "${BLENDER_ROOT}/blender" \
            --version

      # -----------------------------------------------------
      # Show config
      # -----------------------------------------------------

      - name: Show generation config
        shell: bash
        run: |
          echo "Example:      ${{ needs.config.outputs.example }}"
          echo "Start sheet:  ${{ needs.config.outputs.start_sheet }}"
          echo "Profiles:     ${{ needs.config.outputs.profiles }}"
          echo "Resolution:   ${{ needs.config.outputs.resolution }}"
          echo "Thread count: ${{ needs.config.outputs.thread_count }}"
          echo "Commit:       ${{ needs.config.outputs.commit_results }}"

      # -----------------------------------------------------
      # Generate
      # -----------------------------------------------------

      - name: Generate all native examples
        shell: bash
        run: |
          set -euo pipefail

          COMMAND=(
            "${BLENDER_ROOT}/blender"
            "--background"
            "--factory-startup"
            "--python"
            "scripts/generate_all_native.py"
            "--"
            "--examples"
            "example"
            "--example"
            "${{ needs.config.outputs.example }}"
            "--resolution"
            "${{ needs.config.outputs.resolution }}"
            "--thread-count"
            "${{ needs.config.outputs.thread_count }}"
            "--skip-blend"
            "--continue-on-error"
          )

          START_SHEET="${{ needs.config.outputs.start_sheet }}"

          if [[ -n "${START_SHEET}" ]]; then
            COMMAND+=(
              "--start-sheet"
              "${START_SHEET}"
            )
          fi

          read -r -a PROFILES <<< \
            "${{ needs.config.outputs.profiles }}"

          if [[ "${#PROFILES[@]}" -gt 0 ]]; then
            COMMAND+=(
              "--profiles"
            )

            for PROFILE in "${PROFILES[@]}"; do
              COMMAND+=(
                "${PROFILE}"
              )
            done
          fi

          printf '[projection-tool] command:'
          printf ' %q' "${COMMAND[@]}"
          echo

          "${COMMAND[@]}"

      # -----------------------------------------------------
      # Validation
      # -----------------------------------------------------

      - name: Show generated tree
        if: always()
        shell: bash
        run: |
          find example \
            -type f \
            -path "*/generated/*" \
            -print \
            | sort \
            || true

      - name: Validate manifests
        shell: python
        run: |
          import json
          from pathlib import Path

          manifests = list(
              Path("example").rglob(
                  "generated/*/manifest.json"
              )
          )

          if not manifests:
              raise SystemExit(
                  "No manifest generated."
              )

          generated_profiles = 0

          for manifest_path in manifests:
              data = json.loads(
                  manifest_path.read_text(
                      encoding="utf-8"
                  )
              )

              if data.get("engine") != "native-cpp":
                  raise SystemExit(
                      f"{manifest_path} was not generated by native-cpp"
                  )

              profiles = data.get(
                  "profiles",
                  {}
              )

              successful = [
                  name
                  for name, profile in profiles.items()
                  if profile.get("generated") is True
              ]

              print(
                  manifest_path,
                  successful,
              )

              generated_profiles += len(
                  successful
              )

          if generated_profiles == 0:
              raise SystemExit(
                  "No successful native profile."
              )

      - name: Validate GLB outputs
        shell: bash
        run: |
          set -euo pipefail

          GLB_COUNT="$(
            find example \
              -type f \
              -path "*/generated/*" \
              -name "*.glb" \
              | wc -l
          )"

          echo "GLB files: ${GLB_COUNT}"

          if [[ "${GLB_COUNT}" -lt 1 ]]; then
            echo "No GLB generated."
            exit 1
          fi

      # -----------------------------------------------------
      # CI artifact
      # -----------------------------------------------------

      - name: Upload generated examples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-generated-examples-${{ github.run_number }}
          path: |
            example/**/generated/**
          if-no-files-found: warn
          retention-days: 14

      # -----------------------------------------------------
      # Commit generated dataset
      # -----------------------------------------------------

      - name: Prepare Git changes
        if: >
          needs.config.outputs.commit_results == 'true'
          && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          find example \
            -type f \
            -path "*/generated/*" \
            -name "*.blend" \
            -delete

          git status \
            --short

      - name: Commit generated examples
        if: >
          needs.config.outputs.commit_results == 'true'
          && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "projection-tool-bot"

          git config \
            user.email \
            "projection-tool-bot@users.noreply.github.com"

          git add \
            'example/**/generated/**'

          if git diff \
            --cached \
            --quiet
          then
            echo "Generated examples already up-to-date."
            exit 0
          fi

          git commit \
            -m \
            "chore: regenerate native examples [generated examples]"

          git push \
            origin \
            HEAD:main