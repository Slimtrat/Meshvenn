name: Visual Preview

on:
  pull_request:
    paths:
      - "native/**"
      - "core/**"
      - "scripts/render_turntable.py"
      - "scripts/generate_*native.py"
      - "example/**"
      - ".github/workflows/visual_preview.yml"

  push:
    branches:
      - main
    paths:
      - "native/**"
      - "core/**"
      - "scripts/render_turntable.py"
      - "scripts/generate_*native.py"
      - "example/**"
      - ".github/workflows/visual_preview.yml"

  workflow_dispatch:
    inputs:
      resolution:
        description: "Visual hull resolution"
        required: false
        default: "64"

      profiles:
        description: "Profiles, space separated"
        required: false
        default: "L2 L4 L8 L10"

      frames:
        description: "Turntable frame count"
        required: false
        default: "36"

      size:
        description: "Preview size"
        required: false
        default: "512"


permissions:
  contents: read


concurrency:
  group: visual-preview-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true


env:
  BLENDER_VERSION: "5.2.1"

  BLENDER_ARCHIVE: >-
    blender-5.2.1-linux-x64.tar.xz

  BLENDER_BASE_URL: >-
    https://download.blender.org/release/Blender5.2

  BLENDER_ROOT: >-
    ${{ github.workspace }}/.blender


jobs:

  # ---------------------------------------------------------
  # Native build
  # ---------------------------------------------------------

  native:
    name: Build native core

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify build tools
        shell: bash
        run: |
          set -euo pipefail

          cmake --version
          ninja --version
          g++ --version

      - name: Configure native core
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            -S native \
            -B build/native \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBPT_BUILD_TESTS=ON

      - name: Build native core
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build build/native \
            --parallel

      - name: Run native tests
        shell: bash
        run: |
          set -euo pipefail

          ctest \
            --test-dir build/native \
            --output-on-failure

      - name: Stage native library
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            native/bin

          LIB_PATH="$(
            find build/native \
              -type f \
              -name "libbpt_core.so" \
              | head -n 1
          )"

          if [[ -z "${LIB_PATH}" ]]; then
            echo "libbpt_core.so not found"
            exit 1
          fi

          cp \
            "${LIB_PATH}" \
            native/bin/libbpt_core.so

          ls -lh \
            native/bin/libbpt_core.so

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: visual-preview-native-linux
          path: native/bin/libbpt_core.so
          if-no-files-found: error
          retention-days: 2


  # ---------------------------------------------------------
  # Preview
  # ---------------------------------------------------------

  preview:
    name: Generate visual previews

    needs:
      - native

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download native library
        uses: actions/download-artifact@v4
        with:
          name: visual-preview-native-linux
          path: native/bin

      - name: Verify native library
        shell: bash
        run: |
          set -euo pipefail

          test \
            -f native/bin/libbpt_core.so

          ls -lh \
            native/bin/libbpt_core.so


      # -----------------------------------------------------
      # Blender
      # -----------------------------------------------------

      - name: Cache Blender
        id: blender-cache

        uses: actions/cache@v4

        with:
          path: .blender
          key: blender-linux-x64-${{ env.BLENDER_VERSION }}

      - name: Download Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'

        shell: bash

        run: |
          set -euo pipefail

          mkdir -p \
            "${BLENDER_ROOT}"

          URL="${BLENDER_BASE_URL}/${BLENDER_ARCHIVE}"

          ARCHIVE="/tmp/${BLENDER_ARCHIVE}"

          curl \
            --fail \
            --show-error \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 900 \
            --output "${ARCHIVE}" \
            "${URL}"

          xz \
            --test \
            "${ARCHIVE}"

          tar \
            -xJf "${ARCHIVE}" \
            -C "${BLENDER_ROOT}" \
            --strip-components=1

          rm \
            "${ARCHIVE}"

      - name: Verify Blender
        shell: bash
        run: |
          set -euo pipefail

          "${BLENDER_ROOT}/blender" \
            --version


      # -----------------------------------------------------
      # Configuration
      # -----------------------------------------------------

      - name: Resolve configuration
        id: config

        shell: bash

        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then

            RESOLUTION="${{ inputs.resolution }}"
            PROFILES="${{ inputs.profiles }}"
            FRAMES="${{ inputs.frames }}"
            SIZE="${{ inputs.size }}"

          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then

            RESOLUTION="48"
            PROFILES="L2"
            FRAMES="24"
            SIZE="384"

          else

            RESOLUTION="64"
            PROFILES="L2 L4 L8 L10"
            FRAMES="36"
            SIZE="512"

          fi

          if ! [[ "${RESOLUTION}" =~ ^[0-9]+$ ]]; then
            echo "Invalid resolution: ${RESOLUTION}"
            exit 1
          fi

          if ! [[ "${FRAMES}" =~ ^[0-9]+$ ]]; then
            echo "Invalid frame count: ${FRAMES}"
            exit 1
          fi

          if ! [[ "${SIZE}" =~ ^[0-9]+$ ]]; then
            echo "Invalid size: ${SIZE}"
            exit 1
          fi

          echo \
            "resolution=${RESOLUTION}" \
            >> "${GITHUB_OUTPUT}"

          echo \
            "profiles=${PROFILES}" \
            >> "${GITHUB_OUTPUT}"

          echo \
            "frames=${FRAMES}" \
            >> "${GITHUB_OUTPUT}"

          echo \
            "size=${SIZE}" \
            >> "${GITHUB_OUTPUT}"

          echo "Resolution: ${RESOLUTION}"
          echo "Profiles: ${PROFILES}"
          echo "Frames: ${FRAMES}"
          echo "Size: ${SIZE}"


      # -----------------------------------------------------
      # Native generation
      # -----------------------------------------------------

      - name: Generate native scans
        shell: bash

        run: |
          set -euo pipefail

          read -ra PROFILE_ARGS \
            <<< "${{ steps.config.outputs.profiles }}"

          "${BLENDER_ROOT}/blender" \
            --background \
            --factory-startup \
            --python scripts/generate_all_native.py \
            -- \
            --examples example \
            --example mascotte/test1 \
            --start-sheet sheet1.png \
            --profiles "${PROFILE_ARGS[@]}" \
            --resolution "${{ steps.config.outputs.resolution }}" \
            --thread-count 0 \
            --skip-blend


      # -----------------------------------------------------
      # Visual rendering
      # -----------------------------------------------------

      - name: Render previews
        shell: bash

        run: |
          set -euo pipefail

          mkdir -p \
            visual-preview

          for LEVEL in ${{ steps.config.outputs.profiles }}; do

            SCAN_DIR="example/mascotte/test1/generated/sheet1/scans/${LEVEL}"

            if [[ ! -d "${SCAN_DIR}" ]]; then
              echo "Missing scan directory: ${SCAN_DIR}"
              exit 1
            fi

            GLB="$(
              find "${SCAN_DIR}" \
                -type f \
                -name "*.glb" \
                | head -n 1
            )"

            if [[ -z "${GLB}" ]]; then
              echo "No GLB found for ${LEVEL}"
              exit 1
            fi

            OUTPUT_DIR="visual-preview/${LEVEL}"

            mkdir -p \
              "${OUTPUT_DIR}"

            echo
            echo "Rendering ${LEVEL}"
            echo "GLB: ${GLB}"
            echo

            "${BLENDER_ROOT}/blender" \
              --background \
              --factory-startup \
              --python scripts/render_turntable.py \
              -- \
              --input "${GLB}" \
              --output "${OUTPUT_DIR}" \
              --frames "${{ steps.config.outputs.frames }}" \
              --size "${{ steps.config.outputs.size }}" \
              --contact-views 8 \
              --fps 24

          done


      # -----------------------------------------------------
      # Verify
      # -----------------------------------------------------

      - name: Verify previews
        shell: bash

        run: |
          set -euo pipefail

          for LEVEL in ${{ steps.config.outputs.profiles }}; do

            DIR="visual-preview/${LEVEL}"

            CONTACT="${DIR}/contact_sheet.png"
            VIDEO="${DIR}/turntable.mp4"

            if [[ ! -s "${CONTACT}" ]]; then
              echo \
                "Missing contact sheet for ${LEVEL}"

              exit 1
            fi

            if [[ ! -s "${VIDEO}" ]]; then
              echo \
                "Missing turntable video for ${LEVEL}"

              exit 1
            fi

            echo
            echo "${LEVEL}:"
            ls -lh \
              "${CONTACT}" \
              "${VIDEO}"

          done


      # -----------------------------------------------------
      # GitHub summary
      # -----------------------------------------------------

      - name: Generate preview summary
        if: always()

        shell: bash

        run: |
          {
            echo "# Native visual preview"
            echo

            echo \
              "Resolution: **${{ steps.config.outputs.resolution }}**"

            echo

            echo \
              "Profiles: **${{ steps.config.outputs.profiles }}**"

            echo

            echo \
              "Frames: **${{ steps.config.outputs.frames }}**"

            echo

            echo \
              "Render size: **${{ steps.config.outputs.size }} × ${{ steps.config.outputs.size }}**"

            echo
            echo "Generated previews:"
            echo

            find visual-preview \
              -maxdepth 2 \
              -type f \
              \( \
                -name "turntable.mp4" \
                -o \
                -name "contact_sheet.png" \
              \) \
              -print \
              | sort \
              | sed 's/^/- `/' \
              | sed 's/$/`/' \
              || true

          } >> "${GITHUB_STEP_SUMMARY}"


      # -----------------------------------------------------
      # Debug
      # -----------------------------------------------------

      - name: Show generated files
        if: always()

        shell: bash

        run: |
          echo "Visual previews:"

          find visual-preview \
            -type f \
            -print \
            | sort \
            || true

          echo

          echo "Generated scans:"

          find example/mascotte/test1/generated \
            -type f \
            -print \
            | sort \
            || true


      # -----------------------------------------------------
      # Artifact
      # -----------------------------------------------------

      - name: Upload visual previews
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: native-visual-preview-${{ github.run_number }}

          path: |
            visual-preview/**
            example/mascotte/test1/generated/sheet1/manifest.json

          if-no-files-found: warn

          retention-days: 14