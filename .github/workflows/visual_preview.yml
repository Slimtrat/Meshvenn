name: Visual Preview

on:
  pull_request:
    paths:
      - "native/**"
      - "core/**"
      - "scripts/render_turntable.py"
      - "scripts/generate_*native.py"
      - "example/**"
      - ".github/workflows/visual_preview.yml"

  push:
    branches:
      - main
    paths:
      - "native/**"
      - "core/**"
      - "scripts/render_turntable.py"
      - "scripts/generate_*native.py"
      - "example/**"
      - ".github/workflows/visual_preview.yml"

  workflow_dispatch:
    inputs:
      resolution:
        description: "Visual hull resolution"
        required: false
        default: "64"

      profiles:
        description: "Profiles, space separated"
        required: false
        default: "L2 L4 L8 L10"

permissions:
  contents: read

concurrency:
  group: visual-preview-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BLENDER_VERSION: "5.2.1"
  BLENDER_ARCHIVE: "blender-5.2.1-linux-x64.tar.xz"
  BLENDER_BASE_URL: "https://download.blender.org/release/Blender5.2"
  BLENDER_ROOT: "${{ github.workspace }}/.blender"


jobs:

  # ---------------------------------------------------------
  # Build native core
  # ---------------------------------------------------------

  native:
    name: Build native core
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native build tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++

      - name: Configure native core
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            -S native \
            -B build/native \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBPT_BUILD_TESTS=ON

      - name: Build native core
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build build/native \
            --parallel

      - name: Run native tests
        shell: bash
        run: |
          set -euo pipefail

          ctest \
            --test-dir build/native \
            --output-on-failure

      - name: Stage native library
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p native/bin

          LIB_PATH="$(
            find build/native \
              -type f \
              -name "libbpt_core.so" \
              | head -n 1
          )"

          if [[ -z "${LIB_PATH}" ]]; then
            echo "libbpt_core.so not found"
            exit 1
          fi

          cp \
            "${LIB_PATH}" \
            native/bin/libbpt_core.so

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: visual-preview-native-linux
          path: native/bin/libbpt_core.so
          if-no-files-found: error
          retention-days: 2


  # ---------------------------------------------------------
  # Generate GLBs + visual turntables
  # ---------------------------------------------------------

  preview:
    name: Generate visual previews
    needs:
      - native

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download native library
        uses: actions/download-artifact@v4
        with:
          name: visual-preview-native-linux
          path: native/bin

      - name: Verify native library
        shell: bash
        run: |
          set -euo pipefail

          test -f \
            native/bin/libbpt_core.so

      # -----------------------------------------------------
      # Blender
      # -----------------------------------------------------

      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: .blender
          key: blender-linux-x64-${{ env.BLENDER_VERSION }}

      - name: Download Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            "${BLENDER_ROOT}"

          URL="${BLENDER_BASE_URL}/${BLENDER_ARCHIVE}"
          ARCHIVE="/tmp/${BLENDER_ARCHIVE}"

          curl \
            --fail \
            --show-error \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 900 \
            --output "${ARCHIVE}" \
            "${URL}"

          xz \
            --test \
            "${ARCHIVE}"

          tar \
            -xJf "${ARCHIVE}" \
            -C "${BLENDER_ROOT}" \
            --strip-components=1

          rm \
            "${ARCHIVE}"

      - name: Verify Blender
        shell: bash
        run: |
          set -euo pipefail

          "${BLENDER_ROOT}/blender" \
            --version

      # -----------------------------------------------------
      # FFmpeg
      # -----------------------------------------------------

      - name: Install ffmpeg
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg

      # -----------------------------------------------------
      # Resolve preview configuration
      # -----------------------------------------------------

      - name: Resolve configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RESOLUTION="${{ inputs.resolution }}"
            PROFILES="${{ inputs.profiles }}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            RESOLUTION="48"
            PROFILES="L2"
          else
            RESOLUTION="64"
            PROFILES="L2 L4 L8 L10"
          fi

          echo \
            "resolution=${RESOLUTION}" \
            >> "${GITHUB_OUTPUT}"

          echo \
            "profiles=${PROFILES}" \
            >> "${GITHUB_OUTPUT}"

          echo "Resolution: ${RESOLUTION}"
          echo "Profiles: ${PROFILES}"

      # -----------------------------------------------------
      # Generate scans
      # -----------------------------------------------------

      - name: Generate native scans
        shell: bash
        run: |
          set -euo pipefail

          read -ra PROFILE_ARGS \
            <<< "${{ steps.config.outputs.profiles }}"

          "${BLENDER_ROOT}/blender" \
            --background \
            --factory-startup \
            --python scripts/generate_all_native.py \
            -- \
            --examples example \
            --example mascotte/test1 \
            --start-sheet sheet1.png \
            --profiles "${PROFILE_ARGS[@]}" \
            --resolution "${{ steps.config.outputs.resolution }}" \
            --thread-count 0 \
            --skip-blend

      # -----------------------------------------------------
      # Render turntables
      # -----------------------------------------------------

      - name: Render previews
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            visual-preview

          for LEVEL in ${{ steps.config.outputs.profiles }}; do

            GLB="$(
              find \
                example/mascotte/test1/generated/sheet1/scans/"${LEVEL}" \
                -type f \
                -name "*.glb" \
                | head -n 1
            )"

            if [[ -z "${GLB}" ]]; then
              echo \
                "No GLB found for ${LEVEL}"

              exit 1
            fi

            OUTPUT_DIR="visual-preview/${LEVEL}"

            mkdir -p \
              "${OUTPUT_DIR}"

            "${BLENDER_ROOT}/blender" \
              --background \
              --factory-startup \
              --python scripts/render_turntable.py \
              -- \
              --input "${GLB}" \
              --output "${OUTPUT_DIR}" \
              --frames 36 \
              --size 512
          done

      # -----------------------------------------------------
      # Build GIF / MP4 / contact sheet
      # -----------------------------------------------------

      - name: Encode previews
        shell: bash
        run: |
          set -euo pipefail

          for LEVEL in ${{ steps.config.outputs.profiles }}; do

            DIR="visual-preview/${LEVEL}"

            ffmpeg \
              -y \
              -framerate 18 \
              -i "${DIR}/frames/%03d.png" \
              -vf \
              "fps=18,scale=512:-1:flags=lanczos,split[s0][s1];[s0]palettegen[p];[s1][p]paletteuse" \
              "${DIR}/turntable.gif"

            ffmpeg \
              -y \
              -framerate 30 \
              -i "${DIR}/frames/%03d.png" \
              -c:v libx264 \
              -preset medium \
              -crf 20 \
              -pix_fmt yuv420p \
              "${DIR}/turntable.mp4"

            ffmpeg \
              -y \
              -i "${DIR}/frames/%03d.png" \
              -vf \
              "select='not(mod(n,4))',scale=256:256,tile=3x3" \
              -frames:v 1 \
              "${DIR}/contact_sheet.png"

          done

      # -----------------------------------------------------
      # Generate summary
      # -----------------------------------------------------

      - name: Generate preview summary
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "# Native visual preview"
            echo
            echo "Resolution: **${{ steps.config.outputs.resolution }}**"
            echo
            echo "Profiles: **${{ steps.config.outputs.profiles }}**"
            echo
            echo "Generated files:"
            echo

            find \
              visual-preview \
              -maxdepth 2 \
              -type f \
              \( \
                -name "turntable.gif" \
                -o \
                -name "turntable.mp4" \
                -o \
                -name "contact_sheet.png" \
              \) \
              -print \
              | sort \
              | sed 's/^/- `/' \
              | sed 's/$/`/'

          } >> "${GITHUB_STEP_SUMMARY}"

      # -----------------------------------------------------
      # Verify
      # -----------------------------------------------------

      - name: Verify previews
        shell: bash
        run: |
          set -euo pipefail

          for LEVEL in ${{ steps.config.outputs.profiles }}; do

            DIR="visual-preview/${LEVEL}"

            test \
              -s "${DIR}/turntable.gif"

            test \
              -s "${DIR}/turntable.mp4"

            test \
              -s "${DIR}/contact_sheet.png"

          done

      - name: Show preview files
        if: always()
        shell: bash
        run: |
          find visual-preview \
            -type f \
            -print \
            | sort \
            || true

      # -----------------------------------------------------
      # Artifact
      # -----------------------------------------------------

      - name: Upload visual previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-visual-preview-${{ github.run_number }}
          path: |
            visual-preview/**
            example/mascotte/test1/generated/sheet1/manifest.json
          if-no-files-found: warn
          retention-days: 14
