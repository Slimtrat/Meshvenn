name: Visual Preview

on:
  pull_request:
    paths:
      - "native/**"
      - "core/**"
      - "scripts/render_turntable.py"
      - "scripts/generate_*native.py"
      - "example/**"
      - ".github/workflows/visual_preview.yml"

  push:
    branches:
      - main
    paths:
      - "native/**"
      - "core/**"
      - "scripts/render_turntable.py"
      - "scripts/generate_*native.py"
      - "example/**"
      - ".github/workflows/visual_preview.yml"

  workflow_dispatch:
    inputs:
      resolution:
        description: "Visual hull resolution"
        required: false
        default: "64"

      profiles:
        description: "Profiles, space separated"
        required: false
        default: "L2 L4 L8 L10"

      views:
        description: "Views per contact sheet"
        required: false
        default: "8"

      size:
        description: "Preview size"
        required: false
        default: "384"

      samples:
        description: "Cycles samples"
        required: false
        default: "1"


permissions:
  contents: read


concurrency:
  group: visual-preview-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true


env:
  BLENDER_VERSION: "5.2.1"

  BLENDER_ARCHIVE: "blender-5.2.1-linux-x64.tar.xz"

  BLENDER_BASE_URL: "https://download.blender.org/release/Blender5.2"

  BLENDER_ROOT: "${{ github.workspace }}/.blender"


jobs:

  # ---------------------------------------------------------
  # Native
  # ---------------------------------------------------------

  native:
    name: Build native core

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify build tools
        shell: bash
        run: |
          set -euo pipefail

          cmake --version
          ninja --version
          g++ --version

      - name: Configure native core
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            -S native \
            -B build/native \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBPT_BUILD_TESTS=ON

      - name: Build native core
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build build/native \
            --parallel

      - name: Run native tests
        shell: bash
        run: |
          set -euo pipefail

          ctest \
            --test-dir build/native \
            --output-on-failure

      - name: Stage native library
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            native/bin

          LIB_PATH="$(
            find build/native \
              -type f \
              -name "libbpt_core.so" \
              | head -n 1
          )"

          if [[ -z "${LIB_PATH}" ]]; then
            echo "libbpt_core.so not found"
            exit 1
          fi

          cp \
            "${LIB_PATH}" \
            native/bin/libbpt_core.so

          ls -lh \
            native/bin/libbpt_core.so

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: visual-preview-native-linux
          path: native/bin/libbpt_core.so
          if-no-files-found: error
          retention-days: 2


  # ---------------------------------------------------------
  # Preview
  # ---------------------------------------------------------

  preview:
    name: Generate visual previews

    needs:
      - native

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download native library
        uses: actions/download-artifact@v4
        with:
          name: visual-preview-native-linux
          path: native/bin

      - name: Verify native library
        shell: bash
        run: |
          set -euo pipefail

          test \
            -f native/bin/libbpt_core.so

          ls -lh \
            native/bin/libbpt_core.so


      # -----------------------------------------------------
      # Blender
      # -----------------------------------------------------

      - name: Cache Blender
        id: blender-cache

        uses: actions/cache@v4

        with:
          path: .blender
          key: blender-linux-x64-${{ env.BLENDER_VERSION }}

      - name: Download Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'

        shell: bash

        run: |
          set -euo pipefail

          mkdir -p \
            "${BLENDER_ROOT}"

          URL="${BLENDER_BASE_URL}/${BLENDER_ARCHIVE}"

          ARCHIVE="/tmp/${BLENDER_ARCHIVE}"

          curl \
            --fail \
            --show-error \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 900 \
            --output "${ARCHIVE}" \
            "${URL}"

          xz \
            --test \
            "${ARCHIVE}"

          tar \
            -xJf "${ARCHIVE}" \
            -C "${BLENDER_ROOT}" \
            --strip-components=1

          rm \
            "${ARCHIVE}"

      - name: Verify Blender
        shell: bash
        run: |
          set -euo pipefail

          "${BLENDER_ROOT}/blender" \
            --version


      # -----------------------------------------------------
      # Configuration
      # -----------------------------------------------------

      - name: Resolve configuration
        id: config

        shell: bash

        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then

            RESOLUTION="${{ inputs.resolution }}"
            PROFILES="${{ inputs.profiles }}"
            VIEWS="${{ inputs.views }}"
            SIZE="${{ inputs.size }}"
            SAMPLES="${{ inputs.samples }}"

          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then

            RESOLUTION="48"
            PROFILES="L2"
            VIEWS="4"
            SIZE="256"
            SAMPLES="1"

          else

            RESOLUTION="64"
            PROFILES="L2 L4 L8 L10"
            VIEWS="8"
            SIZE="384"
            SAMPLES="1"

          fi

          for VALUE in \
            "${RESOLUTION}" \
            "${VIEWS}" \
            "${SIZE}" \
            "${SAMPLES}"
          do
            if ! [[ "${VALUE}" =~ ^[0-9]+$ ]]; then
              echo "Invalid numeric value: ${VALUE}"
              exit 1
            fi
          done

          echo \
            "resolution=${RESOLUTION}" \
            >> "${GITHUB_OUTPUT}"

          echo \
            "profiles=${PROFILES}" \
            >> "${GITHUB_OUTPUT}"

          echo \
            "views=${VIEWS}" \
            >> "${GITHUB_OUTPUT}"

          echo \
            "size=${SIZE}" \
            >> "${GITHUB_OUTPUT}"

          echo \
            "samples=${SAMPLES}" \
            >> "${GITHUB_OUTPUT}"

          echo "Resolution: ${RESOLUTION}"
          echo "Profiles: ${PROFILES}"
          echo "Views: ${VIEWS}"
          echo "Size: ${SIZE}"
          echo "Samples: ${SAMPLES}"


      # -----------------------------------------------------
      # Generate both sheets
      # -----------------------------------------------------

      - name: Generate native scans
        shell: bash

        run: |
          set -euo pipefail

          read -ra PROFILE_ARGS \
            <<< "${{ steps.config.outputs.profiles }}"

          "${BLENDER_ROOT}/blender" \
            --background \
            --factory-startup \
            --python scripts/generate_all_native.py \
            -- \
            --examples example \
            --example mascotte/test1 \
            --profiles "${PROFILE_ARGS[@]}" \
            --resolution "${{ steps.config.outputs.resolution }}" \
            --thread-count 0 \
            --skip-blend


      # -----------------------------------------------------
      # Render both sheets
      # -----------------------------------------------------

      - name: Render previews
        shell: bash

        run: |
          set -euo pipefail

          mkdir -p \
            visual-preview

          for SHEET in sheet1 sheet2; do

            for LEVEL in ${{ steps.config.outputs.profiles }}; do

              SCAN_DIR="example/mascotte/test1/generated/${SHEET}/scans/${LEVEL}"

              if [[ ! -d "${SCAN_DIR}" ]]; then
                echo "Missing scan directory: ${SCAN_DIR}"
                exit 1
              fi

              GLB="$(
                find "${SCAN_DIR}" \
                  -type f \
                  -name "*.glb" \
                  | head -n 1
              )"

              if [[ -z "${GLB}" ]]; then
                echo "No GLB found for ${SHEET}/${LEVEL}"
                exit 1
              fi

              OUTPUT_DIR="visual-preview/${SHEET}/${LEVEL}"

              mkdir -p \
                "${OUTPUT_DIR}"

              echo
              echo "Rendering ${SHEET} ${LEVEL}"
              echo "GLB: ${GLB}"
              echo

              "${BLENDER_ROOT}/blender" \
                --background \
                --factory-startup \
                --python scripts/render_turntable.py \
                -- \
                --input "${GLB}" \
                --output "${OUTPUT_DIR}" \
                --views "${{ steps.config.outputs.views }}" \
                --size "${{ steps.config.outputs.size }}" \
                --samples "${{ steps.config.outputs.samples }}"

            done

          done


      # -----------------------------------------------------
      # Verify
      # -----------------------------------------------------

      - name: Verify previews
        shell: bash

        run: |
          set -euo pipefail

          for SHEET in sheet1 sheet2; do

            for LEVEL in ${{ steps.config.outputs.profiles }}; do

              CONTACT="visual-preview/${SHEET}/${LEVEL}/contact_sheet.png"

              if [[ ! -s "${CONTACT}" ]]; then
                echo "Missing contact sheet: ${CONTACT}"
                exit 1
              fi

              echo
              echo "${SHEET}/${LEVEL}"

              ls -lh \
                "${CONTACT}"

            done

          done


      # -----------------------------------------------------
      # Summary
      # -----------------------------------------------------

      - name: Generate preview summary
        if: always()

        shell: bash

        run: |
          {
            echo "# Native visual preview"
            echo

            echo \
              "Resolution: **${{ steps.config.outputs.resolution }}**"

            echo

            echo \
              "Profiles: **${{ steps.config.outputs.profiles }}**"

            echo

            echo \
              "Views: **${{ steps.config.outputs.views }}**"

            echo

            echo \
              "Render: **${{ steps.config.outputs.size }} × ${{ steps.config.outputs.size }}**"

            echo

            echo \
              "Cycles samples: **${{ steps.config.outputs.samples }}**"

            echo
            echo "Contact sheets:"
            echo

            find visual-preview \
              -type f \
              -name "contact_sheet.png" \
              -print \
              | sort \
              | sed 's/^/- `/' \
              | sed 's/$/`/' \
              || true

          } >> "${GITHUB_STEP_SUMMARY}"


      # -----------------------------------------------------
      # Diagnostics
      # -----------------------------------------------------

      - name: Show generated files
        if: always()

        shell: bash

        run: |
          echo "Visual previews:"
          echo

          find visual-preview \
            -type f \
            -print \
            | sort \
            || true

          echo
          echo "Generated scans:"
          echo

          find example/mascotte/test1/generated \
            -type f \
            -print \
            | sort \
            || true


      # -----------------------------------------------------
      # Artifact
      # -----------------------------------------------------

      - name: Upload visual previews
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: native-visual-preview-${{ github.run_number }}

          path: |
            visual-preview/**
            example/mascotte/test1/generated/sheet1/manifest.json
            example/mascotte/test1/generated/sheet2/manifest.json

          if-no-files-found: warn

          retention-days: 14