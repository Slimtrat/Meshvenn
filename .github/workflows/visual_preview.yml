name: Visual Preview


on:
  pull_request:
    paths:
      - "native/**"
      - "core/**"
      - "scripts/render_turntable.py"
      - "scripts/render_projection_sheet.py"
      - "scripts/generate_*native.py"
      - "example/**"
      - ".github/workflows/visual_preview.yml"

  push:
    branches:
      - main
    paths:
      - "native/**"
      - "core/**"
      - "scripts/render_turntable.py"
      - "scripts/render_projection_sheet.py"
      - "scripts/generate_*native.py"
      - "example/**"
      - ".github/workflows/visual_preview.yml"

  workflow_dispatch:
    inputs:
      resolution:
        description: "Visual hull resolution"
        required: false
        default: "64"

      profiles:
        description: "Profiles, space separated"
        required: false
        default: "L2 L4 L8 L10"

      views:
        description: "Views per turntable contact sheet"
        required: false
        default: "8"

      size:
        description: "Turntable preview size"
        required: false
        default: "384"

      samples:
        description: "Cycles samples"
        required: false
        default: "1"

      mesh_mode:
        description: "Mesh extraction algorithm"
        required: false
        default: "surface_nets"
        type: choice
        options:
          - surface_nets
          - blocks


permissions:
  contents: write
  pull-requests: write


concurrency:
  group: visual-preview-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true


env:
  BLENDER_VERSION: "5.2.1"
  BLENDER_ARCHIVE: "blender-5.2.1-linux-x64.tar.xz"
  BLENDER_BASE_URL: "https://download.blender.org/release/Blender5.2"
  BLENDER_ROOT: "${{ github.workspace }}/.blender"

  EXAMPLE_ROOT: "example"
  EXAMPLE_NAME: "mascotte/test1"
  SHEETS_DIR: "example/mascotte/test1/sheets"
  GENERATED_DIR: "example/mascotte/test1/generated"


jobs:

  # =========================================================
  # Build current branch native core
  # =========================================================

  native:
    name: Build native core
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: >-
            ${{
              github.event_name == 'pull_request'
              && github.event.pull_request.head.sha
              || github.sha
            }}

      - name: Verify build tools
        shell: bash
        run: |
          set -euo pipefail

          cmake --version
          ninja --version
          g++ --version

      - name: Configure native core
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            -S native \
            -B build/native \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBPT_BUILD_TESTS=ON

      - name: Build native core
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build build/native \
            --parallel

      - name: Run native tests
        shell: bash
        run: |
          set -euo pipefail

          ctest \
            --test-dir build/native \
            --output-on-failure

      - name: Stage native library
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p native/bin

          LIB_PATH="$(
            find build/native \
              -type f \
              -name "libbpt_core.so" \
              | head -n 1
          )"

          if [[ -z "${LIB_PATH}" ]]; then
            echo "libbpt_core.so not found"
            exit 1
          fi

          cp \
            "${LIB_PATH}" \
            native/bin/libbpt_core.so

          ls -lh native/bin/libbpt_core.so

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: visual-preview-native-linux
          path: native/bin/libbpt_core.so
          if-no-files-found: error
          retention-days: 2


  # =========================================================
  # Generate current branch previews
  # =========================================================

  preview:
    name: Generate visual previews

    needs:
      - native

    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # -----------------------------------------------------
      # Checkout
      # -----------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: >-
            ${{
              github.event_name == 'pull_request'
              && github.event.pull_request.head.sha
              || github.sha
            }}
          fetch-depth: 0

      - name: Download native library
        uses: actions/download-artifact@v4
        with:
          name: visual-preview-native-linux
          path: native/bin

      - name: Verify native library
        shell: bash
        run: |
          set -euo pipefail

          test -f native/bin/libbpt_core.so

          ls -lh \
            native/bin/libbpt_core.so


      # -----------------------------------------------------
      # Blender
      # -----------------------------------------------------

      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: .blender
          key: blender-linux-x64-${{ env.BLENDER_VERSION }}

      - name: Download Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            "${BLENDER_ROOT}"

          URL="${BLENDER_BASE_URL}/${BLENDER_ARCHIVE}"
          ARCHIVE="/tmp/${BLENDER_ARCHIVE}"

          curl \
            --fail \
            --show-error \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 900 \
            --output "${ARCHIVE}" \
            "${URL}"

          xz \
            --test \
            "${ARCHIVE}"

          tar \
            -xJf "${ARCHIVE}" \
            -C "${BLENDER_ROOT}" \
            --strip-components=1

          rm \
            "${ARCHIVE}"

      - name: Verify Blender
        shell: bash
        run: |
          set -euo pipefail

          "${BLENDER_ROOT}/blender" \
            --version


      # -----------------------------------------------------
      # Configuration
      # -----------------------------------------------------

      - name: Resolve configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then

            RESOLUTION="${{ inputs.resolution }}"
            PROFILES="${{ inputs.profiles }}"
            VIEWS="${{ inputs.views }}"
            SIZE="${{ inputs.size }}"
            SAMPLES="${{ inputs.samples }}"
            MESH_MODE="${{ inputs.mesh_mode }}"

          else

            # PR and main intentionally use the same
            # visual configuration so they can be
            # compared directly.
            RESOLUTION="64"
            PROFILES="L2 L4 L8 L10"
            VIEWS="8"
            SIZE="384"
            SAMPLES="1"

            # Current engine candidate.
            #
            # Once this PR is merged, main will generate
            # and persist Surface Nets previews, making
            # them the natural baseline for future PRs.
            MESH_MODE="surface_nets"

          fi

          for VALUE in \
            "${RESOLUTION}" \
            "${VIEWS}" \
            "${SIZE}" \
            "${SAMPLES}"
          do
            if ! [[ "${VALUE}" =~ ^[0-9]+$ ]]; then
              echo "Invalid numeric value: ${VALUE}"
              exit 1
            fi
          done

          case "${MESH_MODE}" in
            blocks|surface_nets)
              ;;
            *)
              echo "Invalid mesh mode: ${MESH_MODE}"
              exit 1
              ;;
          esac

          {
            echo "resolution=${RESOLUTION}"
            echo "profiles=${PROFILES}"
            echo "views=${VIEWS}"
            echo "size=${SIZE}"
            echo "samples=${SAMPLES}"
            echo "mesh_mode=${MESH_MODE}"
          } >> "${GITHUB_OUTPUT}"

          echo "Resolution: ${RESOLUTION}"
          echo "Profiles: ${PROFILES}"
          echo "Views: ${VIEWS}"
          echo "Size: ${SIZE}"
          echo "Samples: ${SAMPLES}"
          echo "Mesh mode: ${MESH_MODE}"


      # -----------------------------------------------------
      # Sheets
      # -----------------------------------------------------

      - name: Discover sheets
        id: sheets
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d "${SHEETS_DIR}" ]]; then
            echo "Missing sheets directory: ${SHEETS_DIR}"
            exit 1
          fi

          mapfile -t SHEET_PATHS < <(
            find "${SHEETS_DIR}" \
              -maxdepth 1 \
              -type f \
              -name "sheet*.png" \
              | sort
          )

          if [[ "${#SHEET_PATHS[@]}" -eq 0 ]]; then
            echo "No sheet*.png found in ${SHEETS_DIR}"
            exit 1
          fi

          SHEET_NAMES=()

          for SHEET_PATH in "${SHEET_PATHS[@]}"; do
            SHEET_NAME="$(
              basename \
                "${SHEET_PATH}" \
                .png
            )"

            SHEET_NAMES+=(
              "${SHEET_NAME}"
            )
          done

          {
            echo "count=${#SHEET_NAMES[@]}"
            echo "sheet_names=${SHEET_NAMES[*]}"

            echo "sheet_paths<<EOF"
            printf '%s\n' "${SHEET_PATHS[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

          echo \
            "Discovered ${#SHEET_NAMES[@]} sheet(s): ${SHEET_NAMES[*]}"


      # -----------------------------------------------------
      # Current branch reconstruction
      # -----------------------------------------------------

      - name: Generate native scans
        shell: bash
        run: |
          set -euo pipefail

          read -ra PROFILE_ARGS \
            <<< "${{ steps.config.outputs.profiles }}"

          "${BLENDER_ROOT}/blender" \
            --background \
            --factory-startup \
            --python scripts/generate_all_native.py \
            -- \
            --examples "${EXAMPLE_ROOT}" \
            --example "${EXAMPLE_NAME}" \
            --profiles "${PROFILE_ARGS[@]}" \
            --resolution "${{ steps.config.outputs.resolution }}" \
            --mesh-mode "${{ steps.config.outputs.mesh_mode }}" \
            --thread-count 0 \
            --skip-blend


      # -----------------------------------------------------
      # Current branch rendering
      # -----------------------------------------------------

      - name: Render previews
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            visual-preview

          read -ra SHEETS \
            <<< "${{ steps.sheets.outputs.sheet_names }}"

          read -ra PROFILES \
            <<< "${{ steps.config.outputs.profiles }}"

          for SHEET in "${SHEETS[@]}"; do

            TEMPLATE="${SHEETS_DIR}/${SHEET}.png"

            if [[ ! -s "${TEMPLATE}" ]]; then
              echo "Missing source sheet: ${TEMPLATE}"
              exit 1
            fi

            for LEVEL in "${PROFILES[@]}"; do

              SCAN_DIR="${GENERATED_DIR}/${SHEET}/scans/${LEVEL}"

              if [[ ! -d "${SCAN_DIR}" ]]; then
                echo "Missing scan directory: ${SCAN_DIR}"
                exit 1
              fi

              GLB="$(
                find "${SCAN_DIR}" \
                  -type f \
                  -name "*.glb" \
                  | head -n 1
              )"

              if [[ -z "${GLB}" ]]; then
                echo "No GLB found for ${SHEET}/${LEVEL}"
                exit 1
              fi

              OUTPUT_DIR="visual-preview/${SHEET}/${LEVEL}"

              mkdir -p \
                "${OUTPUT_DIR}"

              echo
              echo "Rendering ${SHEET} ${LEVEL}"
              echo "GLB: ${GLB}"
              echo

              # ---------------------------------------------
              # Existing free turntable preview
              # ---------------------------------------------

              "${BLENDER_ROOT}/blender" \
                --background \
                --factory-startup \
                --python scripts/render_turntable.py \
                -- \
                --input "${GLB}" \
                --output "${OUTPUT_DIR}" \
                --views "${{ steps.config.outputs.views }}" \
                --size "${{ steps.config.outputs.size }}" \
                --samples "${{ steps.config.outputs.samples }}"

              # ---------------------------------------------
              # Projection Tool reconstruction
              # ---------------------------------------------

              "${BLENDER_ROOT}/blender" \
                --background \
                --factory-startup \
                --python scripts/render_projection_sheet.py \
                -- \
                --input "${GLB}" \
                --template "${TEMPLATE}" \
                --output "${OUTPUT_DIR}/projection_sheet.png" \
                --samples "${{ steps.config.outputs.samples }}" \
                --material-mode neutral

            done
          done


      # -----------------------------------------------------
      # Verify current branch
      # -----------------------------------------------------

      - name: Verify previews
        shell: bash
        run: |
          set -euo pipefail

          read -ra SHEETS \
            <<< "${{ steps.sheets.outputs.sheet_names }}"

          read -ra PROFILES \
            <<< "${{ steps.config.outputs.profiles }}"

          for SHEET in "${SHEETS[@]}"; do
            for LEVEL in "${PROFILES[@]}"; do

              CONTACT="visual-preview/${SHEET}/${LEVEL}/contact_sheet.png"
              PROJECTION="visual-preview/${SHEET}/${LEVEL}/projection_sheet.png"

              if [[ ! -s "${CONTACT}" ]]; then
                echo "Missing contact sheet: ${CONTACT}"
                exit 1
              fi

              if [[ ! -s "${PROJECTION}" ]]; then
                echo "Missing projection sheet: ${PROJECTION}"
                exit 1
              fi

              echo
              echo "${SHEET}/${LEVEL}"

              ls -lh \
                "${CONTACT}" \
                "${PROJECTION}"

            done
          done


      # =====================================================
      # MAIN DOCUMENTATION
      # =====================================================

      # -----------------------------------------------------
      # Persistent preview files
      # -----------------------------------------------------

      - name: Prepare documentation previews
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          read -ra SHEETS \
            <<< "${{ steps.sheets.outputs.sheet_names }}"

          read -ra PROFILES \
            <<< "${{ steps.config.outputs.profiles }}"

          rm -rf \
            docs/previews

          mkdir -p \
            docs/previews

          for SHEET in "${SHEETS[@]}"; do

            SHEET_DOCS="docs/previews/${SHEET}"

            mkdir -p \
              "${SHEET_DOCS}"

            cp \
              "${SHEETS_DIR}/${SHEET}.png" \
              "${SHEET_DOCS}/original.png"

            for LEVEL in "${PROFILES[@]}"; do

              LEVEL_DOCS="${SHEET_DOCS}/${LEVEL}"

              mkdir -p \
                "${LEVEL_DOCS}"

              CONTACT_SOURCE="visual-preview/${SHEET}/${LEVEL}/contact_sheet.png"
              PROJECTION_SOURCE="visual-preview/${SHEET}/${LEVEL}/projection_sheet.png"

              cp \
                "${CONTACT_SOURCE}" \
                "${LEVEL_DOCS}/turntable.png"

              cp \
                "${PROJECTION_SOURCE}" \
                "${LEVEL_DOCS}/projection.png"

            done
          done

          find docs/previews \
            -type f \
            -print \
            | sort


      # -----------------------------------------------------
      # Persistent Markdown
      # -----------------------------------------------------

      - name: Generate visual preview Markdown
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          read -ra SHEETS \
            <<< "${{ steps.sheets.outputs.sheet_names }}"

          read -ra PROFILES \
            <<< "${{ steps.config.outputs.profiles }}"

          mkdir -p \
            docs

          format_sheet_title() {
            local name="$1"

            if [[ "${name}" =~ ^sheet([0-9]+)$ ]]; then
              echo "Sheet ${BASH_REMATCH[1]}"
            else
              echo "${name}"
            fi
          }

          describe_level() {
            local level="$1"

            case "${level}" in
              L2)
                echo "000° + 090°"
                ;;
              L4)
                echo "000° + 090° + 180° + 270°"
                ;;
              L6)
                echo "000° + 045° + 090° + 180° + 270° + 315°"
                ;;
              L8)
                echo "8 horizontal views"
                ;;
              L10)
                echo "L8 + TOP + BOT"
                ;;
              *)
                echo "Custom profile"
                ;;
            esac
          }

          {
            echo "# Visual Reconstruction Preview"
            echo
            echo "Automatically generated from the Projection Tool reference sheets."
            echo
            echo "Each reconstruction is rendered back into the exact same Projection Tool layout, allowing direct visual comparison with the source."
            echo

            echo "## Example"
            echo
            echo "- Root: \`${EXAMPLE_ROOT}/${EXAMPLE_NAME}\`"
            echo "- Sheets directory: \`${SHEETS_DIR}\`"
            echo "- Discovered sheets: **${#SHEETS[@]}**"
            echo "- Mesh mode: **${{ steps.config.outputs.mesh_mode }}**"
            echo

            echo "## Scan levels"
            echo

            for LEVEL in "${PROFILES[@]}"; do
              echo "- **${LEVEL}** — $(describe_level "${LEVEL}")"
            done

            echo

            for SHEET in "${SHEETS[@]}"; do

              SHEET_TITLE="$(
                format_sheet_title \
                  "${SHEET}"
              )"

              echo "---"
              echo
              echo "## ${SHEET_TITLE}"
              echo

              for LEVEL in "${PROFILES[@]}"; do

                echo "### ${LEVEL}"
                echo
                echo "| Original | Reconstruction ${LEVEL} |"
                echo "| :---: | :---: |"
                echo "| ![${SHEET_TITLE} original](previews/${SHEET}/original.png) | ![${SHEET_TITLE} ${LEVEL}](previews/${SHEET}/${LEVEL}/projection.png) |"
                echo
                echo "<details>"
                echo "<summary>Turntable ${LEVEL}</summary>"
                echo
                echo "![${SHEET_TITLE} ${LEVEL} turntable](previews/${SHEET}/${LEVEL}/turntable.png)"
                echo
                echo "</details>"
                echo

              done
            done

            echo "---"
            echo
            echo "## Generation"
            echo
            echo "Generated by GitHub Actions using:"
            echo
            echo "- the native C++ visual hull engine;"
            echo "- mesh extraction: \`${{ steps.config.outputs.mesh_mode }}\`;"
            echo "- Blender headless;"
            echo "- Cycles CPU;"
            echo "- the Projection Tool sheets in \`${SHEETS_DIR}/\`."
            echo
            echo "The committed images represent the latest successful preview generated from \`main\`."

          } > docs/visual-preview.md


      # =====================================================
      # PR COMPARISON
      # =====================================================

      # -----------------------------------------------------
      # Resolve current base branch
      # -----------------------------------------------------

      - name: Resolve PR base
        if: github.event_name == 'pull_request'
        id: base
        shell: bash
        run: |
          set -euo pipefail

          BASE_REF="${{ github.event.pull_request.base.ref }}"

          git fetch \
            origin \
            "${BASE_REF}:refs/remotes/origin/${BASE_REF}"

          BASE_SHA="$(
            git rev-parse \
              "refs/remotes/origin/${BASE_REF}"
          )"

          BASE_SHORT="$(
            git rev-parse \
              --short=8 \
              "${BASE_SHA}"
          )"

          # --------------------------------------------------
          # Resolve the mesh mode used by the base workflow.
          #
          # Before this Surface Nets PR:
          #   main has no explicit mesh mode => blocks.
          #
          # After this PR is merged:
          #   main explicitly assigns surface_nets.
          #
          # This keeps cache-miss regeneration correct both
          # during this transition and for following PRs.
          # --------------------------------------------------

          BASE_MESH_MODE="blocks"

          BASE_WORKFLOW="$(
            git show \
              "${BASE_SHA}:.github/workflows/visual_preview.yml" \
              2>/dev/null \
              || true
          )"

          if printf '%s\n' "${BASE_WORKFLOW}" \
            | grep -q 'MESH_MODE="surface_nets"'
          then
            BASE_MESH_MODE="surface_nets"
          fi

          {
            echo "ref=${BASE_REF}"
            echo "sha=${BASE_SHA}"
            echo "short_sha=${BASE_SHORT}"
            echo "mesh_mode=${BASE_MESH_MODE}"
          } >> "${GITHUB_OUTPUT}"

          echo "Base ref: ${BASE_REF}"
          echo "Base SHA: ${BASE_SHA}"
          echo "Base mesh mode: ${BASE_MESH_MODE}"


      # -----------------------------------------------------
      # Original + PR + cached main
      # -----------------------------------------------------

      - name: Prepare PR visual comparison
        if: github.event_name == 'pull_request'
        id: main-baseline
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA="${{ steps.base.outputs.sha }}"

          rm -rf \
            visual-compare

          mkdir -p \
            visual-compare/original \
            visual-compare/main \
            visual-compare/pr \
            visual-compare/status

          MISSING_FILE="${RUNNER_TEMP}/bpt-missing-main.tsv"

          : > "${MISSING_FILE}"

          read -ra SHEETS \
            <<< "${{ steps.sheets.outputs.sheet_names }}"

          read -ra PROFILES \
            <<< "${{ steps.config.outputs.profiles }}"

          for SHEET in "${SHEETS[@]}"; do

            SOURCE_SHEET="${SHEETS_DIR}/${SHEET}.png"

            cp \
              "${SOURCE_SHEET}" \
              "visual-compare/original/${SHEET}.png"

            mkdir -p \
              "visual-compare/main/${SHEET}" \
              "visual-compare/pr/${SHEET}" \
              "visual-compare/status/${SHEET}"

            # ------------------------------------------------
            # Has the source sheet changed compared with main?
            # ------------------------------------------------

            SOURCE_CHANGED="false"

            if ! git cat-file \
              -e \
              "${BASE_SHA}:${SOURCE_SHEET}" \
              2>/dev/null
            then
              SOURCE_CHANGED="true"
            elif ! git diff \
              --quiet \
              "${BASE_SHA}" \
              HEAD \
              -- \
              "${SOURCE_SHEET}"
            then
              SOURCE_CHANGED="true"
            fi

            for LEVEL in "${PROFILES[@]}"; do

              # PR result always comes from the current run.

              cp \
                "visual-preview/${SHEET}/${LEVEL}/projection_sheet.png" \
                "visual-compare/pr/${SHEET}/${LEVEL}.png"

              MAIN_DOC_PATH="docs/previews/${SHEET}/${LEVEL}/projection.png"

              MAIN_OUTPUT="visual-compare/main/${SHEET}/${LEVEL}.png"

              STATUS_FILE="visual-compare/status/${SHEET}/${LEVEL}.txt"

              # ------------------------------------------------
              # Cache hit:
              #
              # - source sheet unchanged
              # - preview already committed on main
              #
              # => do NOT rebuild main.
              # ------------------------------------------------

              if \
                [[ "${SOURCE_CHANGED}" == "false" ]] \
                && git cat-file \
                  -e \
                  "${BASE_SHA}:${MAIN_DOC_PATH}" \
                  2>/dev/null
              then

                echo \
                  "Reusing main preview: ${SHEET}/${LEVEL}"

                git show \
                  "${BASE_SHA}:${MAIN_DOC_PATH}" \
                  > "${MAIN_OUTPUT}"

                echo \
                  "reused" \
                  > "${STATUS_FILE}"

                continue

              fi

              # ------------------------------------------------
              # Cache miss
              # ------------------------------------------------

              printf '%s\t%s\n' \
                "${SHEET}" \
                "${LEVEL}" \
                >> "${MISSING_FILE}"

              if [[ "${SOURCE_CHANGED}" == "true" ]]; then

                echo \
                  "generated-input-changed" \
                  > "${STATUS_FILE}"

                echo \
                  "Main baseline required for ${SHEET}/${LEVEL}: source sheet differs from main"

              else

                echo \
                  "generated-preview-missing" \
                  > "${STATUS_FILE}"

                echo \
                  "Main baseline required for ${SHEET}/${LEVEL}: committed preview missing"

              fi

            done
          done

          MISSING_COUNT="$(
            wc -l \
              < "${MISSING_FILE}" \
              | tr -d ' '
          )"

          {
            echo "missing_count=${MISSING_COUNT}"
            echo "missing_file=${MISSING_FILE}"
          } >> "${GITHUB_OUTPUT}"

          echo
          echo "Missing main previews: ${MISSING_COUNT}"

          if [[ "${MISSING_COUNT}" -gt 0 ]]; then
            echo
            cat "${MISSING_FILE}"
          fi


      # -----------------------------------------------------
      # Rebuild main ONLY on cache miss
      # -----------------------------------------------------

      - name: Generate missing main baselines
        if: >-
          github.event_name == 'pull_request'
          && steps.main-baseline.outputs.missing_count != '0'
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA="${{ steps.base.outputs.sha }}"
          BASE_MESH_MODE="${{ steps.base.outputs.mesh_mode }}"

          MISSING_FILE="${{ steps.main-baseline.outputs.missing_file }}"

          MAIN_WORKTREE="${RUNNER_TEMP}/bpt-main"
          MAIN_BUILD="${RUNNER_TEMP}/bpt-main-build"
          MAIN_INPUT_ROOT="${RUNNER_TEMP}/bpt-main-input"
          MAIN_EXAMPLE="${MAIN_INPUT_ROOT}/${EXAMPLE_NAME}"

          rm -rf \
            "${MAIN_WORKTREE}" \
            "${MAIN_BUILD}" \
            "${MAIN_INPUT_ROOT}"

          # --------------------------------------------------
          # Checkout actual main/base code separately.
          # --------------------------------------------------

          git worktree add \
            --detach \
            "${MAIN_WORKTREE}" \
            "${BASE_SHA}"

          # --------------------------------------------------
          # Copy only the sheets that need a main baseline.
          #
          # Important:
          # the input comes from the PR so a new/modified
          # sheet is evaluated by both engines identically.
          # --------------------------------------------------

          mkdir -p \
            "${MAIN_EXAMPLE}/sheets"

          mapfile -t MISSING_SHEETS < <(
            cut \
              -f1 \
              "${MISSING_FILE}" \
              | sort \
              -u
          )

          for SHEET in "${MISSING_SHEETS[@]}"; do

            cp \
              "${SHEETS_DIR}/${SHEET}.png" \
              "${MAIN_EXAMPLE}/sheets/${SHEET}.png"

          done

          # --------------------------------------------------
          # Only request profiles that are actually missing.
          # Preserve configured scan-level order.
          # --------------------------------------------------

          read -ra ALL_PROFILES \
            <<< "${{ steps.config.outputs.profiles }}"

          MISSING_PROFILES=()

          for LEVEL in "${ALL_PROFILES[@]}"; do

            if awk \
              -F '\t' \
              -v level="${LEVEL}" \
              '$2 == level { found = 1 } END { exit !found }' \
              "${MISSING_FILE}"
            then
              MISSING_PROFILES+=(
                "${LEVEL}"
              )
            fi

          done

          echo
          echo "Missing sheets: ${MISSING_SHEETS[*]}"
          echo "Missing profiles: ${MISSING_PROFILES[*]}"
          echo "Base mesh mode: ${BASE_MESH_MODE}"
          echo

          # --------------------------------------------------
          # Build main native core.
          #
          # This entire block is skipped when every baseline
          # was already committed on main.
          # --------------------------------------------------

          cmake \
            -S "${MAIN_WORKTREE}/native" \
            -B "${MAIN_BUILD}" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBPT_BUILD_TESTS=OFF

          cmake \
            --build "${MAIN_BUILD}" \
            --parallel

          MAIN_LIB="$(
            find "${MAIN_BUILD}" \
              -type f \
              -name "libbpt_core.so" \
              | head -n 1
          )"

          if [[ -z "${MAIN_LIB}" ]]; then
            echo "Main libbpt_core.so not found"
            exit 1
          fi

          mkdir -p \
            "${MAIN_WORKTREE}/native/bin"

          cp \
            "${MAIN_LIB}" \
            "${MAIN_WORKTREE}/native/bin/libbpt_core.so"

          # --------------------------------------------------
          # Base mesh-mode compatibility.
          #
          # Old main does not know --mesh-mode.
          # New main does.
          #
          # Only pass the option when the checked-out base
          # implementation supports it.
          # --------------------------------------------------

          BASE_MESH_ARGS=()

          if grep \
            -q \
            -- '"--mesh-mode"' \
            "${MAIN_WORKTREE}/scripts/generate_example_native.py"
          then
            BASE_MESH_ARGS=(
              --mesh-mode
              "${BASE_MESH_MODE}"
            )
          fi

          # --------------------------------------------------
          # Generate missing baseline geometry using main code.
          # --------------------------------------------------

          "${BLENDER_ROOT}/blender" \
            --background \
            --factory-startup \
            --python "${MAIN_WORKTREE}/scripts/generate_example_native.py" \
            -- \
            "${MAIN_EXAMPLE}" \
            "${MAIN_EXAMPLE}" \
            --profiles "${MISSING_PROFILES[@]}" \
            --resolution "${{ steps.config.outputs.resolution }}" \
            "${BASE_MESH_ARGS[@]}" \
            --thread-count 0 \
            --skip-blend

          # --------------------------------------------------
          # Render only missing main comparisons.
          #
          # We deliberately use the PR projection renderer
          # here so the camera/layout renderer itself is
          # identical on both sides of the comparison.
          # --------------------------------------------------

          while IFS=$'\t' read -r SHEET LEVEL; do

            SCAN_DIR="${MAIN_EXAMPLE}/generated/${SHEET}/scans/${LEVEL}"

            GLB="$(
              find "${SCAN_DIR}" \
                -type f \
                -name "*.glb" \
                | head -n 1
            )"

            if [[ -z "${GLB}" ]]; then
              echo \
                "No main GLB found for ${SHEET}/${LEVEL}"

              exit 1
            fi

            MAIN_OUTPUT="visual-compare/main/${SHEET}/${LEVEL}.png"

            "${BLENDER_ROOT}/blender" \
              --background \
              --factory-startup \
              --python scripts/render_projection_sheet.py \
              -- \
              --input "${GLB}" \
              --template "${SHEETS_DIR}/${SHEET}.png" \
              --output "${MAIN_OUTPUT}" \
              --samples "${{ steps.config.outputs.samples }}" \
              --material-mode neutral

          done < "${MISSING_FILE}"

          git worktree remove \
            --force \
            "${MAIN_WORKTREE}"


      # -----------------------------------------------------
      # Verify Original / main / PR
      # -----------------------------------------------------

      - name: Verify PR comparison
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          read -ra SHEETS \
            <<< "${{ steps.sheets.outputs.sheet_names }}"

          read -ra PROFILES \
            <<< "${{ steps.config.outputs.profiles }}"

          for SHEET in "${SHEETS[@]}"; do

            ORIGINAL="visual-compare/original/${SHEET}.png"

            if [[ ! -s "${ORIGINAL}" ]]; then
              echo "Missing original: ${ORIGINAL}"
              exit 1
            fi

            for LEVEL in "${PROFILES[@]}"; do

              MAIN="visual-compare/main/${SHEET}/${LEVEL}.png"
              PR="visual-compare/pr/${SHEET}/${LEVEL}.png"
              STATUS="visual-compare/status/${SHEET}/${LEVEL}.txt"

              if [[ ! -s "${MAIN}" ]]; then
                echo "Missing main comparison: ${MAIN}"
                exit 1
              fi

              if [[ ! -s "${PR}" ]]; then
                echo "Missing PR comparison: ${PR}"
                exit 1
              fi

              if [[ ! -s "${STATUS}" ]]; then
                echo "Missing baseline status: ${STATUS}"
                exit 1
              fi

            done
          done


      # =====================================================
      # PR IMAGE HOSTING
      # =====================================================

      # GitHub Actions artifacts cannot be embedded directly
      # as images in a PR comment.
      #
      # Each PR therefore gets one disposable preview branch:
      #
      #   visual-preview-pr-3
      #
      # It is force-updated on every PR run, so no image
      # history accumulates inside that branch.

      - name: Publish PR preview images
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        id: assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          PR_NUMBER="${{ github.event.pull_request.number }}"

          ASSET_BRANCH="visual-preview-pr-${PR_NUMBER}"

          ASSET_ROOT="${RUNNER_TEMP}/bpt-preview-assets"

          rm -rf \
            "${ASSET_ROOT}"

          mkdir -p \
            "${ASSET_ROOT}"

          cp -R \
            visual-compare/original \
            "${ASSET_ROOT}/original"

          cp -R \
            visual-compare/main \
            "${ASSET_ROOT}/main"

          cp -R \
            visual-compare/pr \
            "${ASSET_ROOT}/pr"

          cd \
            "${ASSET_ROOT}"

          git init

          git checkout \
            -b "${ASSET_BRANCH}"

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            original \
            main \
            pr

          git commit \
            -m "preview: PR #${PR_NUMBER} visual comparison"

          git remote add \
            origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git push \
            --force \
            origin \
            "HEAD:refs/heads/${ASSET_BRANCH}"

          {
            echo "branch=${ASSET_BRANCH}"
            echo "raw_root=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${ASSET_BRANCH}"
          } >> "${GITHUB_OUTPUT}"


      # =====================================================
      # STICKY PR COMMENT
      # =====================================================

      - name: Build sticky PR comment
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail

          COMMENT_FILE="visual-compare/comment.md"

          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_SHA="${{ github.event.pull_request.head.sha }}"
          PR_SHORT="${PR_SHA:0:8}"

          BASE_REF="${{ steps.base.outputs.ref }}"
          BASE_SHORT="${{ steps.base.outputs.short_sha }}"
          BASE_MESH_MODE="${{ steps.base.outputs.mesh_mode }}"

          RAW_ROOT="${{ steps.assets.outputs.raw_root }}"

          MESH_MODE="${{ steps.config.outputs.mesh_mode }}"

          read -ra SHEETS \
            <<< "${{ steps.sheets.outputs.sheet_names }}"

          read -ra PROFILES \
            <<< "${{ steps.config.outputs.profiles }}"

          # --------------------------------------------------
          # Display order:
          #
          # L10 first, because it is the most complete result.
          # All lower levels follow and start collapsed.
          # --------------------------------------------------

          COMMENT_PROFILES=()

          for LEVEL in "${PROFILES[@]}"; do
            if [[ "${LEVEL}" == "L10" ]]; then
              COMMENT_PROFILES+=(
                "${LEVEL}"
              )
            fi
          done

          for LEVEL in "${PROFILES[@]}"; do
            if [[ "${LEVEL}" != "L10" ]]; then
              COMMENT_PROFILES+=(
                "${LEVEL}"
              )
            fi
          done

          REUSED=0
          GENERATED=0

          for SHEET in "${SHEETS[@]}"; do
            for LEVEL in "${PROFILES[@]}"; do

              STATUS="$(
                cat \
                  "visual-compare/status/${SHEET}/${LEVEL}.txt"
              )"

              if [[ "${STATUS}" == "reused" ]]; then
                REUSED=$((REUSED + 1))
              else
                GENERATED=$((GENERATED + 1))
              fi

            done
          done

          {
            echo "<!-- bpt-visual-preview -->"
            echo
            echo "## Projection Tool — Visual Comparison"
            echo
            echo "**Base:** \`${BASE_REF}@${BASE_SHORT}\` · **PR:** \`#${PR_NUMBER}@${PR_SHORT}\`"
            echo
            echo "**Mesh:** \`${BASE_REF}=${BASE_MESH_MODE}\` → \`PR=${MESH_MODE}\`"
            echo
            echo "**Sheets:** ${#SHEETS[@]} · **Profiles:** ${{ steps.config.outputs.profiles }}"
            echo
            echo "**main baselines:** ${REUSED} reused · ${GENERATED} generated"
            echo
            echo "> Existing committed \`${BASE_REF}\` previews are reused. The base engine is only rerun when a preview is missing or when the source sheet differs from \`${BASE_REF}\`."
            echo
            echo "> **L10 is expanded by default. Lower scan levels are folded for a fast visual review.**"
            echo

            for SHEET in "${SHEETS[@]}"; do

              if [[ "${SHEET}" =~ ^sheet([0-9]+)$ ]]; then
                SHEET_TITLE="Sheet ${BASH_REMATCH[1]}"
              else
                SHEET_TITLE="${SHEET}"
              fi

              echo "---"
              echo
              echo "### ${SHEET_TITLE}"
              echo

              for LEVEL in "${COMMENT_PROFILES[@]}"; do

                ORIGINAL_URL="${RAW_ROOT}/original/${SHEET}.png?v=${PR_SHA}"
                MAIN_URL="${RAW_ROOT}/main/${SHEET}/${LEVEL}.png?v=${PR_SHA}"
                PR_URL="${RAW_ROOT}/pr/${SHEET}/${LEVEL}.png?v=${PR_SHA}"

                STATUS="$(
                  cat \
                    "visual-compare/status/${SHEET}/${LEVEL}.txt"
                )"

                case "${STATUS}" in

                  reused)
                    MAIN_STATUS="cached from ${BASE_REF}"
                    ;;

                  generated-input-changed)
                    MAIN_STATUS="generated · source changed"
                    ;;

                  generated-preview-missing)
                    MAIN_STATUS="generated · preview missing"
                    ;;

                  *)
                    MAIN_STATUS="${STATUS}"
                    ;;

                esac

                if [[ "${LEVEL}" == "L10" ]]; then
                  echo "<details open>"
                else
                  echo "<details>"
                fi

                echo
                echo "<summary><strong>${LEVEL}</strong> — ${MAIN_STATUS}</summary>"
                echo
                echo "| Original | ${BASE_REF} · ${BASE_MESH_MODE} | PR #${PR_NUMBER} · ${MESH_MODE} |"
                echo "| :---: | :---: | :---: |"
                echo "| <a href=\"${ORIGINAL_URL}\"><img src=\"${ORIGINAL_URL}\" width=\"320\"></a> | <a href=\"${MAIN_URL}\"><img src=\"${MAIN_URL}\" width=\"320\"></a> | <a href=\"${PR_URL}\"><img src=\"${PR_URL}\" width=\"320\"></a> |"
                echo "| source | ${MAIN_STATUS} | current PR result |"
                echo
                echo "</details>"
                echo

              done
            done

            echo "---"
            echo
            echo "<sub>Generated automatically by the Visual Preview workflow. This comment is updated in place on every PR run.</sub>"

          } > "${COMMENT_FILE}"

          cat \
            "${COMMENT_FILE}"


      - name: Update sticky PR comment
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");

            const marker =
              "<!-- bpt-visual-preview -->";

            const body =
              fs.readFileSync(
                "visual-compare/comment.md",
                "utf8"
              );

            const comments =
              await github.paginate(
                github.rest.issues.listComments,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number:
                    context.issue.number,
                  per_page: 100,
                }
              );

            const existing =
              comments.find(
                (comment) =>
                  comment.body
                    ?.includes(marker)
              );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });

              core.info(
                `Updated sticky preview comment ${existing.id}`
              );
            } else {
              const created =
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number:
                    context.issue.number,
                  body,
                });

              core.info(
                `Created sticky preview comment ${created.data.id}`
              );
            }


      # =====================================================
      # Actions summary
      # =====================================================

      - name: Generate preview summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "# Native visual preview"
            echo
            echo "Example: **${EXAMPLE_NAME}**"
            echo
            echo "Sheets: **${{ steps.sheets.outputs.sheet_names }}**"
            echo
            echo "Resolution: **${{ steps.config.outputs.resolution }}**"
            echo
            echo "Mesh mode: **${{ steps.config.outputs.mesh_mode }}**"
            echo
            echo "Profiles: **${{ steps.config.outputs.profiles }}**"
            echo
            echo "Views: **${{ steps.config.outputs.views }}**"
            echo
            echo "Render: **${{ steps.config.outputs.size }} × ${{ steps.config.outputs.size }}**"
            echo
            echo "Cycles samples: **${{ steps.config.outputs.samples }}**"
            echo
            echo "Projection sheets:"
            echo

            find visual-preview \
              -type f \
              -name "projection_sheet.png" \
              -print \
              | sort \
              | sed 's/^/- `/' \
              | sed 's/$/`/' \
              || true

            echo
            echo "Turntables:"
            echo

            find visual-preview \
              -type f \
              -name "contact_sheet.png" \
              -print \
              | sort \
              | sed 's/^/- `/' \
              | sed 's/$/`/' \
              || true

            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              echo
              echo "## PR comparison"
              echo
              echo "Base mesh mode: **${{ steps.base.outputs.mesh_mode }}**"
              echo
              echo "PR mesh mode: **${{ steps.config.outputs.mesh_mode }}**"
              echo
              echo "main cache misses: **${{ steps.main-baseline.outputs.missing_count }}**"
            fi

          } >> "${GITHUB_STEP_SUMMARY}"


      # =====================================================
      # Artifact
      # =====================================================

      - name: Upload visual previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-visual-preview-${{ github.run_number }}
          path: |
            visual-preview/**
            visual-compare/**
            example/mascotte/test1/generated/**/manifest.json
          if-no-files-found: warn
          retention-days: 14


      # =====================================================
      # Persist main documentation
      # =====================================================

      - name: Commit visual documentation
        if: >-
          github.event_name == 'push'
          && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            docs/visual-preview.md \
            docs/previews

          if git diff \
            --cached \
            --quiet
          then
            echo "Visual documentation is already up to date."
            exit 0
          fi

          git commit \
            -m "docs: update visual reconstruction previews [skip ci]"

          git push