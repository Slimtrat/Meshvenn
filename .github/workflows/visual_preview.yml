name: Visual Preview

on:
  pull_request:
    paths:
      - "native/**"
      - "core/**"
      - "scripts/render_turntable.py"
      - "scripts/generate_*native.py"
      - "example/**"
      - ".github/workflows/visual_preview.yml"

  push:
    branches:
      - main
    paths:
      - "native/**"
      - "core/**"
      - "scripts/render_turntable.py"
      - "scripts/generate_*native.py"
      - "example/**"
      - ".github/workflows/visual_preview.yml"

  workflow_dispatch:
    inputs:
      resolution:
        description: "Visual hull resolution"
        required: false
        default: "64"

      profiles:
        description: "Profiles, space separated"
        required: false
        default: "L2 L4 L8 L10"

      views:
        description: "Views per contact sheet"
        required: false
        default: "8"

      size:
        description: "Preview size"
        required: false
        default: "384"

      samples:
        description: "Cycles samples"
        required: false
        default: "1"


permissions:
  contents: write
  pull-requests: write


concurrency:
  group: visual-preview-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true


env:
  BLENDER_VERSION: "5.2.1"
  BLENDER_ARCHIVE: "blender-5.2.1-linux-x64.tar.xz"
  BLENDER_BASE_URL: "https://download.blender.org/release/Blender5.2"
  BLENDER_ROOT: "${{ github.workspace }}/.blender"

  EXAMPLE_ROOT: "example"
  EXAMPLE_NAME: "mascotte/test1"
  SHEETS_DIR: "example/mascotte/test1/sheets"
  GENERATED_DIR: "example/mascotte/test1/generated"


jobs:

  native:
    name: Build native core
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify build tools
        shell: bash
        run: |
          set -euo pipefail

          cmake --version
          ninja --version
          g++ --version

      - name: Configure native core
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            -S native \
            -B build/native \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBPT_BUILD_TESTS=ON

      - name: Build native core
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build build/native \
            --parallel

      - name: Run native tests
        shell: bash
        run: |
          set -euo pipefail

          ctest \
            --test-dir build/native \
            --output-on-failure

      - name: Stage native library
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p native/bin

          LIB_PATH="$(
            find build/native \
              -type f \
              -name "libbpt_core.so" \
              | head -n 1
          )"

          if [[ -z "${LIB_PATH}" ]]; then
            echo "libbpt_core.so not found"
            exit 1
          fi

          cp "${LIB_PATH}" native/bin/libbpt_core.so

          ls -lh native/bin/libbpt_core.so

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: visual-preview-native-linux
          path: native/bin/libbpt_core.so
          if-no-files-found: error
          retention-days: 2


  preview:
    name: Generate visual previews
    needs:
      - native

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download native library
        uses: actions/download-artifact@v4
        with:
          name: visual-preview-native-linux
          path: native/bin

      - name: Verify native library
        shell: bash
        run: |
          set -euo pipefail

          test -f native/bin/libbpt_core.so
          ls -lh native/bin/libbpt_core.so


      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: .blender
          key: blender-linux-x64-${{ env.BLENDER_VERSION }}

      - name: Download Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${BLENDER_ROOT}"

          URL="${BLENDER_BASE_URL}/${BLENDER_ARCHIVE}"
          ARCHIVE="/tmp/${BLENDER_ARCHIVE}"

          curl \
            --fail \
            --show-error \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 900 \
            --output "${ARCHIVE}" \
            "${URL}"

          xz --test "${ARCHIVE}"

          tar \
            -xJf "${ARCHIVE}" \
            -C "${BLENDER_ROOT}" \
            --strip-components=1

          rm "${ARCHIVE}"

      - name: Verify Blender
        shell: bash
        run: |
          set -euo pipefail

          "${BLENDER_ROOT}/blender" --version


      - name: Resolve configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RESOLUTION="${{ inputs.resolution }}"
            PROFILES="${{ inputs.profiles }}"
            VIEWS="${{ inputs.views }}"
            SIZE="${{ inputs.size }}"
            SAMPLES="${{ inputs.samples }}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            RESOLUTION="48"
            PROFILES="L2"
            VIEWS="4"
            SIZE="256"
            SAMPLES="1"
          else
            RESOLUTION="64"
            PROFILES="L2 L4 L8 L10"
            VIEWS="8"
            SIZE="384"
            SAMPLES="1"
          fi

          for VALUE in "${RESOLUTION}" "${VIEWS}" "${SIZE}" "${SAMPLES}"; do
            if ! [[ "${VALUE}" =~ ^[0-9]+$ ]]; then
              echo "Invalid numeric value: ${VALUE}"
              exit 1
            fi
          done

          {
            echo "resolution=${RESOLUTION}"
            echo "profiles=${PROFILES}"
            echo "views=${VIEWS}"
            echo "size=${SIZE}"
            echo "samples=${SAMPLES}"
          } >> "${GITHUB_OUTPUT}"

          echo "Resolution: ${RESOLUTION}"
          echo "Profiles: ${PROFILES}"
          echo "Views: ${VIEWS}"
          echo "Size: ${SIZE}"
          echo "Samples: ${SAMPLES}"


      - name: Discover sheets
        id: sheets
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d "${SHEETS_DIR}" ]]; then
            echo "Missing sheets directory: ${SHEETS_DIR}"
            exit 1
          fi

          mapfile -t SHEET_PATHS < <(
            find "${SHEETS_DIR}" \
              -maxdepth 1 \
              -type f \
              -name "sheet*.png" \
              | sort
          )

          if [[ "${#SHEET_PATHS[@]}" -eq 0 ]]; then
            echo "No sheet*.png found in ${SHEETS_DIR}"
            exit 1
          fi

          SHEET_NAMES=()

          for SHEET_PATH in "${SHEET_PATHS[@]}"; do
            SHEET_NAME="$(basename "${SHEET_PATH}" .png)"
            SHEET_NAMES+=("${SHEET_NAME}")
          done

          {
            echo "count=${#SHEET_NAMES[@]}"
            echo "sheet_names=${SHEET_NAMES[*]}"
            echo "sheet_paths<<EOF"
            printf '%s\n' "${SHEET_PATHS[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

          echo "Discovered ${#SHEET_NAMES[@]} sheet(s): ${SHEET_NAMES[*]}"


      - name: Generate native scans
        shell: bash
        run: |
          set -euo pipefail

          read -ra PROFILE_ARGS <<< "${{ steps.config.outputs.profiles }}"

          "${BLENDER_ROOT}/blender" \
            --background \
            --factory-startup \
            --python scripts/generate_all_native.py \
            -- \
            --examples "${EXAMPLE_ROOT}" \
            --example "${EXAMPLE_NAME}" \
            --profiles "${PROFILE_ARGS[@]}" \
            --resolution "${{ steps.config.outputs.resolution }}" \
            --thread-count 0 \
            --skip-blend


      - name: Render previews
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p visual-preview

          read -ra SHEETS <<< "${{ steps.sheets.outputs.sheet_names }}"
          read -ra PROFILES <<< "${{ steps.config.outputs.profiles }}"

          for SHEET in "${SHEETS[@]}"; do
            for LEVEL in "${PROFILES[@]}"; do
              SCAN_DIR="${GENERATED_DIR}/${SHEET}/scans/${LEVEL}"

              if [[ ! -d "${SCAN_DIR}" ]]; then
                echo "Missing scan directory: ${SCAN_DIR}"
                exit 1
              fi

              GLB="$(
                find "${SCAN_DIR}" \
                  -type f \
                  -name "*.glb" \
                  | head -n 1
              )"

              if [[ -z "${GLB}" ]]; then
                echo "No GLB found for ${SHEET}/${LEVEL}"
                exit 1
              fi

              OUTPUT_DIR="visual-preview/${SHEET}/${LEVEL}"
              mkdir -p "${OUTPUT_DIR}"

              echo
              echo "Rendering ${SHEET} ${LEVEL}"
              echo "GLB: ${GLB}"
              echo

              "${BLENDER_ROOT}/blender" \
                --background \
                --factory-startup \
                --python scripts/render_turntable.py \
                -- \
                --input "${GLB}" \
                --output "${OUTPUT_DIR}" \
                --views "${{ steps.config.outputs.views }}" \
                --size "${{ steps.config.outputs.size }}" \
                --samples "${{ steps.config.outputs.samples }}"
            done
          done


      - name: Verify previews
        shell: bash
        run: |
          set -euo pipefail

          read -ra SHEETS <<< "${{ steps.sheets.outputs.sheet_names }}"
          read -ra PROFILES <<< "${{ steps.config.outputs.profiles }}"

          for SHEET in "${SHEETS[@]}"; do
            for LEVEL in "${PROFILES[@]}"; do
              CONTACT="visual-preview/${SHEET}/${LEVEL}/contact_sheet.png"

              if [[ ! -s "${CONTACT}" ]]; then
                echo "Missing contact sheet: ${CONTACT}"
                exit 1
              fi

              echo
              echo "${SHEET}/${LEVEL}"
              ls -lh "${CONTACT}"
            done
          done


      - name: Prepare documentation previews
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          read -ra SHEETS <<< "${{ steps.sheets.outputs.sheet_names }}"
          read -ra PROFILES <<< "${{ steps.config.outputs.profiles }}"

          rm -rf docs/previews
          mkdir -p docs/previews

          for SHEET in "${SHEETS[@]}"; do
            mkdir -p "docs/previews/${SHEET}"

            for LEVEL in "${PROFILES[@]}"; do
              SOURCE="visual-preview/${SHEET}/${LEVEL}/contact_sheet.png"
              DESTINATION="docs/previews/${SHEET}/${LEVEL}.png"

              if [[ ! -s "${SOURCE}" ]]; then
                echo "Missing preview source: ${SOURCE}"
                exit 1
              fi

              cp "${SOURCE}" "${DESTINATION}"
            done
          done

          find docs/previews -type f -print | sort


      - name: Generate visual preview Markdown
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          read -ra SHEETS <<< "${{ steps.sheets.outputs.sheet_names }}"
          read -ra PROFILES <<< "${{ steps.config.outputs.profiles }}"

          mkdir -p docs

          format_sheet_title() {
            local name="$1"

            if [[ "${name}" =~ ^sheet([0-9]+)$ ]]; then
              echo "Sheet ${BASH_REMATCH[1]}"
            else
              echo "${name}"
            fi
          }

          describe_level() {
            local level="$1"

            case "${level}" in
              L2) echo "000° + 090°" ;;
              L4) echo "000° + 090° + 180° + 270°" ;;
              L6) echo "000° + 045° + 090° + 180° + 270° + 315°" ;;
              L8) echo "8 horizontal views" ;;
              L10) echo "L8 + TOP + BOT" ;;
              *) echo "Custom profile" ;;
            esac
          }

          {
            echo "# Visual Reconstruction Preview"
            echo
            echo "This page is generated automatically from the reference sheets."
            echo
            echo "It provides a quick visual check of the native C++ reconstruction pipeline."
            echo
            echo "## Example"
            echo
            echo "- Root: \`${EXAMPLE_ROOT}/${EXAMPLE_NAME}\`"
            echo "- Sheets directory: \`${SHEETS_DIR}\`"
            echo "- Discovered sheets: **${#SHEETS[@]}**"
            echo
            echo "## Scan levels"
            echo

            for LEVEL in "${PROFILES[@]}"; do
              echo "- **${LEVEL}** — $(describe_level "${LEVEL}")"
            done

            echo

            for SHEET in "${SHEETS[@]}"; do
              SHEET_TITLE="$(format_sheet_title "${SHEET}")"

              echo "---"
              echo
              echo "## ${SHEET_TITLE}"
              echo

              for LEVEL in "${PROFILES[@]}"; do
                echo "### ${LEVEL}"
                echo
                echo "![${SHEET_TITLE} - ${LEVEL}](previews/${SHEET}/${LEVEL}.png)"
                echo
              done
            done

            echo "---"
            echo
            echo "## Generation"
            echo
            echo "These images are generated by GitHub Actions using:"
            echo
            echo "- the native C++ visual hull engine;"
            echo "- Blender headless;"
            echo "- Cycles CPU;"
            echo "- the example reference sheets in \`${SHEETS_DIR}/\`."
            echo
            echo "The committed images represent the latest successful preview generated from \`main\`."
          } > docs/visual-preview.md


      - name: Generate preview summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "# Native visual preview"
            echo
            echo "Example: **${EXAMPLE_NAME}**"
            echo
            echo "Sheets: **${{ steps.sheets.outputs.sheet_names }}**"
            echo
            echo "Resolution: **${{ steps.config.outputs.resolution }}**"
            echo
            echo "Profiles: **${{ steps.config.outputs.profiles }}**"
            echo
            echo "Views: **${{ steps.config.outputs.views }}**"
            echo
            echo "Render: **${{ steps.config.outputs.size }} × ${{ steps.config.outputs.size }}**"
            echo
            echo "Cycles samples: **${{ steps.config.outputs.samples }}**"
            echo
            echo "Contact sheets:"
            echo

            find visual-preview \
              -type f \
              -name "contact_sheet.png" \
              -print \
              | sort \
              | sed 's/^/- `/' \
              | sed 's/$/`/' \
              || true

          } >> "${GITHUB_STEP_SUMMARY}"


      - name: Upload visual previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-visual-preview-${{ github.run_number }}
          path: |
            visual-preview/**
            example/mascotte/test1/generated/**/manifest.json
          if-no-files-found: warn
          retention-days: 14


      - name: Commit visual documentation
        if: >-
          github.event_name == 'push'
          && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/visual-preview.md docs/previews

          if git diff --cached --quiet; then
            echo "Visual documentation is already up to date."
            exit 0
          fi

          git commit -m "docs: update visual reconstruction previews [skip ci]"
          git push