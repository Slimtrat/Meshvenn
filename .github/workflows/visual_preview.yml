name: Visual Preview

run-name: >-
  Visual Preview | ${{ github.event_name }} |
  ${{ github.event_name == 'workflow_dispatch' && inputs.profiles || 'L2 L10' }}


on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    paths:
      - "native/**"
      - "core/**"
      - "scripts/render_turntable.py"
      - "scripts/render_projection_sheet.py"
      - "scripts/generate_*native.py"
      - "scripts/preview_baseline.py"
      - "tests/test_preview_baseline.py"
      - "example/**"
      - ".github/workflows/visual_preview.yml"

  push:
    branches:
      - main
    paths:
      - "native/**"
      - "core/**"
      - "scripts/render_turntable.py"
      - "scripts/render_projection_sheet.py"
      - "scripts/generate_*native.py"
      - "scripts/preview_baseline.py"
      - "tests/test_preview_baseline.py"
      - "example/**"
      - ".github/workflows/visual_preview.yml"

  workflow_dispatch:
    inputs:
      resolution:
        description: "Visual hull resolution"
        required: false
        default: "64"

      profiles:
        description: "Profiles, space separated. Use L2 L4 L8 L10 for full diagnostics."
        required: false
        default: "L2 L10"

      views:
        description: "Views per turntable contact sheet"
        required: false
        default: "8"

      size:
        description: "Turntable preview size"
        required: false
        default: "384"

      samples:
        description: "Cycles samples"
        required: false
        default: "1"

      mesh_mode:
        description: "Mesh extraction algorithm"
        required: false
        default: "surface_nets"
        type: choice
        options:
          - surface_nets
          - blocks


permissions:
  contents: write
  pull-requests: write


concurrency:
  group: visual-preview-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true


env:
  BLENDER_VERSION: "5.2.1"
  BLENDER_ARCHIVE: "blender-5.2.1-linux-x64.tar.xz"
  BLENDER_BASE_URL: "https://download.blender.org/release/Blender5.2"
  BLENDER_ROOT: "${{ github.workspace }}/.blender"

  EXAMPLE_ROOT: "example"
  EXAMPLE_NAME: "mascotte/test1"
  SHEETS_DIR: "example/mascotte/test1/sheets"
  GENERATED_DIR: "example/mascotte/test1/generated"

  MATERIAL_MODE: "projected-color-v1.1"

  PREVIEW_RENDERER_VERSION: "1"

  ASSET_BRANCH: "visual-preview-assets"


jobs:

  # =========================================================
  # Closed, non-merged PR
  #
  # Merged PR assets are deliberately NOT removed here.
  #
  # They remain available until the corresponding main run
  # successfully persists its new baseline.
  # =========================================================

  cleanup-pr-assets:
    name: Clean abandoned PR preview assets

    if: >-
      github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.merged == false
      && github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:

      - name: Remove closed PR assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          PR_NUMBER="${{ github.event.pull_request.number }}"

          ROOT="${RUNNER_TEMP}/bpt-preview-assets"

          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          rm -rf "${ROOT}"

          mkdir -p "${ROOT}"

          cd "${ROOT}"

          git init

          git remote add \
            origin \
            "${REMOTE}"

          if ! git ls-remote \
            --exit-code \
            --heads \
            origin \
            "refs/heads/${ASSET_BRANCH}" \
            >/dev/null 2>&1
          then
            echo "Preview asset branch does not exist."
            exit 0
          fi

          git fetch \
            --depth=1 \
            origin \
            "${ASSET_BRANCH}"

          git checkout \
            -B "${ASSET_BRANCH}" \
            FETCH_HEAD

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf \
            "pr/${PR_NUMBER}"

          git add \
            -A

          if git diff \
            --cached \
            --quiet
          then
            echo "No PR preview assets to remove."
            exit 0
          fi

          git commit \
            -m "preview: remove closed PR #${PR_NUMBER}"

          PUSHED="false"

          for ATTEMPT in 1 2 3; do

            if git push \
              origin \
              "HEAD:refs/heads/${ASSET_BRANCH}"
            then
              PUSHED="true"
              break
            fi

            echo \
              "Asset branch changed concurrently; retry ${ATTEMPT}/3."

            git fetch \
              origin \
              "${ASSET_BRANCH}"

            git rebase \
              "origin/${ASSET_BRANCH}"

          done

          if [[ "${PUSHED}" != "true" ]]; then
            echo "Could not clean PR preview assets."
            exit 1
          fi


  # =========================================================
  # Native core + cheap Python tests
  # =========================================================

  native:
    name: Build native core

    if: >-
      github.event_name != 'pull_request'
      || github.event.action != 'closed'

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: >-
            ${{
              github.event_name == 'pull_request'
              && github.event.pull_request.head.sha
              || github.sha
            }}

      - name: Verify Python
        shell: bash
        run: |
          set -euo pipefail

          python --version

      - name: Run preview baseline tests
        shell: bash
        run: |
          set -euo pipefail

          python -m unittest \
            discover \
            -s tests \
            -p "test_preview_baseline.py" \
            -v

      - name: Verify build tools
        shell: bash
        run: |
          set -euo pipefail

          cmake --version
          ninja --version
          g++ --version

      - name: Configure native core
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            -S native \
            -B build/native \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBPT_BUILD_TESTS=ON

      - name: Build native core
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build build/native \
            --parallel

      - name: Run native tests
        shell: bash
        run: |
          set -euo pipefail

          ctest \
            --test-dir build/native \
            --output-on-failure

      - name: Stage native library
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p native/bin

          LIB_PATH="$(
            find build/native \
              -type f \
              -name "libbpt_core.so" \
              | head -n 1
          )"

          if [[ -z "${LIB_PATH}" ]]; then
            echo "libbpt_core.so not found"
            exit 1
          fi

          cp \
            "${LIB_PATH}" \
            native/bin/libbpt_core.so

          ls -lh \
            native/bin/libbpt_core.so

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: visual-preview-native-linux
          path: native/bin/libbpt_core.so
          if-no-files-found: error
          retention-days: 2


  # =========================================================
  # Preview
  # =========================================================

  preview:
    name: Generate visual previews

    if: >-
      github.event_name != 'pull_request'
      || github.event.action != 'closed'

    needs:
      - native

    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # -----------------------------------------------------
      # Checkout exact source revision.
      # -----------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: >-
            ${{
              github.event_name == 'pull_request'
              && github.event.pull_request.head.sha
              || github.sha
            }}
          fetch-depth: 0

      # -----------------------------------------------------
      # actions/checkout with an explicit commit SHA leaves
      # us detached.
      #
      # Generation should stay pinned to GITHUB_SHA, but main
      # needs an attached local branch for the documentation
      # commit later.
      # -----------------------------------------------------

      - name: Attach main branch
        if: >-
          github.event_name == 'push'
          && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          git switch \
            -C main \
            "${GITHUB_SHA}"

          test "$(
            git branch \
              --show-current
          )" = "main"

          test "$(
            git rev-parse \
              HEAD
          )" = "${GITHUB_SHA}"

      - name: Download native library
        uses: actions/download-artifact@v4
        with:
          name: visual-preview-native-linux
          path: native/bin

      - name: Verify native library
        shell: bash
        run: |
          set -euo pipefail

          test -f \
            native/bin/libbpt_core.so

          ls -lh \
            native/bin/libbpt_core.so


      # -----------------------------------------------------
      # Blender
      # -----------------------------------------------------

      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: .blender
          key: blender-linux-x64-${{ env.BLENDER_VERSION }}

      - name: Download Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            "${BLENDER_ROOT}"

          URL="${BLENDER_BASE_URL}/${BLENDER_ARCHIVE}"
          ARCHIVE="/tmp/${BLENDER_ARCHIVE}"

          curl \
            --fail \
            --show-error \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 900 \
            --output "${ARCHIVE}" \
            "${URL}"

          xz \
            --test \
            "${ARCHIVE}"

          tar \
            -xJf "${ARCHIVE}" \
            -C "${BLENDER_ROOT}" \
            --strip-components=1

          rm \
            "${ARCHIVE}"

      - name: Verify Blender
        shell: bash
        run: |
          set -euo pipefail

          "${BLENDER_ROOT}/blender" \
            --version


      # -----------------------------------------------------
      # Configuration
      # -----------------------------------------------------

      - name: Resolve configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then

            RESOLUTION="${{ inputs.resolution }}"
            PROFILES="${{ inputs.profiles }}"
            VIEWS="${{ inputs.views }}"
            SIZE="${{ inputs.size }}"
            SAMPLES="${{ inputs.samples }}"
            MESH_MODE="${{ inputs.mesh_mode }}"

          else

            RESOLUTION="64"
            PROFILES="L2 L10"
            VIEWS="8"
            SIZE="384"
            SAMPLES="1"
            MESH_MODE="surface_nets"

          fi

          for VALUE in \
            "${RESOLUTION}" \
            "${VIEWS}" \
            "${SIZE}" \
            "${SAMPLES}" \
            "${PREVIEW_RENDERER_VERSION}"
          do
            if ! [[ "${VALUE}" =~ ^[0-9]+$ ]]; then
              echo "Invalid numeric value: ${VALUE}"
              exit 1
            fi
          done

          case "${MESH_MODE}" in
            blocks|surface_nets)
              ;;
            *)
              echo "Invalid mesh mode: ${MESH_MODE}"
              exit 1
              ;;
          esac

          {
            echo "resolution=${RESOLUTION}"
            echo "profiles=${PROFILES}"
            echo "views=${VIEWS}"
            echo "size=${SIZE}"
            echo "samples=${SAMPLES}"
            echo "mesh_mode=${MESH_MODE}"
            echo "material_mode=${MATERIAL_MODE}"
            echo "renderer_version=${PREVIEW_RENDERER_VERSION}"
          } >> "${GITHUB_OUTPUT}"

          echo "Resolution: ${RESOLUTION}"
          echo "Profiles: ${PROFILES}"
          echo "Views: ${VIEWS}"
          echo "Size: ${SIZE}"
          echo "Samples: ${SAMPLES}"
          echo "Mesh mode: ${MESH_MODE}"
          echo "Material mode: ${MATERIAL_MODE}"
          echo "Renderer version: ${PREVIEW_RENDERER_VERSION}"


      # -----------------------------------------------------
      # Sheets
      # -----------------------------------------------------

      - name: Discover sheets
        id: sheets
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d "${SHEETS_DIR}" ]]; then
            echo "Missing sheets directory: ${SHEETS_DIR}"
            exit 1
          fi

          mapfile -t SHEET_PATHS < <(
            find "${SHEETS_DIR}" \
              -maxdepth 1 \
              -type f \
              -name "sheet*.png" \
              | sort
          )

          if [[ "${#SHEET_PATHS[@]}" -eq 0 ]]; then
            echo "No sheet*.png found in ${SHEETS_DIR}"
            exit 1
          fi

          SHEET_NAMES=()

          for SHEET_PATH in "${SHEET_PATHS[@]}"; do

            SHEET_NAME="$(
              basename \
                "${SHEET_PATH}" \
                .png
            )"

            SHEET_NAMES+=(
              "${SHEET_NAME}"
            )

          done

          {
            echo "count=${#SHEET_NAMES[@]}"
            echo "sheet_names=${SHEET_NAMES[*]}"

            echo "sheet_paths<<EOF"
            printf '%s\n' "${SHEET_PATHS[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

          echo \
            "Discovered ${#SHEET_NAMES[@]} sheet(s): ${SHEET_NAMES[*]}"


      # -----------------------------------------------------
      # Current branch reconstruction
      # -----------------------------------------------------

      - name: Generate native scans
        shell: bash
        run: |
          set -euo pipefail

          read -ra PROFILE_ARGS \
            <<< "${{ steps.config.outputs.profiles }}"

          "${BLENDER_ROOT}/blender" \
            --background \
            --factory-startup \
            --python scripts/generate_all_native.py \
            -- \
            --examples "${EXAMPLE_ROOT}" \
            --example "${EXAMPLE_NAME}" \
            --profiles "${PROFILE_ARGS[@]}" \
            --resolution "${{ steps.config.outputs.resolution }}" \
            --mesh-mode "${{ steps.config.outputs.mesh_mode }}" \
            --thread-count 0 \
            --skip-blend


      # -----------------------------------------------------
      # Current branch rendering
      #
      # Geometry and appearance stay independent.
      # -----------------------------------------------------

      - name: Render previews
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            visual-preview

          read -ra SHEETS \
            <<< "${{ steps.sheets.outputs.sheet_names }}"

          read -ra PROFILES \
            <<< "${{ steps.config.outputs.profiles }}"

          for SHEET in "${SHEETS[@]}"; do

            TEMPLATE="${SHEETS_DIR}/${SHEET}.png"

            if [[ ! -s "${TEMPLATE}" ]]; then
              echo "Missing source sheet: ${TEMPLATE}"
              exit 1
            fi

            for LEVEL in "${PROFILES[@]}"; do

              SCAN_DIR="${GENERATED_DIR}/${SHEET}/scans/${LEVEL}"

              if [[ ! -d "${SCAN_DIR}" ]]; then
                echo "Missing scan directory: ${SCAN_DIR}"
                exit 1
              fi

              GLB="$(
                find "${SCAN_DIR}" \
                  -type f \
                  -name "*.glb" \
                  | head -n 1
              )"

              if [[ -z "${GLB}" ]]; then
                echo "No GLB found for ${SHEET}/${LEVEL}"
                exit 1
              fi

              OUTPUT_DIR="visual-preview/${SHEET}/${LEVEL}"

              mkdir -p \
                "${OUTPUT_DIR}"

              echo
              echo "Rendering ${SHEET} ${LEVEL}"
              echo "GLB: ${GLB}"
              echo

              # ---------------------------------------------
              # Turntable
              # ---------------------------------------------

              "${BLENDER_ROOT}/blender" \
                --background \
                --factory-startup \
                --python scripts/render_turntable.py \
                -- \
                --input "${GLB}" \
                --output "${OUTPUT_DIR}" \
                --views "${{ steps.config.outputs.views }}" \
                --size "${{ steps.config.outputs.size }}" \
                --samples "${{ steps.config.outputs.samples }}"

              # ---------------------------------------------
              # Geometry
              # ---------------------------------------------

              "${BLENDER_ROOT}/blender" \
                --background \
                --factory-startup \
                --python scripts/render_projection_sheet.py \
                -- \
                --input "${GLB}" \
                --template "${TEMPLATE}" \
                --output "${OUTPUT_DIR}/projection_geometry.png" \
                --samples "${{ steps.config.outputs.samples }}" \
                --material-mode neutral

              # ---------------------------------------------
              # Material
              # ---------------------------------------------

              "${BLENDER_ROOT}/blender" \
                --background \
                --factory-startup \
                --python scripts/render_projection_sheet.py \
                -- \
                --input "${GLB}" \
                --template "${TEMPLATE}" \
                --output "${OUTPUT_DIR}/projection_material.png" \
                --samples "${{ steps.config.outputs.samples }}" \
                --material-mode original

            done
          done


      # -----------------------------------------------------
      # Current branch verification
      # -----------------------------------------------------

      - name: Verify previews
        shell: bash
        run: |
          set -euo pipefail

          read -ra SHEETS \
            <<< "${{ steps.sheets.outputs.sheet_names }}"

          read -ra PROFILES \
            <<< "${{ steps.config.outputs.profiles }}"

          for SHEET in "${SHEETS[@]}"; do
            for LEVEL in "${PROFILES[@]}"; do

              CONTACT="visual-preview/${SHEET}/${LEVEL}/contact_sheet.png"
              GEOMETRY="visual-preview/${SHEET}/${LEVEL}/projection_geometry.png"
              MATERIAL="visual-preview/${SHEET}/${LEVEL}/projection_material.png"

              for FILE in \
                "${CONTACT}" \
                "${GEOMETRY}" \
                "${MATERIAL}"
              do

                if [[ ! -s "${FILE}" ]]; then
                  echo "Missing preview: ${FILE}"
                  exit 1
                fi

              done

              echo
              echo "${SHEET}/${LEVEL}"

              ls -lh \
                "${CONTACT}" \
                "${GEOMETRY}" \
                "${MATERIAL}"

            done
          done


      # =====================================================
      # Permanent main baseline
      # =====================================================

      - name: Prepare documentation previews
        if: >-
          github.event_name == 'push'
          && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          read -ra SHEETS \
            <<< "${{ steps.sheets.outputs.sheet_names }}"

          read -ra PROFILES \
            <<< "${{ steps.config.outputs.profiles }}"

          rm -rf \
            docs/previews

          mkdir -p \
            docs/previews

          for SHEET in "${SHEETS[@]}"; do

            SHEET_DOCS="docs/previews/${SHEET}"

            mkdir -p \
              "${SHEET_DOCS}"

            cp \
              "${SHEETS_DIR}/${SHEET}.png" \
              "${SHEET_DOCS}/original.png"

            for LEVEL in "${PROFILES[@]}"; do

              LEVEL_DOCS="${SHEET_DOCS}/${LEVEL}"

              mkdir -p \
                "${LEVEL_DOCS}"

              cp \
                "visual-preview/${SHEET}/${LEVEL}/contact_sheet.png" \
                "${LEVEL_DOCS}/turntable.png"

              cp \
                "visual-preview/${SHEET}/${LEVEL}/projection_geometry.png" \
                "${LEVEL_DOCS}/geometry.png"

              cp \
                "visual-preview/${SHEET}/${LEVEL}/projection_material.png" \
                "${LEVEL_DOCS}/material.png"

            done
          done

          find docs/previews \
            -type f \
            -print \
            | sort


      # -----------------------------------------------------
      # Baseline metadata
      # -----------------------------------------------------

      - name: Generate baseline manifest
        if: >-
          github.event_name == 'push'
          && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          read -ra SHEETS \
            <<< "${{ steps.sheets.outputs.sheet_names }}"

          read -ra PROFILES \
            <<< "${{ steps.config.outputs.profiles }}"

          python scripts/preview_baseline.py \
            write \
            --repo-root "${GITHUB_WORKSPACE}" \
            --sheets-dir "${SHEETS_DIR}" \
            --sheet-names "${SHEETS[@]}" \
            --profiles "${PROFILES[@]}" \
            --source-commit "${GITHUB_SHA}" \
            --output "docs/previews/manifest.json" \
            --resolution "${{ steps.config.outputs.resolution }}" \
            --mesh-mode "${{ steps.config.outputs.mesh_mode }}" \
            --material-mode "${MATERIAL_MODE}" \
            --samples "${{ steps.config.outputs.samples }}" \
            --turntable-views "${{ steps.config.outputs.views }}" \
            --render-size "${{ steps.config.outputs.size }}" \
            --renderer-version "${PREVIEW_RENDERER_VERSION}"

          python -m json.tool \
            docs/previews/manifest.json


      # -----------------------------------------------------
      # Persistent Markdown
      # -----------------------------------------------------

      - name: Generate visual preview Markdown
        if: >-
          github.event_name == 'push'
          && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          read -ra SHEETS \
            <<< "${{ steps.sheets.outputs.sheet_names }}"

          read -ra PROFILES \
            <<< "${{ steps.config.outputs.profiles }}"

          mkdir -p \
            docs

          format_sheet_title() {
            local name="$1"

            if [[ "${name}" =~ ^sheet([0-9]+)$ ]]; then
              echo "Sheet ${BASH_REMATCH[1]}"
            else
              echo "${name}"
            fi
          }

          describe_level() {
            local level="$1"

            case "${level}" in
              L2)
                echo "000° + 090°"
                ;;
              L4)
                echo "000° + 090° + 180° + 270°"
                ;;
              L6)
                echo "000° + 045° + 090° + 180° + 270° + 315°"
                ;;
              L8)
                echo "8 horizontal views"
                ;;
              L10)
                echo "L8 + TOP + BOT"
                ;;
              *)
                echo "Custom profile"
                ;;
            esac
          }

          {
            echo "# Visual Reconstruction Preview"
            echo
            echo "Automatically generated from the Projection Tool reference sheets."
            echo
            echo "Geometry and appearance are rendered independently so changes to the mesher and projected material remain directly comparable."
            echo

            echo "## Example"
            echo
            echo "- Root: \`${EXAMPLE_ROOT}/${EXAMPLE_NAME}\`"
            echo "- Sheets directory: \`${SHEETS_DIR}\`"
            echo "- Discovered sheets: **${#SHEETS[@]}**"
            echo "- Mesh mode: **${{ steps.config.outputs.mesh_mode }}**"
            echo "- Material mode: **${MATERIAL_MODE}**"
            echo "- Renderer baseline version: **${PREVIEW_RENDERER_VERSION}**"
            echo "- Baseline metadata: \`previews/manifest.json\`"
            echo

            echo "## Scan levels"
            echo

            for LEVEL in "${PROFILES[@]}"; do
              echo "- **${LEVEL}** — $(describe_level "${LEVEL}")"
            done

            echo

            for SHEET in "${SHEETS[@]}"; do

              SHEET_TITLE="$(
                format_sheet_title \
                  "${SHEET}"
              )"

              echo "---"
              echo
              echo "## ${SHEET_TITLE}"
              echo

              for LEVEL in "${PROFILES[@]}"; do

                echo "### ${LEVEL}"
                echo

                echo "#### Projected material"
                echo
                echo "| Original | Reconstruction ${LEVEL} |"
                echo "| :---: | :---: |"
                echo "| ![${SHEET_TITLE} original](previews/${SHEET}/original.png) | ![${SHEET_TITLE} ${LEVEL} material](previews/${SHEET}/${LEVEL}/material.png) |"
                echo

                echo "<details>"
                echo "<summary>Geometry ${LEVEL}</summary>"
                echo
                echo "| Original | Neutral geometry |"
                echo "| :---: | :---: |"
                echo "| ![${SHEET_TITLE} original](previews/${SHEET}/original.png) | ![${SHEET_TITLE} ${LEVEL} geometry](previews/${SHEET}/${LEVEL}/geometry.png) |"
                echo
                echo "</details>"
                echo

                echo "<details>"
                echo "<summary>Turntable ${LEVEL}</summary>"
                echo
                echo "![${SHEET_TITLE} ${LEVEL} turntable](previews/${SHEET}/${LEVEL}/turntable.png)"
                echo
                echo "</details>"
                echo

              done
            done

            echo "---"
            echo
            echo "## Generation"
            echo
            echo "Generated by GitHub Actions using:"
            echo
            echo "- the native C++ visual hull engine;"
            echo "- mesh extraction: \`${{ steps.config.outputs.mesh_mode }}\`;"
            echo "- material projection: \`${MATERIAL_MODE}\`;"
            echo "- Blender headless;"
            echo "- Cycles CPU;"
            echo "- the Projection Tool sheets in \`${SHEETS_DIR}/\`."
            echo
            echo "The committed images and manifest represent the latest successful baseline generated from \`main\`."

          } > docs/visual-preview.md


      # =====================================================
      # PR base
      # =====================================================

      - name: Resolve PR base
        if: github.event_name == 'pull_request'
        id: base
        shell: bash
        run: |
          set -euo pipefail

          BASE_REF="${{ github.event.pull_request.base.ref }}"

          git fetch \
            origin \
            "${BASE_REF}:refs/remotes/origin/${BASE_REF}"

          BASE_SHA="$(
            git rev-parse \
              "refs/remotes/origin/${BASE_REF}"
          )"

          BASE_SHORT="$(
            git rev-parse \
              --short=8 \
              "${BASE_SHA}"
          )"

          # --------------------------------------------------
          # Compatibility fallback for repositories before
          # manifest.json existed.
          # --------------------------------------------------

          BASE_MESH_MODE="blocks"
          BASE_MATERIAL_MODE="legacy"

          BASE_MANIFEST_JSON="$(
            git show \
              "${BASE_SHA}:docs/previews/manifest.json" \
              2>/dev/null \
              || true
          )"

          if [[ -n "${BASE_MANIFEST_JSON}" ]]; then

            BASE_MESH_MODE="$(
              printf '%s' "${BASE_MANIFEST_JSON}" \
                | python -c \
                  'import json,sys; print(json.load(sys.stdin)["configuration"]["mesh_mode"])'
            )"

            BASE_MATERIAL_MODE="$(
              printf '%s' "${BASE_MANIFEST_JSON}" \
                | python -c \
                  'import json,sys; print(json.load(sys.stdin)["configuration"]["material_mode"])'
            )"

          else

            BASE_WORKFLOW="$(
              git show \
                "${BASE_SHA}:.github/workflows/visual_preview.yml" \
                2>/dev/null \
                || true
            )"

            if printf '%s\n' "${BASE_WORKFLOW}" \
              | grep -q 'MESH_MODE="surface_nets"'
            then
              BASE_MESH_MODE="surface_nets"
            fi

            BASE_GENERATOR="$(
              git show \
                "${BASE_SHA}:scripts/generate_example_native.py" \
                2>/dev/null \
                || true
            )"

            if printf '%s\n' "${BASE_GENERATOR}" \
              | grep -q 'projected-color-v1'
            then
              BASE_MATERIAL_MODE="projected-color-v1"
            fi

          fi

          {
            echo "ref=${BASE_REF}"
            echo "sha=${BASE_SHA}"
            echo "short_sha=${BASE_SHORT}"
            echo "mesh_mode=${BASE_MESH_MODE}"
            echo "material_mode=${BASE_MATERIAL_MODE}"
          } >> "${GITHUB_OUTPUT}"

          echo "Base ref: ${BASE_REF}"
          echo "Base SHA: ${BASE_SHA}"
          echo "Base mesh mode: ${BASE_MESH_MODE}"
          echo "Base material mode: ${BASE_MATERIAL_MODE}"


      # =====================================================
      # PR baseline preparation
      # =====================================================

      - name: Prepare PR visual comparison
        if: github.event_name == 'pull_request'
        id: main-baseline
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA="${{ steps.base.outputs.sha }}"
          BASE_MESH_MODE="${{ steps.base.outputs.mesh_mode }}"
          BASE_MATERIAL_MODE="${{ steps.base.outputs.material_mode }}"

          rm -rf \
            visual-compare

          mkdir -p \
            visual-compare/original \
            visual-compare/main \
            visual-compare/pr \
            visual-compare/status

          MISSING_FILE="${RUNNER_TEMP}/bpt-missing-main.tsv"
          BASE_MANIFEST="${RUNNER_TEMP}/bpt-base-preview-manifest.json"

          : > "${MISSING_FILE}"

          HAS_BASE_MANIFEST="false"

          if git cat-file \
            -e \
            "${BASE_SHA}:docs/previews/manifest.json" \
            2>/dev/null
          then

            git show \
              "${BASE_SHA}:docs/previews/manifest.json" \
              > "${BASE_MANIFEST}"

            HAS_BASE_MANIFEST="true"

            echo "Base manifest found."

          else

            echo "Base manifest missing; legacy compatibility mode."

          fi

          read -ra SHEETS \
            <<< "${{ steps.sheets.outputs.sheet_names }}"

          read -ra PROFILES \
            <<< "${{ steps.config.outputs.profiles }}"

          for SHEET in "${SHEETS[@]}"; do

            SOURCE_SHEET="${SHEETS_DIR}/${SHEET}.png"

            cp \
              "${SOURCE_SHEET}" \
              "visual-compare/original/${SHEET}.png"

            mkdir -p \
              "visual-compare/main/${SHEET}" \
              "visual-compare/pr/${SHEET}" \
              "visual-compare/status/${SHEET}"

            SOURCE_CHANGED="false"

            if ! git cat-file \
              -e \
              "${BASE_SHA}:${SOURCE_SHEET}" \
              2>/dev/null
            then

              SOURCE_CHANGED="true"

            elif ! git diff \
              --quiet \
              "${BASE_SHA}" \
              HEAD \
              -- \
              "${SOURCE_SHEET}"
            then

              SOURCE_CHANGED="true"

            fi

            for LEVEL in "${PROFILES[@]}"; do

              STATUS_DIR="visual-compare/status/${SHEET}/${LEVEL}"

              mkdir -p \
                "visual-compare/main/${SHEET}/${LEVEL}" \
                "visual-compare/pr/${SHEET}/${LEVEL}" \
                "${STATUS_DIR}"

              cp \
                "visual-preview/${SHEET}/${LEVEL}/projection_geometry.png" \
                "visual-compare/pr/${SHEET}/${LEVEL}/geometry.png"

              cp \
                "visual-preview/${SHEET}/${LEVEL}/projection_material.png" \
                "visual-compare/pr/${SHEET}/${LEVEL}/material.png"

              MAIN_GEOMETRY_OUTPUT="visual-compare/main/${SHEET}/${LEVEL}/geometry.png"
              MAIN_MATERIAL_OUTPUT="visual-compare/main/${SHEET}/${LEVEL}/material.png"

              GEOMETRY_STATUS="${STATUS_DIR}/geometry.txt"
              MATERIAL_STATUS="${STATUS_DIR}/material.txt"
              COMPATIBILITY_STATUS="${STATUS_DIR}/compatibility.txt"

              NEW_GEOMETRY_DOC="docs/previews/${SHEET}/${LEVEL}/geometry.png"
              LEGACY_GEOMETRY_DOC="docs/previews/${SHEET}/${LEVEL}/projection.png"
              MATERIAL_DOC="docs/previews/${SHEET}/${LEVEL}/material.png"

              NEED_GEOMETRY="false"
              NEED_MATERIAL="false"

              BASELINE_COMPATIBLE="false"

              # ---------------------------------------------
              # Manifest validation
              # ---------------------------------------------

              if [[ "${SOURCE_CHANGED}" == "true" ]]; then

                echo \
                  "source-changed" \
                  > "${COMPATIBILITY_STATUS}"

              elif [[ "${HAS_BASE_MANIFEST}" == "true" ]]; then

                set +e

                CHECK_OUTPUT="$(
                  python scripts/preview_baseline.py \
                    check \
                    --manifest "${BASE_MANIFEST}" \
                    --sheet "${SHEET}" \
                    --source "${SOURCE_SHEET}" \
                    --profile "${LEVEL}" \
                    --resolution "${{ steps.config.outputs.resolution }}" \
                    --mesh-mode "${BASE_MESH_MODE}" \
                    --material-mode "${BASE_MATERIAL_MODE}" \
                    --samples "${{ steps.config.outputs.samples }}" \
                    --turntable-views "${{ steps.config.outputs.views }}" \
                    --render-size "${{ steps.config.outputs.size }}" \
                    --renderer-version "${PREVIEW_RENDERER_VERSION}" \
                    2>&1
                )"

                CHECK_RESULT=$?

                set -e

                printf '%s\n' \
                  "${CHECK_OUTPUT}" \
                  > "${COMPATIBILITY_STATUS}"

                if [[ "${CHECK_RESULT}" -eq 0 ]]; then
                  BASELINE_COMPATIBLE="true"
                fi

              else

                echo \
                  "legacy-no-manifest" \
                  > "${COMPATIBILITY_STATUS}"

              fi

              # ---------------------------------------------
              # Manifest-backed baseline
              # ---------------------------------------------

              if [[ "${SOURCE_CHANGED}" == "false" ]] \
                && [[ "${HAS_BASE_MANIFEST}" == "true" ]] \
                && [[ "${BASELINE_COMPATIBLE}" == "true" ]]
              then

                if git cat-file \
                  -e \
                  "${BASE_SHA}:${NEW_GEOMETRY_DOC}" \
                  2>/dev/null
                then

                  git show \
                    "${BASE_SHA}:${NEW_GEOMETRY_DOC}" \
                    > "${MAIN_GEOMETRY_OUTPUT}"

                  echo \
                    "reused" \
                    > "${GEOMETRY_STATUS}"

                else

                  NEED_GEOMETRY="true"

                  echo \
                    "generated-preview-missing" \
                    > "${GEOMETRY_STATUS}"

                fi

                if git cat-file \
                  -e \
                  "${BASE_SHA}:${MATERIAL_DOC}" \
                  2>/dev/null
                then

                  git show \
                    "${BASE_SHA}:${MATERIAL_DOC}" \
                    > "${MAIN_MATERIAL_OUTPUT}"

                  echo \
                    "reused" \
                    > "${MATERIAL_STATUS}"

                else

                  NEED_MATERIAL="true"

                  echo \
                    "generated-preview-missing" \
                    > "${MATERIAL_STATUS}"

                fi

              # ---------------------------------------------
              # Legacy baseline without metadata
              # ---------------------------------------------

              elif [[ "${SOURCE_CHANGED}" == "false" ]] \
                && [[ "${HAS_BASE_MANIFEST}" == "false" ]]
              then

                if git cat-file \
                  -e \
                  "${BASE_SHA}:${NEW_GEOMETRY_DOC}" \
                  2>/dev/null
                then

                  git show \
                    "${BASE_SHA}:${NEW_GEOMETRY_DOC}" \
                    > "${MAIN_GEOMETRY_OUTPUT}"

                  echo \
                    "reused-legacy" \
                    > "${GEOMETRY_STATUS}"

                elif git cat-file \
                  -e \
                  "${BASE_SHA}:${LEGACY_GEOMETRY_DOC}" \
                  2>/dev/null
                then

                  git show \
                    "${BASE_SHA}:${LEGACY_GEOMETRY_DOC}" \
                    > "${MAIN_GEOMETRY_OUTPUT}"

                  echo \
                    "reused-legacy" \
                    > "${GEOMETRY_STATUS}"

                else

                  NEED_GEOMETRY="true"

                  echo \
                    "generated-preview-missing" \
                    > "${GEOMETRY_STATUS}"

                fi

                if git cat-file \
                  -e \
                  "${BASE_SHA}:${MATERIAL_DOC}" \
                  2>/dev/null
                then

                  git show \
                    "${BASE_SHA}:${MATERIAL_DOC}" \
                    > "${MAIN_MATERIAL_OUTPUT}"

                  echo \
                    "reused-legacy" \
                    > "${MATERIAL_STATUS}"

                else

                  NEED_MATERIAL="true"

                  echo \
                    "generated-preview-missing" \
                    > "${MATERIAL_STATUS}"

                fi

              # ---------------------------------------------
              # Changed source or incompatible manifest.
              #
              # Rebuild base with current source sheet so the
              # PR comparison remains apples-to-apples.
              # ---------------------------------------------

              else

                NEED_GEOMETRY="true"
                NEED_MATERIAL="true"

                if [[ "${SOURCE_CHANGED}" == "true" ]]; then

                  echo \
                    "generated-input-changed" \
                    > "${GEOMETRY_STATUS}"

                  echo \
                    "generated-input-changed" \
                    > "${MATERIAL_STATUS}"

                else

                  echo \
                    "generated-baseline-incompatible" \
                    > "${GEOMETRY_STATUS}"

                  echo \
                    "generated-baseline-incompatible" \
                    > "${MATERIAL_STATUS}"

                fi

              fi

              if \
                [[ "${NEED_GEOMETRY}" == "true" ]] \
                || [[ "${NEED_MATERIAL}" == "true" ]]
              then

                printf '%s\t%s\t%s\t%s\n' \
                  "${SHEET}" \
                  "${LEVEL}" \
                  "${NEED_GEOMETRY}" \
                  "${NEED_MATERIAL}" \
                  >> "${MISSING_FILE}"

              fi

            done
          done

          MISSING_COUNT="$(
            wc -l \
              < "${MISSING_FILE}" \
              | tr -d ' '
          )"

          {
            echo "missing_count=${MISSING_COUNT}"
            echo "missing_file=${MISSING_FILE}"
            echo "has_base_manifest=${HAS_BASE_MANIFEST}"
          } >> "${GITHUB_OUTPUT}"

          echo
          echo "Base reconstructions required: ${MISSING_COUNT}"

          if [[ "${MISSING_COUNT}" -gt 0 ]]; then
            echo
            cat "${MISSING_FILE}"
          fi


      # =====================================================
      # Base regeneration
      # =====================================================

      - name: Generate missing main baselines
        if: >-
          github.event_name == 'pull_request'
          && steps.main-baseline.outputs.missing_count != '0'
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA="${{ steps.base.outputs.sha }}"
          BASE_MESH_MODE="${{ steps.base.outputs.mesh_mode }}"

          MISSING_FILE="${{ steps.main-baseline.outputs.missing_file }}"

          MAIN_WORKTREE="${RUNNER_TEMP}/bpt-main"
          MAIN_BUILD="${RUNNER_TEMP}/bpt-main-build"
          MAIN_INPUT_ROOT="${RUNNER_TEMP}/bpt-main-input"
          MAIN_EXAMPLE="${MAIN_INPUT_ROOT}/${EXAMPLE_NAME}"

          rm -rf \
            "${MAIN_WORKTREE}" \
            "${MAIN_BUILD}" \
            "${MAIN_INPUT_ROOT}"

          git worktree add \
            --detach \
            "${MAIN_WORKTREE}" \
            "${BASE_SHA}"

          mkdir -p \
            "${MAIN_EXAMPLE}/sheets"

          mapfile -t MISSING_SHEETS < <(
            cut \
              -f1 \
              "${MISSING_FILE}" \
              | sort \
              -u
          )

          for SHEET in "${MISSING_SHEETS[@]}"; do

            cp \
              "${SHEETS_DIR}/${SHEET}.png" \
              "${MAIN_EXAMPLE}/sheets/${SHEET}.png"

          done

          read -ra ALL_PROFILES \
            <<< "${{ steps.config.outputs.profiles }}"

          MISSING_PROFILES=()

          for LEVEL in "${ALL_PROFILES[@]}"; do

            if awk \
              -F '\t' \
              -v level="${LEVEL}" \
              '$2 == level { found = 1 } END { exit !found }' \
              "${MISSING_FILE}"
            then

              MISSING_PROFILES+=(
                "${LEVEL}"
              )

            fi

          done

          echo
          echo "Missing sheets: ${MISSING_SHEETS[*]}"
          echo "Missing profiles: ${MISSING_PROFILES[*]}"
          echo "Base mesh mode: ${BASE_MESH_MODE}"
          echo

          cmake \
            -S "${MAIN_WORKTREE}/native" \
            -B "${MAIN_BUILD}" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBPT_BUILD_TESTS=OFF

          cmake \
            --build "${MAIN_BUILD}" \
            --parallel

          MAIN_LIB="$(
            find "${MAIN_BUILD}" \
              -type f \
              -name "libbpt_core.so" \
              | head -n 1
          )"

          if [[ -z "${MAIN_LIB}" ]]; then
            echo "Main libbpt_core.so not found"
            exit 1
          fi

          mkdir -p \
            "${MAIN_WORKTREE}/native/bin"

          cp \
            "${MAIN_LIB}" \
            "${MAIN_WORKTREE}/native/bin/libbpt_core.so"

          BASE_MESH_ARGS=()

          if grep \
            -q \
            -- '"--mesh-mode"' \
            "${MAIN_WORKTREE}/scripts/generate_example_native.py"
          then

            BASE_MESH_ARGS=(
              --mesh-mode
              "${BASE_MESH_MODE}"
            )

          fi

          "${BLENDER_ROOT}/blender" \
            --background \
            --factory-startup \
            --python "${MAIN_WORKTREE}/scripts/generate_example_native.py" \
            -- \
            "${MAIN_EXAMPLE}" \
            "${MAIN_EXAMPLE}" \
            --profiles "${MISSING_PROFILES[@]}" \
            --resolution "${{ steps.config.outputs.resolution }}" \
            "${BASE_MESH_ARGS[@]}" \
            --thread-count 0 \
            --skip-blend

          while IFS=$'\t' read -r \
            SHEET \
            LEVEL \
            NEED_GEOMETRY \
            NEED_MATERIAL
          do

            SCAN_DIR="${MAIN_EXAMPLE}/generated/${SHEET}/scans/${LEVEL}"

            GLB="$(
              find "${SCAN_DIR}" \
                -type f \
                -name "*.glb" \
                | head -n 1
            )"

            if [[ -z "${GLB}" ]]; then
              echo "No base GLB found for ${SHEET}/${LEVEL}"
              exit 1
            fi

            if [[ "${NEED_GEOMETRY}" == "true" ]]; then

              "${BLENDER_ROOT}/blender" \
                --background \
                --factory-startup \
                --python scripts/render_projection_sheet.py \
                -- \
                --input "${GLB}" \
                --template "${SHEETS_DIR}/${SHEET}.png" \
                --output "visual-compare/main/${SHEET}/${LEVEL}/geometry.png" \
                --samples "${{ steps.config.outputs.samples }}" \
                --material-mode neutral

            fi

            if [[ "${NEED_MATERIAL}" == "true" ]]; then

              "${BLENDER_ROOT}/blender" \
                --background \
                --factory-startup \
                --python scripts/render_projection_sheet.py \
                -- \
                --input "${GLB}" \
                --template "${SHEETS_DIR}/${SHEET}.png" \
                --output "visual-compare/main/${SHEET}/${LEVEL}/material.png" \
                --samples "${{ steps.config.outputs.samples }}" \
                --material-mode original

            fi

          done < "${MISSING_FILE}"

          git worktree remove \
            --force \
            "${MAIN_WORKTREE}"


      # -----------------------------------------------------
      # Comparison verification
      # -----------------------------------------------------

      - name: Verify PR comparison
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          read -ra SHEETS \
            <<< "${{ steps.sheets.outputs.sheet_names }}"

          read -ra PROFILES \
            <<< "${{ steps.config.outputs.profiles }}"

          for SHEET in "${SHEETS[@]}"; do

            ORIGINAL="visual-compare/original/${SHEET}.png"

            if [[ ! -s "${ORIGINAL}" ]]; then
              echo "Missing original: ${ORIGINAL}"
              exit 1
            fi

            for LEVEL in "${PROFILES[@]}"; do

              for FILE in \
                "visual-compare/main/${SHEET}/${LEVEL}/geometry.png" \
                "visual-compare/main/${SHEET}/${LEVEL}/material.png" \
                "visual-compare/pr/${SHEET}/${LEVEL}/geometry.png" \
                "visual-compare/pr/${SHEET}/${LEVEL}/material.png" \
                "visual-compare/status/${SHEET}/${LEVEL}/geometry.txt" \
                "visual-compare/status/${SHEET}/${LEVEL}/material.txt" \
                "visual-compare/status/${SHEET}/${LEVEL}/compatibility.txt"
              do

                if [[ ! -s "${FILE}" ]]; then
                  echo "Missing comparison file: ${FILE}"
                  exit 1
                fi

              done

            done
          done


      # =====================================================
      # Transient PR hosting branch
      # =====================================================

      - name: Publish PR preview images
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        id: assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          PR_NUMBER="${{ github.event.pull_request.number }}"

          ASSET_ROOT="${RUNNER_TEMP}/bpt-preview-assets"

          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          rm -rf \
            "${ASSET_ROOT}"

          mkdir -p \
            "${ASSET_ROOT}"

          cd \
            "${ASSET_ROOT}"

          git init

          git remote add \
            origin \
            "${REMOTE}"

          if git ls-remote \
            --exit-code \
            --heads \
            origin \
            "refs/heads/${ASSET_BRANCH}" \
            >/dev/null 2>&1
          then

            git fetch \
              --depth=1 \
              origin \
              "${ASSET_BRANCH}"

            git checkout \
              -B "${ASSET_BRANCH}" \
              FETCH_HEAD

          else

            git checkout \
              --orphan \
              "${ASSET_BRANCH}"

            git rm \
              -rf \
              . \
              2>/dev/null \
              || true

          fi

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf \
            "pr/${PR_NUMBER}"

          mkdir -p \
            "pr/${PR_NUMBER}"

          cp -R \
            "${GITHUB_WORKSPACE}/visual-compare/original" \
            "pr/${PR_NUMBER}/original"

          cp -R \
            "${GITHUB_WORKSPACE}/visual-compare/main" \
            "pr/${PR_NUMBER}/main"

          cp -R \
            "${GITHUB_WORKSPACE}/visual-compare/pr" \
            "pr/${PR_NUMBER}/pr"

          git add \
            -A \
            "pr/${PR_NUMBER}"

          if git diff \
            --cached \
            --quiet
          then

            echo "PR preview assets are already current."

          else

            git commit \
              -m "preview: update PR #${PR_NUMBER}"

            PUSHED="false"

            for ATTEMPT in 1 2 3; do

              if git push \
                origin \
                "HEAD:refs/heads/${ASSET_BRANCH}"
              then
                PUSHED="true"
                break
              fi

              echo \
                "Asset branch changed concurrently; retry ${ATTEMPT}/3."

              git fetch \
                origin \
                "${ASSET_BRANCH}"

              git rebase \
                "origin/${ASSET_BRANCH}"

            done

            if [[ "${PUSHED}" != "true" ]]; then
              echo "Could not publish preview assets."
              exit 1
            fi

          fi

          {
            echo "branch=${ASSET_BRANCH}"
            echo "raw_root=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${ASSET_BRANCH}/pr/${PR_NUMBER}"
          } >> "${GITHUB_OUTPUT}"


      # =====================================================
      # Sticky comment
      # =====================================================

      - name: Build sticky PR comment
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail

          COMMENT_FILE="visual-compare/comment.md"

          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_SHA="${{ github.event.pull_request.head.sha }}"
          PR_SHORT="${PR_SHA:0:8}"

          BASE_REF="${{ steps.base.outputs.ref }}"
          BASE_SHORT="${{ steps.base.outputs.short_sha }}"
          BASE_MESH_MODE="${{ steps.base.outputs.mesh_mode }}"
          BASE_MATERIAL_MODE="${{ steps.base.outputs.material_mode }}"

          MESH_MODE="${{ steps.config.outputs.mesh_mode }}"

          RAW_ROOT="${{ steps.assets.outputs.raw_root }}"

          read -ra SHEETS \
            <<< "${{ steps.sheets.outputs.sheet_names }}"

          read -ra PROFILES \
            <<< "${{ steps.config.outputs.profiles }}"

          COMMENT_PROFILES=()

          for LEVEL in "${PROFILES[@]}"; do
            if [[ "${LEVEL}" == "L10" ]]; then
              COMMENT_PROFILES+=(
                "${LEVEL}"
              )
            fi
          done

          for LEVEL in "${PROFILES[@]}"; do
            if [[ "${LEVEL}" != "L10" ]]; then
              COMMENT_PROFILES+=(
                "${LEVEL}"
              )
            fi
          done

          GEOMETRY_REUSED=0
          GEOMETRY_GENERATED=0

          MATERIAL_REUSED=0
          MATERIAL_GENERATED=0

          for SHEET in "${SHEETS[@]}"; do
            for LEVEL in "${PROFILES[@]}"; do

              GSTATUS="$(
                cat \
                  "visual-compare/status/${SHEET}/${LEVEL}/geometry.txt"
              )"

              MSTATUS="$(
                cat \
                  "visual-compare/status/${SHEET}/${LEVEL}/material.txt"
              )"

              case "${GSTATUS}" in
                reused|reused-legacy)
                  GEOMETRY_REUSED=$((GEOMETRY_REUSED + 1))
                  ;;
                *)
                  GEOMETRY_GENERATED=$((GEOMETRY_GENERATED + 1))
                  ;;
              esac

              case "${MSTATUS}" in
                reused|reused-legacy)
                  MATERIAL_REUSED=$((MATERIAL_REUSED + 1))
                  ;;
                *)
                  MATERIAL_GENERATED=$((MATERIAL_GENERATED + 1))
                  ;;
              esac

            done
          done

          baseline_label() {
            local status="$1"

            case "${status}" in

              reused)
                echo "validated baseline from ${BASE_REF}"
                ;;

              reused-legacy)
                echo "legacy cached baseline from ${BASE_REF}"
                ;;

              generated-input-changed)
                echo "generated · source changed"
                ;;

              generated-preview-missing)
                echo "generated · preview missing"
                ;;

              generated-baseline-incompatible)
                echo "generated · baseline incompatible"
                ;;

              *)
                echo "${status}"
                ;;

            esac
          }

          {
            echo "<!-- bpt-visual-preview -->"
            echo
            echo "## Projection Tool — Visual Comparison"
            echo

            echo "**Base:** \`${BASE_REF}@${BASE_SHORT}\` · **PR:** \`#${PR_NUMBER}@${PR_SHORT}\`"
            echo

            echo "**Geometry:** \`${BASE_MESH_MODE}\` → \`${MESH_MODE}\`"
            echo

            echo "**Material:** \`${BASE_MATERIAL_MODE}\` → \`${MATERIAL_MODE}\`"
            echo

            echo "**Sheets:** ${#SHEETS[@]} · **Profiles:** ${{ steps.config.outputs.profiles }}"
            echo

            echo "**Persistent baseline manifest:** ${{ steps.main-baseline.outputs.has_base_manifest }}"
            echo

            echo "**Geometry baselines:** ${GEOMETRY_REUSED} reused · ${GEOMETRY_GENERATED} generated"
            echo

            echo "**Material baselines:** ${MATERIAL_REUSED} reused · ${MATERIAL_GENERATED} generated"
            echo

            echo "> **L10 is open by default. Material is visible immediately; geometry stays folded. L2 and any optional diagnostic profiles are folded.**"
            echo

            for SHEET in "${SHEETS[@]}"; do

              if [[ "${SHEET}" =~ ^sheet([0-9]+)$ ]]; then
                SHEET_TITLE="Sheet ${BASH_REMATCH[1]}"
              else
                SHEET_TITLE="${SHEET}"
              fi

              echo "---"
              echo
              echo "### ${SHEET_TITLE}"
              echo

              for LEVEL in "${COMMENT_PROFILES[@]}"; do

                ORIGINAL_URL="${RAW_ROOT}/original/${SHEET}.png?v=${PR_SHA}"

                MAIN_MATERIAL_URL="${RAW_ROOT}/main/${SHEET}/${LEVEL}/material.png?v=${PR_SHA}"
                PR_MATERIAL_URL="${RAW_ROOT}/pr/${SHEET}/${LEVEL}/material.png?v=${PR_SHA}"

                MAIN_GEOMETRY_URL="${RAW_ROOT}/main/${SHEET}/${LEVEL}/geometry.png?v=${PR_SHA}"
                PR_GEOMETRY_URL="${RAW_ROOT}/pr/${SHEET}/${LEVEL}/geometry.png?v=${PR_SHA}"

                GSTATUS="$(
                  cat \
                    "visual-compare/status/${SHEET}/${LEVEL}/geometry.txt"
                )"

                MSTATUS="$(
                  cat \
                    "visual-compare/status/${SHEET}/${LEVEL}/material.txt"
                )"

                GEOMETRY_STATUS="$(
                  baseline_label \
                    "${GSTATUS}"
                )"

                MATERIAL_STATUS="$(
                  baseline_label \
                    "${MSTATUS}"
                )"

                if [[ "${LEVEL}" == "L10" ]]; then
                  echo "<details open>"
                else
                  echo "<details>"
                fi

                echo
                echo "<summary><strong>${LEVEL}</strong> — projected material</summary>"
                echo

                echo "| Original | ${BASE_REF} · ${BASE_MATERIAL_MODE} | PR #${PR_NUMBER} · ${MATERIAL_MODE} |"
                echo "| :---: | :---: | :---: |"
                echo "| <a href=\"${ORIGINAL_URL}\"><img src=\"${ORIGINAL_URL}\" width=\"320\"></a> | <a href=\"${MAIN_MATERIAL_URL}\"><img src=\"${MAIN_MATERIAL_URL}\" width=\"320\"></a> | <a href=\"${PR_MATERIAL_URL}\"><img src=\"${PR_MATERIAL_URL}\" width=\"320\"></a> |"
                echo "| source | ${MATERIAL_STATUS} | current PR material |"
                echo

                echo "<details>"
                echo
                echo "<summary>Geometry · ${BASE_MESH_MODE} → ${MESH_MODE}</summary>"
                echo

                echo "| Original | ${BASE_REF} · ${BASE_MESH_MODE} | PR #${PR_NUMBER} · ${MESH_MODE} |"
                echo "| :---: | :---: | :---: |"
                echo "| <a href=\"${ORIGINAL_URL}\"><img src=\"${ORIGINAL_URL}\" width=\"320\"></a> | <a href=\"${MAIN_GEOMETRY_URL}\"><img src=\"${MAIN_GEOMETRY_URL}\" width=\"320\"></a> | <a href=\"${PR_GEOMETRY_URL}\"><img src=\"${PR_GEOMETRY_URL}\" width=\"320\"></a> |"
                echo "| source | ${GEOMETRY_STATUS} | current PR geometry |"
                echo

                echo "</details>"
                echo

                echo "</details>"
                echo

              done
            done

            echo "---"
            echo
            echo "<sub>PR assets are transient. Successful main previews are validated by metadata and committed permanently under docs/previews.</sub>"

          } > "${COMMENT_FILE}"

          cat \
            "${COMMENT_FILE}"


      # -----------------------------------------------------
      # GitHub comment publication is presentation only.
      #
      # A GitHub API failure must not invalidate successful
      # build / reconstruction / rendering / comparison.
      # -----------------------------------------------------

      - name: Update sticky PR comment
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");

            const marker =
              "<!-- bpt-visual-preview -->";

            const body =
              fs.readFileSync(
                "visual-compare/comment.md",
                "utf8"
              );

            const { owner, repo } =
              context.repo;

            const issue_number =
              context.issue.number;

            let comments = [];

            try {

              comments =
                await github.paginate(
                  github.rest.issues.listComments,
                  {
                    owner,
                    repo,
                    issue_number,
                    per_page: 100,
                  }
                );

            } catch (error) {

              core.warning(
                `Unable to list PR comments (${error.status || "unknown"}): ${error.message}`
              );

              await core.summary
                .addHeading(
                  "Projection Tool — Visual Comparison",
                  2
                )
                .addRaw(body)
                .write();

              return;
            }

            const existing =
              comments.find(
                (comment) =>
                  comment.body
                    ?.includes(marker)
              );

            try {

              if (existing) {

                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });

                core.info(
                  `Updated sticky preview comment ${existing.id}`
                );

              } else {

                const created =
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number,
                    body,
                  });

                core.info(
                  `Created sticky preview comment ${created.data.id}`
                );

              }

            } catch (error) {

              core.warning(
                `Unable to update sticky PR comment (${error.status || "unknown"}): ${error.message}`
              );

              await core.summary
                .addHeading(
                  "Projection Tool — Visual Comparison",
                  2
                )
                .addRaw(body)
                .write();

            }


      # =====================================================
      # Summary / artifacts
      # =====================================================

      - name: Generate preview summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "# Native visual preview"
            echo

            echo "Example: **${EXAMPLE_NAME}**"
            echo

            echo "Sheets: **${{ steps.sheets.outputs.sheet_names }}**"
            echo

            echo "Resolution: **${{ steps.config.outputs.resolution }}**"
            echo

            echo "Mesh mode: **${{ steps.config.outputs.mesh_mode }}**"
            echo

            echo "Material mode: **${MATERIAL_MODE}**"
            echo

            echo "Renderer baseline version: **${PREVIEW_RENDERER_VERSION}**"
            echo

            echo "Profiles: **${{ steps.config.outputs.profiles }}**"
            echo

            echo "Views: **${{ steps.config.outputs.views }}**"
            echo

            echo "Render: **${{ steps.config.outputs.size }} × ${{ steps.config.outputs.size }}**"
            echo

            echo "Cycles samples: **${{ steps.config.outputs.samples }}**"
            echo

            echo "## Geometry projection sheets"
            echo

            find visual-preview \
              -type f \
              -name "projection_geometry.png" \
              -print \
              | sort \
              | sed 's/^/- `/' \
              | sed 's/$/`/' \
              || true

            echo

            echo "## Material projection sheets"
            echo

            find visual-preview \
              -type f \
              -name "projection_material.png" \
              -print \
              | sort \
              | sed 's/^/- `/' \
              | sed 's/$/`/' \
              || true

            echo

            echo "## Turntables"
            echo

            find visual-preview \
              -type f \
              -name "contact_sheet.png" \
              -print \
              | sort \
              | sed 's/^/- `/' \
              | sed 's/$/`/' \
              || true

            if [[ "${{ github.event_name }}" == "pull_request" ]]; then

              echo
              echo "## PR comparison"
              echo

              echo "Base mesh mode: **${{ steps.base.outputs.mesh_mode }}**"
              echo

              echo "PR mesh mode: **${{ steps.config.outputs.mesh_mode }}**"
              echo

              echo "Base material mode: **${{ steps.base.outputs.material_mode }}**"
              echo

              echo "PR material mode: **${MATERIAL_MODE}**"
              echo

              echo "Persistent base manifest: **${{ steps.main-baseline.outputs.has_base_manifest }}**"
              echo

              echo "Base reconstructions required: **${{ steps.main-baseline.outputs.missing_count }}**"

            fi

          } >> "${GITHUB_STEP_SUMMARY}"


      - name: Upload visual previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-visual-preview-${{ github.run_number }}
          path: |
            visual-preview/**
            visual-compare/**
            docs/previews/manifest.json
            example/mascotte/test1/generated/**/manifest.json
          if-no-files-found: warn
          retention-days: 14


      # =====================================================
      # Persist main
      #
      # Important:
      #
      # If main changed while this expensive rendering job
      # was running, do NOT push a stale baseline on top.
      #
      # The newer main push owns its own workflow run.
      # =====================================================

      - name: Commit visual documentation
        if: >-
          github.event_name == 'push'
          && github.ref == 'refs/heads/main'
        id: persist
        shell: bash
        run: |
          set -euo pipefail

          git fetch \
            origin \
            main

          REMOTE_MAIN="$(
            git rev-parse \
              origin/main
          )"

          if [[ "${REMOTE_MAIN}" != "${GITHUB_SHA}" ]]; then

            echo
            echo "main advanced while previews were rendering."
            echo "Generated baseline belongs to: ${GITHUB_SHA}"
            echo "Current origin/main is:        ${REMOTE_MAIN}"
            echo
            echo "Skipping stale baseline commit."

            echo \
              "result=stale" \
              >> "${GITHUB_OUTPUT}"

            exit 0

          fi

          CURRENT_BRANCH="$(
            git branch \
              --show-current
          )"

          if [[ "${CURRENT_BRANCH}" != "main" ]]; then
            echo "Expected attached main branch, got: ${CURRENT_BRANCH}"
            exit 1
          fi

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            docs/visual-preview.md \
            docs/previews

          if git diff \
            --cached \
            --quiet
          then

            echo "Visual documentation is already up to date."

            echo \
              "result=up-to-date" \
              >> "${GITHUB_OUTPUT}"

            exit 0

          fi

          git commit \
            -m "docs: update visual preview baseline [skip ci]"

          git push \
            origin \
            HEAD:main

          echo \
            "result=committed" \
            >> "${GITHUB_OUTPUT}"

          echo
          echo "Persistent visual baseline committed to main."


      # =====================================================
      # Find the PR that produced this main commit.
      #
      # This happens AFTER persistence.
      # =====================================================

      - name: Resolve merged PRs
        if: >-
          github.event_name == 'push'
          && github.ref == 'refs/heads/main'
          && steps.persist.outputs.result != 'stale'
        id: merged-prs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pulls =
              await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  commit_sha: context.sha,
                  per_page: 100,
                }
              );

            const merged =
              pulls
                .filter(
                  (pr) =>
                    pr.merged_at
                    && pr.base.ref === "main"
                )
                .map(
                  (pr) => pr.number
                );

            const unique =
              [...new Set(merged)];

            core.info(
              `Merged PRs associated with ${context.sha}: ${unique.join(", ")}`
            );

            core.setOutput(
              "numbers",
              unique.join(" ")
            );


      # =====================================================
      # Now it is safe to delete merged PR assets.
      # =====================================================

      - name: Clean merged PR preview assets
        if: >-
          github.event_name == 'push'
          && github.ref == 'refs/heads/main'
          && steps.persist.outputs.result != 'stale'
          && steps.merged-prs.outputs.numbers != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBERS: ${{ steps.merged-prs.outputs.numbers }}
        shell: bash
        run: |
          set -euo pipefail

          ROOT="${RUNNER_TEMP}/bpt-preview-assets-after-merge"

          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          rm -rf \
            "${ROOT}"

          mkdir -p \
            "${ROOT}"

          cd \
            "${ROOT}"

          git init

          git remote add \
            origin \
            "${REMOTE}"

          if ! git ls-remote \
            --exit-code \
            --heads \
            origin \
            "refs/heads/${ASSET_BRANCH}" \
            >/dev/null 2>&1
          then

            echo "Preview asset branch does not exist."
            exit 0

          fi

          git fetch \
            --depth=1 \
            origin \
            "${ASSET_BRANCH}"

          git checkout \
            -B "${ASSET_BRANCH}" \
            FETCH_HEAD

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          CHANGED="false"

          for PR_NUMBER in ${PR_NUMBERS}; do

            if [[ -d "pr/${PR_NUMBER}" ]]; then

              echo \
                "Removing merged PR #${PR_NUMBER} assets."

              rm -rf \
                "pr/${PR_NUMBER}"

              CHANGED="true"

            fi

          done

          if [[ "${CHANGED}" != "true" ]]; then
            echo "No merged PR preview assets found."
            exit 0
          fi

          git add \
            -A

          if git diff \
            --cached \
            --quiet
          then
            echo "Nothing to commit."
            exit 0
          fi

          git commit \
            -m "preview: clean merged PR assets"

          PUSHED="false"

          for ATTEMPT in 1 2 3; do

            if git push \
              origin \
              "HEAD:refs/heads/${ASSET_BRANCH}"
            then
              PUSHED="true"
              break
            fi

            echo \
              "Asset branch changed concurrently; retry ${ATTEMPT}/3."

            git fetch \
              origin \
              "${ASSET_BRANCH}"

            git rebase \
              "origin/${ASSET_BRANCH}"

          done

          if [[ "${PUSHED}" != "true" ]]; then
            echo "Could not clean merged PR assets."
            exit 1
          fi


      # =====================================================
      # Remove obsolete historical branches.
      #
      # Fixed version: no multiline awk.
      # =====================================================

      - name: Remove legacy preview branches
        if: >-
          github.event_name == 'push'
          && github.ref == 'refs/heads/main'
          && steps.persist.outputs.result != 'stale'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          mapfile -t LEGACY_BRANCHES < <(
            git ls-remote \
              --heads \
              "${REMOTE}" \
              "refs/heads/visual-preview-pr-*" \
              | cut -f2 \
              | sed \
                  's#^refs/heads/##'
          )

          if [[ "${#LEGACY_BRANCHES[@]}" -eq 0 ]]; then
            echo "No legacy preview branches found."
            exit 0
          fi

          echo "Removing legacy preview branches:"

          printf '  - %s\n' \
            "${LEGACY_BRANCHES[@]}"

          for BRANCH in "${LEGACY_BRANCHES[@]}"; do

            git push \
              "${REMOTE}" \
              --delete \
              "${BRANCH}"

          done